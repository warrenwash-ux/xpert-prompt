<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpert Prompt — Specify Everything. Leave Nothing to Chance.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAFF;
  --bg-raised:#F7F4FE;
  --panel:#FFFFFF;
  --panel-2:#F3EEFF;
  --border:#E3DBFC;
  --border-soft:#ECE6FD;
  --text:#211A36;
  --text-dim:#6B6483;
  --text-faint:#9C93B8;
  --gold:#7C3AED;
  --gold-dim:#C9B3FA;
  --cyan:#06B6D4;
  --green:#22C55E;
  --orange:#F97316;
  --red:#EF4444;
  --green-text:#15803D;
  --orange-text:#C2410C;
  --red-text:#B91C1C;
  --cyan-text:#0E7490;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Public Sans',sans-serif;}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
::selection{background:var(--gold);color:#FFFFFF;}
button{font-family:'Public Sans',sans-serif;cursor:pointer;}
textarea,input,select{font-family:'Public Sans',sans-serif;}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:5px;z-index:100;
  background:linear-gradient(90deg,#7C3AED,#E8368F,#14B8A6,#F2762E,#2F8FE0,#E0AA1B,#F0426B,#2FAE6B,#5B62E0,#E5433B);}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh;margin-top:5px;}
#sidebar{width:250px;flex-shrink:0;background:var(--bg-raised);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;}
#main{flex:1;min-width:0;padding:28px 34px 80px;}

.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px 14px;border-bottom:1px solid var(--border);}
.brand .mark{font-size:20px;font-weight:700;letter-spacing:0.5px;}
.brand .mark span{color:var(--gold);}
.brand .tagline{font-size:11px;color:var(--text-faint);letter-spacing:0.3px;}

.side-section{display:flex;flex-direction:column;gap:6px;}
.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-faint);padding:0 6px;margin-bottom:2px;}
.side-btn{background:transparent;border:1px solid transparent;color:var(--text-dim);text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;display:flex;align-items:center;gap:8px;transition:.15s;}
.side-btn:hover{background:var(--panel);color:var(--text);}
.side-btn.active{background:var(--panel-2);color:var(--text);border-color:var(--border);}
.side-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
.side-btn.active .dot{background:var(--gold);}

#projectPicker{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;}
.new-project-btn{width:100%;background:transparent;border:1px dashed var(--border);color:var(--text-dim);padding:8px;border-radius:8px;font-size:12.5px;}
.new-project-btn:hover{border-color:var(--gold-dim);color:var(--gold);}

/* ---------- gauge ---------- */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 4px;}
.gauge-pct{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
.gauge-sub{font-size:10.5px;color:var(--text-faint);text-align:center;}

/* ---------- header ---------- */
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:20px;flex-wrap:wrap;}
.page-header h1{font-size:22px;margin:0 0 4px;}
.page-header .sub{color:var(--text-dim);font-size:13px;max-width:640px;line-height:1.5;}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- buttons ---------- */
.btn{border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.btn:hover{border-color:var(--text-faint);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#FFFFFF;font-weight:600;}
.btn-gold:hover{background:#6A2FD9;}
.btn-ghost{background:transparent;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{color:var(--red);}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
.switch{width:36px;height:20px;border-radius:20px;background:var(--panel-2);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:.15s;}
.switch.on{background:var(--gold-dim);border-color:var(--gold);}
.switch .knob{position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:.15s;}
.switch.on .knob{left:17px;background:var(--gold);}

/* ---------- cards / locks ---------- */
.lock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.lock-card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--lock-color,var(--border));border-radius:var(--radius);overflow:hidden;}
.lock-card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;}
.lock-card-head:hover{background:var(--panel-2);}
.lock-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;}
.lock-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--lock-color,var(--text-faint));width:18px;font-weight:600;}
.status-chip{font-size:10px;text-transform:uppercase;letter-spacing:0.6px;padding:3px 8px;border-radius:20px;font-weight:600;}
.status-complete{background:rgba(34,197,94,0.15);color:var(--green-text);}
.status-partial{background:rgba(249,115,22,0.15);color:var(--orange-text);}
.status-missing{background:rgba(239,68,68,0.15);color:var(--red-text);}
.lock-body{padding:0 16px 16px;display:none;flex-direction:column;gap:10px;}
.lock-body.open{display:flex;}
.chev{color:var(--text-faint);transition:transform .15s;font-size:11px;}
.chev.open{transform:rotate(90deg);}

.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;}
.field input,.field select,.field textarea{background:var(--bg-raised);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:13px;width:100%;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold-dim);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.field-warn{border-color:var(--orange) !important;}
.warn-note{font-size:11px;color:var(--orange);display:flex;align-items:center;gap:5px;}
.warn-note.crit{color:var(--red);}

.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);}
.chk input{width:14px;height:14px;accent-color:var(--gold);}

/* multi-entity (characters/props) */
.entity-list{display:flex;flex-direction:column;gap:12px;}
.entity{border:1px solid var(--border-soft);border-radius:8px;padding:12px;background:var(--bg-raised);}
.entity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.entity-head input.name-input{font-weight:600;font-size:13.5px;background:transparent;border:none;color:var(--text);padding:2px 0;border-bottom:1px dashed transparent;}
.entity-head input.name-input:focus{border-bottom:1px dashed var(--gold-dim);outline:none;}
.remove-x{background:transparent;border:none;color:var(--text-faint);font-size:16px;line-height:1;padding:2px 6px;}
.remove-x:hover{color:var(--red);}

/* ---------- library grid ---------- */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.lib-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.lib-card h4{margin:0 0 4px;font-size:14px;}
.lib-card .meta{font-size:11.5px;color:var(--text-faint);margin-bottom:8px;}
.lib-card-actions{display:flex;gap:6px;margin-top:8px;}

/* section blocks */
.section-block{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
.section-block h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;}

/* ---------- audit panel ---------- */
.audit-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.audit-item{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 10px;border-radius:7px;background:var(--bg-raised);}
.audit-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;padding:2px 6px;border-radius:5px;flex-shrink:0;margin-top:1px;}
.audit-tag.CRITICAL{background:rgba(239,68,68,0.2);color:var(--red-text);}
.audit-tag.IMPORTANT{background:rgba(249,115,22,0.2);color:var(--orange-text);}
.audit-tag.OPTIONAL{background:rgba(155,161,168,0.2);color:var(--text-dim);}

/* strict mode modal */
.overlay{position:fixed;inset:0;background:rgba(10,11,13,0.7);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:8vh 16px 24px;}
.overlay.show{display:flex;}
.modal{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:420px;width:90%;}
.modal h4{margin:0 0 8px;font-size:15px;}
.modal p{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0 0 16px;}
.modal-actions{display:flex;flex-direction:column;gap:8px;}

/* ---------- output ---------- */
.output-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.output-tab{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:20px;font-size:12px;}
.output-tab.active{background:var(--gold);color:#FFFFFF;border-color:var(--gold);font-weight:600;}
.output-box{background:var(--bg-raised);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;color:var(--text);max-height:480px;overflow-y:auto;}
.char-count{font-size:11px;color:var(--text-faint);margin-top:6px;text-align:right;}

.readiness-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:0.3px;}
.r-EXCELLENT{background:rgba(34,197,94,0.15);color:var(--green-text);}
.r-GOOD{background:rgba(6,182,212,0.15);color:var(--cyan-text);}
.r-NEEDS{background:rgba(249,115,22,0.15);color:var(--orange-text);}
.r-HIGH{background:rgba(239,68,68,0.15);color:var(--red-text);}

.qc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px;}
.qc-item{background:var(--bg-raised);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
.qc-item .label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.4px;}
.qc-item .bar{height:5px;background:var(--panel-2);border-radius:3px;margin-top:6px;overflow:hidden;}
.qc-item .bar-fill{height:100%;background:var(--gold);}
.qc-item .score{font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:4px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
.empty-state h3{color:var(--text-dim);margin-bottom:6px;}

.version-list{display:flex;flex-direction:column;gap:8px;}
.version-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg-raised);border:1px solid var(--border-soft);border-radius:8px;padding:10px 14px;}
.version-item .v-meta{font-size:12px;color:var(--text-faint);}

textarea.doctor-input{min-height:160px;}

@media(max-width:880px){
  #app{flex-direction:column;}
  #sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;}
  .side-section{flex:1;min-width:140px;}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">XPERT <span>PROMPT</span></div>
      <div class="tagline">Specify everything. Leave nothing to chance.</div>
      <div style="font-size:9px;color:var(--text-faint);opacity:0.6;margin-top:2px;">build: keyboard-safe-modals-v1</div>
    </div>

    <div class="side-section">
      <div class="side-label">Project</div>
      <select id="projectPicker"></select>
      <button class="new-project-btn" onclick="createProject()">+ New project</button>
    </div>

    <div class="gauge-wrap" id="gaugeWrap" title="Overall completeness across the 10 locks"></div>

    <div class="side-section">
      <div class="side-label">Workspace</div>
      <button class="side-btn active" data-view="bible" onclick="setView('bible')"><span class="dot"></span>Project Bible</button>
      <button class="side-btn" data-view="library" onclick="setView('library')"><span class="dot"></span>Asset Library</button>
      <button class="side-btn" data-view="knowledge" onclick="setView('knowledge')"><span class="dot"></span>Project Knowledge</button>
      <button class="side-btn" data-view="builder" onclick="setView('builder')"><span class="dot"></span>Shot Builder</button>
      <button class="side-btn" data-view="output" onclick="attemptGoToOutput()"><span class="dot"></span>Prompt Output</button>
      <button class="side-btn" data-view="doctor" onclick="setView('doctor')"><span class="dot"></span>Prompt Doctor</button>
      <button class="side-btn" data-view="versions" onclick="setView('versions')"><span class="dot"></span>Version History</button>
    </div>

    <div class="side-section" style="margin-top:auto;">
      <div class="toggle" style="padding:8px 6px;">
        <div class="switch" id="strictSwitch" onclick="toggleStrict()"><div class="knob"></div></div>
        <span>Strict Production Mode</span>
      </div>
      <button class="side-btn" onclick="openAISettingsModal()" id="aiSettingsBtn"><span class="dot"></span>AI Settings</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="overlay" id="strictOverlay">
  <div class="modal">
    <h4 id="strictModalTitle">Detail may be inferred</h4>
    <p id="strictModalBody">This detail may be inferred by the image/video model. Define it before generating?</p>
    <div class="modal-actions">
      <button class="btn btn-gold" onclick="strictResolve('define')">Define now</button>
      <button class="btn" onclick="strictResolve('allow')">Allow model to interpret</button>
      <button class="btn btn-ghost" onclick="strictResolve('skip')">Not important</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.8.162/pdf.min.js"></script>
<script>
if(typeof pdfjsLib !== 'undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.8.162/pdf.worker.min.js';
}
</script>
<script>
/* =========================================================
   XPERT PROMPT — data model & core logic
   Storage: localStorage, key "perfectPrompt_projects_v1"
   ========================================================= */

const STORAGE_KEY = 'perfectPrompt_projects_v1';
const AI_CONFIG_KEY = 'xp_ai_config';

function getAIConfig(){
  try{
    const raw = localStorage.getItem(AI_CONFIG_KEY);
    return raw ? JSON.parse(raw) : { apiKey: '' };
  }catch(e){ return { apiKey: '' }; }
}
function saveAIConfig(apiKey){
  try{ localStorage.setItem(AI_CONFIG_KEY, JSON.stringify({ apiKey })); }catch(e){ console.error('Could not save AI config', e); }
}
function hasAIKey(){ return !!(getAIConfig().apiKey || '').trim(); }

function openAISettingsModal(message){
  const existing = document.getElementById('aiSettingsOverlay');
  if(existing) existing.remove();
  const config = getAIConfig();
  const overlay = document.createElement('div');
  overlay.id = 'aiSettingsOverlay';
  overlay.className = 'overlay show';
  overlay.innerHTML = `<div class="modal" style="max-width:440px;">
    <h4>AI Settings</h4>
    <p>${escapeHtml(message || "Xpert Prompt calls the Anthropic API directly from your browser to analyze project sources and answer Ask Project questions. Your key is stored only in this browser's local storage — never sent anywhere except api.anthropic.com.")}</p>
    <div class="field" style="margin-bottom:14px;">
      <label>Anthropic API key</label>
      <input type="password" id="aiKeyInput" placeholder="sk-ant-..." value="${escapeHtml(config.apiKey||'')}">
    </div>
    <div class="modal-actions">
      <button class="btn btn-gold" id="saveAIKeyBtn">Save key</button>
      <button class="btn btn-ghost" onclick="document.getElementById('aiSettingsOverlay').remove()">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#saveAIKeyBtn').onclick = ()=>{
    const val = overlay.querySelector('#aiKeyInput').value.trim();
    saveAIConfig(val);
    overlay.remove();
    renderAll();
  };
}
const PLATFORMS = ['Generic Image Model','Generic Video Model','ChatGPT Image Generation','Runway','Veo','Kling','Hailuo','Midjourney','Sora','Leonardo','Stable Diffusion'];
const MODES = ['Image Prompt','Video / Animation Prompt','Image Edit Prompt','Character Reference Prompt','Environment / Set Design Prompt','Product / Object Design Prompt','Storyboard Shot Prompt'];

const LOCK_DEFS = [
  {key:'style', label:'Style Lock', critical:['visualMedium','styleDescription'], important:['realismLevel','renderFeel'], optional:['colorLanguage','textureLevel','styleReferences']},
  {key:'character', label:'Character Lock', critical:['__chars_min1'], important:['currentEmotion','currentPose'], optional:['eyeDirection','movementSpeed']},
  {key:'set', label:'Set / Environment Lock', critical:['setName','timeOfDay'], important:['weather','architecturalStyle'], optional:['backgroundDensity','environmentalWear']},
  {key:'wardrobe', label:'Wardrobe Lock', critical:['__wardrobe_min1'], important:['condition'], optional:['fabric','jewelry']},
  {key:'prop', label:'Prop / Technology Lock', critical:[], important:['propState'], optional:['propName']},
  {key:'camera', label:'Camera Lock', critical:['shotType'], important:['lensLength','cameraDistance'], optional:['depthOfField','composition']},
  {key:'lighting', label:'Lighting / Atmosphere Lock', critical:['keyLight'], important:['lightDirection','lightTemperature'], optional:['atmosphere','mood']},
  {key:'action', label:'Action / Movement Lock', critical:['primaryAction'], important:['cameraMovementDuringAction'], optional:['secondaryAction','timing']},
  {key:'continuity', label:'Continuity Lock', critical:['priorShotContinuity'], important:['wardrobeState','propState2'], optional:['screenDirection','eyelineContinuity']},
  {key:'forbidden', label:'Forbidden Deviations Lock', critical:[], important:['forbiddenChecks'], optional:['customForbidden']},
];

const REF_VIEW_TYPES = ['MASTER CANON','FRONT VIEW','3/4 VIEW','SIDE VIEW','BACK VIEW','FULL BODY','FACE / CLOSE-UP','EXPRESSION','WARDROBE','POSE','DETAIL','OTHER'];
const REF_AUTHORITY_LEVELS = ['MASTER CANON','APPROVED REFERENCE','SUPPORTING REFERENCE','INSPIRATION ONLY'];
const REF_CONTROLS = ['FACE IDENTITY','HAIR','SKIN TONE','BODY PROPORTIONS','AGE APPEARANCE','WARDROBE','FOOTWEAR','ACCESSORIES','POSE','COLOR','MATERIAL','OTHER'];
const REF_COLLECTIONS = ['characters','sets','props']; // asset types that support reference images

function getEntity(proj, collection, id){ return (proj[collection]||[]).find(x=>x.id===id); }

function migrateReferenceImages(proj){
  REF_COLLECTIONS.forEach(collection=>{
    (proj[collection]||[]).forEach(entity=>{
      if(!Array.isArray(entity.referenceImages)) entity.referenceImages = [];
    });
  });
}

const LOCK_COLORS = {
  style:'#7C3AED', character:'#E8368F', set:'#14B8A6', wardrobe:'#F2762E', prop:'#2F8FE0',
  camera:'#E0AA1B', lighting:'#F0426B', action:'#2FAE6B', continuity:'#5B62E0', forbidden:'#E5433B',
};

/* Strict Production Mode — the exact set of critical gaps that must be explicitly
   resolved (define / allow AI to interpret / not important) before generating,
   when Strict Mode is on. Kept separate from evaluateLock's audit messages because
   these need stable ids to remember the user's choice per field. */
const CRITICAL_GAP_DEFS = [
  {id:'style::visualMedium', lockKey:'style', label:'Visual medium (Style Lock)', check:(shot)=>!fieldFilled(shot.style.visualMedium)},
  {id:'style::styleDescription', lockKey:'style', label:'Style description (Style Lock)', check:(shot)=>!fieldFilled(shot.style.styleDescription)},
  {id:'character::hasAny', lockKey:'character', label:'At least one character attached (Character Lock)', check:(shot)=>shot.characterRefs.length===0},
  {id:'set::setName', lockKey:'set', label:'Set name (Set / Environment Lock)', check:(shot)=>!fieldFilled(shot.set.setName)},
  {id:'set::timeOfDay', lockKey:'set', label:'Time of day (Set / Environment Lock)', check:(shot)=>!fieldFilled(shot.set.timeOfDay)},
  {id:'wardrobe::hasAny', lockKey:'wardrobe', label:'Wardrobe defined for attached characters (Wardrobe Lock)', check:(shot)=> shot.characterRefs.length>0 && shot.wardrobeRefs.length===0},
  {id:'camera::shotType', lockKey:'camera', label:'Shot type (Camera Lock)', check:(shot)=>!fieldFilled(shot.camera.shotType)},
  {id:'lighting::keyLight', lockKey:'lighting', label:'Key light (Lighting Lock)', check:(shot)=>!fieldFilled(shot.lighting.keyLight)},
  {id:'action::primaryAction', lockKey:'action', label:'Primary action (Action Lock)', check:(shot)=>!fieldFilled(shot.action.primaryAction)},
  {id:'continuity::priorShotContinuity', lockKey:'continuity', label:'Prior-shot continuity summary (Continuity Lock)', check:(shot)=>!fieldFilled(shot.continuity.priorShotContinuity)},
];

function getUnresolvedCriticalGaps(proj){
  const shot = proj.shot;
  const resolutions = shot.strictResolutions || {};
  return CRITICAL_GAP_DEFS.filter(def=> def.check(shot) && !resolutions[def.id]);
}

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function blankShot(){
  return {
    style:{ visualMedium:'', styleDescription:'', realismLevel:'', renderFeel:'', colorLanguage:'', textureLevel:'', styleReferences:'', mustInclude:'', mustNotInclude:'' },
    characterRefs:[], // {charId, currentEmotion, currentPose, eyeDirection, headDirection, movementSpeed, positionInFrame, continuityState}
    set:{ setName:'', location:'', timeOfDay:'', weather:'', interiorExterior:'', architecturalStyle:'', backgroundDensity:'', environmentalWear:'', setContinuity:'' },

/* ---------------- completeness engine ---------------- */

function fieldFilled(v){
  if(v===undefined||v===null) return false;
  if(typeof v==='boolean') return true;
  if(typeof v==='string') return v.trim().length>0;
  if(Array.isArray(v)) return v.length>0;
  if(typeof v==='object') return Object.values(v).some(x=> (typeof x==='string'? x.trim().length>0 : !!x));
  return !!v;
}

function evaluateLock(proj, lockKey){
  const shot = proj.shot;
  const missing = { CRITICAL:[], IMPORTANT:[], OPTIONAL:[] };
  const def = LOCK_DEFS.find(l=>l.key===lockKey);

  function check(section, fieldKey, label, severity){
    if(fieldKey==='__chars_min1'){
      if(shot.characterRefs.length===0) missing.CRITICAL.push('No character reference attached to this shot.');
      return;
    }
    if(fieldKey==='__wardrobe_min1'){
      if(shot.characterRefs.length>0 && shot.wardrobeRefs.length===0) missing.CRITICAL.push('Wardrobe not defined for any character.');
      return;
    }
    const val = section ? section[fieldKey] : undefined;
    if(!fieldFilled(val)) missing[severity].push(`${label} undefined`);
  }

  if(lockKey==='style'){
    check(shot.style,'visualMedium','Visual medium','CRITICAL');
    check(shot.style,'styleDescription','Style description','CRITICAL');
    check(shot.style,'realismLevel','Realism level','IMPORTANT');
    check(shot.style,'renderFeel','Render feel','IMPORTANT');
    check(shot.style,'colorLanguage','Color language','OPTIONAL');
    check(shot.style,'styleReferences','Style references','OPTIONAL');
  } else if(lockKey==='character'){
    check(null,'__chars_min1','','CRITICAL');
    if(shot.characterRefs.length){
      shot.characterRefs.forEach(cr=>{
        const c = proj.characters.find(x=>x.id===cr.charId);
        const nm = c? c.name : 'Character';
        if(!fieldFilled(cr.currentEmotion)) missing.IMPORTANT.push(`${nm}: current emotion undefined`);
        if(!fieldFilled(cr.currentPose)) missing.IMPORTANT.push(`${nm}: current pose undefined`);
        if(!fieldFilled(cr.eyeDirection)) missing.OPTIONAL.push(`${nm}: eye direction undefined`);
        if(!fieldFilled(cr.continuityState)) missing.IMPORTANT.push(`${nm}: continuity state (what happened just before) undefined`);
        if(!c || (c.referenceImages||[]).length===0) missing.IMPORTANT.push(`${nm}: text canon present, visual reference MISSING — drift risk`);
      });
    }
  } else if(lockKey==='set'){
    check(shot.set,'setName','Set name','CRITICAL');
    check(shot.set,'timeOfDay','Time of day','CRITICAL');
    check(shot.set,'weather','Weather','IMPORTANT');
    check(shot.set,'architecturalStyle','Architectural style','IMPORTANT');
    check(shot.set,'backgroundDensity','Background population','OPTIONAL');
    check(shot.set,'environmentalWear','Environmental wear','OPTIONAL');
  } else if(lockKey==='wardrobe'){
    check(null,'__wardrobe_min1','','CRITICAL');
    shot.wardrobeRefs.forEach(wr=>{
      const c = proj.characters.find(x=>x.id===wr.charId);
      const nm = c? c.name : 'Character';
      if(!fieldFilled(wr.top) && !fieldFilled(wr.bottom)) missing.IMPORTANT.push(`${nm}: top/bottom wardrobe undefined`);
      if(!fieldFilled(wr.condition)) missing.IMPORTANT.push(`${nm}: wardrobe condition undefined`);
    });
  } else if(lockKey==='prop'){
    if(shot.props.length===0) missing.OPTIONAL.push('No props defined for this shot');
    shot.props.forEach(p=>{
      if(!fieldFilled(p.state)) missing.IMPORTANT.push(`${p.propName||'Prop'}: state undefined`);
    });
  } else if(lockKey==='camera'){
    check(shot.camera,'shotType','Shot type','CRITICAL');
    check(shot.camera,'lensLength','Lens / focal length','IMPORTANT');
    check(shot.camera,'cameraDistance','Camera distance','IMPORTANT');
    check(shot.camera,'depthOfField','Depth of field','OPTIONAL');
    check(shot.camera,'composition','Composition style','OPTIONAL');
  } else if(lockKey==='lighting'){
    check(shot.lighting,'keyLight','Key light','CRITICAL');
    check(shot.lighting,'lightDirection','Light direction','IMPORTANT');
    check(shot.lighting,'lightTemperature','Light temperature','IMPORTANT');
    check(shot.lighting,'atmosphere','Atmospheric effects','OPTIONAL');
    check(shot.lighting,'mood','Mood','OPTIONAL');
  } else if(lockKey==='action'){
    check(shot.action,'primaryAction','Primary action','CRITICAL');
    check(shot.action,'secondaryAction','Secondary action','OPTIONAL');
    check(shot.action,'timing','Timing','OPTIONAL');
  } else if(lockKey==='continuity'){
    check(shot.continuity,'priorShotContinuity','Prior-shot continuity summary','CRITICAL');
    check(shot.continuity,'wardrobeState','Wardrobe state','IMPORTANT');
    check(shot.continuity,'propState2','Prop state','IMPORTANT');
    check(shot.continuity,'screenDirection','Screen direction','OPTIONAL');
    check(shot.continuity,'eyelineContinuity','Eyeline continuity','OPTIONAL');
  } else if(lockKey==='forbidden'){
    const anyChecked = Object.values(shot.forbidden.checks||{}).some(v=>v);
    if(!anyChecked && !fieldFilled(shot.forbidden.customForbidden)) missing.IMPORTANT.push('No forbidden deviations selected');
  }

  const totalFields = missing.CRITICAL.length + missing.IMPORTANT.length + missing.OPTIONAL.length;
  let status = 'complete';
  if(missing.CRITICAL.length>0) status = 'missing';
  else if(missing.IMPORTANT.length>0 || missing.OPTIONAL.length>0) status = totalFields>0 ? 'partial' : 'complete';
  if(missing.CRITICAL.length===0 && missing.IMPORTANT.length===0 && missing.OPTIONAL.length===0) status='complete';

  return { missing, status };
}

function computeCompleteness(proj){
  let weightedFilled = 0, weightedTotal = 0;
  const weights = {CRITICAL:3, IMPORTANT:2, OPTIONAL:1};
  const perLock = {};
  LOCK_DEFS.forEach(def=>{
    const ev = evaluateLock(proj, def.key);
    perLock[def.key] = ev;
    const critSlots = def.critical.length || (def.key==='character'?1:def.key==='wardrobe'?1:0);
    const impSlots = def.important.length;
    const optSlots = def.optional.length;
    // approximate total possible slots as fixed baseline per lock type (use missing+some assumed filled baseline of 1 each)
    const critMissing = ev.missing.CRITICAL.length;
    const impMissing = ev.missing.IMPORTANT.length;
    const optMissing = ev.missing.OPTIONAL.length;
    const critTotal = Math.max(critSlots,1);
    const impTotal = Math.max(impSlots,1);
    const optTotal = Math.max(optSlots,1);
    weightedFilled += weights.CRITICAL*(critTotal-Math.min(critMissing,critTotal)) + weights.IMPORTANT*(impTotal-Math.min(impMissing,impTotal)) + weights.OPTIONAL*(optTotal-Math.min(optMissing,optTotal));
    weightedTotal += weights.CRITICAL*critTotal + weights.IMPORTANT*impTotal + weights.OPTIONAL*optTotal;
  });
  const pct = weightedTotal>0 ? Math.round((weightedFilled/weightedTotal)*100) : 0;
  return { pct, perLock };
}

function readinessLabel(pct, anyCritical){
  if(anyCritical) return {label:'HIGH DRIFT RISK', cls:'r-HIGH'};
  if(pct>=90) return {label:'EXCELLENT', cls:'r-EXCELLENT'};
  if(pct>=75) return {label:'GOOD', cls:'r-GOOD'};
  return {label:'NEEDS DETAIL', cls:'r-NEEDS'};
}

function renderGauge(){
  const proj = activeProject();
  const { pct, perLock } = computeCompleteness(proj);
  const anyCritical = LOCK_DEFS.some(d=>perLock[d.key].missing.CRITICAL.length>0);
  const r = readinessLabel(pct, anyCritical);
  const wrap = document.getElementById('gaugeWrap');

  const size=96, cx=size/2, cy=size/2, radius=40, segGap=4;
  const segCount = LOCK_DEFS.length;
  const segAngle = (360-segGap*segCount)/segCount;
  let svgSegs='';
  LOCK_DEFS.forEach((d,i)=>{
    const ev = perLock[d.key];
    let color = 'var(--text-faint)';
    if(ev.status==='complete') color='var(--green)';
    else if(ev.status==='partial') color='var(--orange)';
    else if(ev.status==='missing') color='var(--red)';
    const startAngle = i*(segAngle+segGap) - 90;
    const endAngle = startAngle+segAngle;
    svgSegs += arcPath(cx,cy,radius,startAngle,endAngle,color,d.key);
  });

  wrap.innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${svgSegs}
    </svg>
    <div class="gauge-pct">${pct}%</div>
    <span class="readiness-badge ${r.cls}" style="font-size:10px;padding:3px 9px;">${r.label}</span>
    <div class="gauge-sub">Click a segment to jump to that lock</div>
  `;
  wrap.querySelectorAll('path').forEach(p=>{
    p.style.cursor='pointer';
    p.addEventListener('click', ()=>{
      setView('builder');
      setTimeout(()=>{ openLocks[p.dataset.lock]=true; renderAll(); document.getElementById('lock-'+p.dataset.lock)?.scrollIntoView({behavior:'smooth',block:'center'}); },50);
    });
  });
}

function arcPath(cx,cy,r,startDeg,endDeg,color,lockKey){
  const toRad = d=> d*Math.PI/180;
  const x1 = cx + r*Math.cos(toRad(startDeg));
  const y1 = cy + r*Math.sin(toRad(startDeg));
  const x2 = cx + r*Math.cos(toRad(endDeg));
  const y2 = cy + r*Math.sin(toRad(endDeg));
  const largeArc = (endDeg-startDeg)>180?1:0;
  return `<path data-lock="${lockKey}" d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" stroke="${color}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
}

/* ============================================================
   VISUAL REFERENCE IMAGE SYSTEM
   Generic across characters, sets, and props — same structure,
   same functions, parameterized by collection name. Text tells
   the generator what something is; the approved reference shows
   it who/what it is. Both are kept, never one discarded for the other.
   ============================================================ */

function openReferenceManager(collection, assetId){
  renderReferenceManagerModal(collection, assetId);
}

function closeReferenceManager(){
  const el = document.getElementById('refManagerOverlay');
  if(el) el.remove();
}

function structuralReferenceConflicts(entity){
  // Flags when 2+ non-"INSPIRATION ONLY" references both claim authority
  // over the same control (e.g. two images both dictating FACE IDENTITY)
  // without one being clearly senior (MASTER CANON) to the other.
  const refs = (entity.referenceImages||[]).filter(r=>r.authorityLevel!=='INSPIRATION ONLY');
  const byControl = {};
  refs.forEach(r=>{
    (r.controls||[]).forEach(c=>{
      (byControl[c] = byControl[c]||[]).push(r);
    });
  });
  const conflicts = [];
  Object.entries(byControl).forEach(([control, list])=>{
    if(list.length<2) return;
    const hasMaster = list.some(r=>r.authorityLevel==='MASTER CANON');
    if(!hasMaster){
      conflicts.push({ control, count: list.length });
    }
  });
  return conflicts;
}

function renderReferenceManagerModal(collection, assetId){
  closeReferenceManager();
  const proj = activeProject();
  const entity = getEntity(proj, collection, assetId);
  if(!entity) return;
  if(!Array.isArray(entity.referenceImages)) entity.referenceImages = [];
  const refs = entity.referenceImages;
  const conflicts = structuralReferenceConflicts(entity);

  const overlay = document.createElement('div');
  overlay.id = 'refManagerOverlay';
  overlay.className = 'overlay show';
  overlay.innerHTML = `<div class="modal" style="max-width:680px;max-height:85vh;overflow-y:auto;">
    <h4>Manage References — ${escapeHtml(entity.name||'Unnamed')}</h4>
    <p>Upload reference images and define what each one controls. Text tells the generator what this is; these images show it who/what it is.</p>

    <input type="file" multiple accept="image/*" id="refUploadInput" style="margin-bottom:14px;">

    ${conflicts.length ? `<div style="background:rgba(239,68,68,0.1);border:1px solid var(--red);border-radius:8px;padding:10px 12px;margin-bottom:14px;">
      <strong style="color:var(--red-text);font-size:12.5px;">⚠ Visual Reference Conflict</strong>
      <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">
        ${conflicts.map(c=>`${c.count} references both claim authority over <strong>${escapeHtml(c.control)}</strong> with no Master Canon to break the tie.`).join('<br>')}
        Pick which reference should be Master Canon for this, or narrow what each one controls.
      </div>
    </div>` : ''}

    ${refs.length>1 ? `<button class="btn btn-sm" id="checkVisualConsistencyBtn" style="margin-bottom:14px;">Check visual consistency with AI</button>
    <div id="visualConsistencyResult"></div>` : ''}

    <div class="lib-grid" id="refImageGrid">
      ${refs.length ? refs.map(r=>referenceImageCard(collection, assetId, r)).join('') : '<div class="empty-state" style="grid-column:1/-1;padding:20px;">No reference images yet — upload above.</div>'}
    </div>

    <div class="modal-actions" style="flex-direction:row;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-gold" onclick="closeReferenceManager()">Done</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#refUploadInput').addEventListener('change', function(){
    handleReferenceUpload(collection, assetId, this);
  });
  const consistencyBtn = overlay.querySelector('#checkVisualConsistencyBtn');
  if(consistencyBtn) consistencyBtn.onclick = ()=> checkVisualConsistency(collection, assetId);
}

function handleReferenceUpload(collection, assetId, input){
  const files = Array.from(input.files||[]);
  const proj = activeProject();
  const entity = getEntity(proj, collection, assetId);
  if(!entity) return;
  let pending = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      entity.referenceImages.push({
        id: uid(),
        imageData: e.target.result.split(',')[1],
        mediaType: file.type || 'image/jpeg',
        viewType: 'OTHER',
        authorityLevel: entity.referenceImages.length===0 ? 'MASTER CANON' : 'SUPPORTING REFERENCE',
        controls: [],
        notes: '',
        addedAt: Date.now(),
      });
      pending--;
      if(pending===0){ save(); renderReferenceManagerModal(collection, assetId); renderAll(); }
    };
    reader.readAsDataURL(file);
  });
}

async function checkVisualConsistency(collection, assetId){
  const proj = activeProject();

  if(refs.length<2){ if(resultEl) resultEl.textContent = 'Need at least two non-inspiration references to compare.'; return; }
  if(resultEl) resultEl.innerHTML = `<div class="sub">Comparing ${refs.length} reference images…</div>`;
  const content = [
    { type:'text', text: `These are reference images for "${entity.name}". Each is labeled with what it's meant to control. Identify any real visual inconsistencies BETWEEN images that claim authority over the same attribute (e.g. two images both meant to control face identity, but showing different faces). Be specific and concrete. If everything looks consistent, say so plainly. Do not invent problems.\n\nLabels:\n${refs.map((r,i)=>`Image ${i+1}: controls [${(r.controls||[]).join(', ')||'unspecified'}], authority: ${r.authorityLevel}`).join('\n')}` },
    ...refs.map(r=>({ type:'image', source:{ type:'base64', media_type:r.mediaType, data:r.imageData } })),
  ];
  try{
    const answer = await callClaude('You are a visual continuity checker for a production tool. Be concrete, brief, and only flag real inconsistencies you can actually see.', content);
    if(resultEl) resultEl.innerHTML = `<div class="output-box" style="font-family:'Public Sans',sans-serif;margin-top:8px;">${escapeHtml(answer)}</div>`;
  }catch(e){
    if(resultEl) resultEl.textContent = (e.code==='NO_API_KEY') ? 'Add your API key in AI Settings first.' : 'Could not complete the check — try again.';
  }
}

/* ============================================================
   PROJECT KNOWLEDGE — universal ingestion, extraction, review,
   conflict detection, and context-aware retrieval.
   Uses the Anthropic API directly from this artifact.
   ============================================================ */

async function callClaude(systemPrompt, userContent, maxTokens){
  const config = getAIConfig();
  if(!config.apiKey || !config.apiKey.trim()){
    const err = new Error('NO_API_KEY');
    err.code = 'NO_API_KEY';
    throw err;
  }
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": config.apiKey.trim(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: maxTokens || 1000,
      system: systemPrompt,
      messages: [{ role:"user", content: userContent }],
    })
  });
  const data = await response.json();
  if(data.type==='error'){
    const err = new Error(data.error?.message || 'API_ERROR');
    err.code = 'API_ERROR';
    throw err;
  }
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
  return textBlocks.join('\n');
}

function parseJsonSafe(text){
  let cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  const firstBracket = cleaned.indexOf('[');
  const firstBrace = cleaned.indexOf('{');
  let start = -1;
  if(firstBracket>=0 && (firstBrace<0 || firstBracket<firstBrace)) start = firstBracket;
  else if(firstBrace>=0) start = firstBrace;
  if(start>0) cleaned = cleaned.slice(start);
  try{ return JSON.parse(cleaned); }catch(e){ return null; }
}

function chunkText(text, size){
  const chunks = [];
  for(let i=0;i<text.length;i+=size) chunks.push(text.slice(i,i+size));
  return chunks;
}

/* ============================================================
   SMART AUTOFILL — one-box ingestion.
   User pastes messy free text -> Claude sorts it into the 10 locks,
   matching named characters/sets/props against the Asset Library and
   Project Knowledge -> nothing is applied until the user reviews it.
   Every proposed value carries a source and confidence; low-confidence
   / inferred values start UNCHECKED so nothing slips in silently.
   ============================================================ */

const AUTOFILL_SIMPLE_LOCKS = {
  style: ['visualMedium','styleDescription','realismLevel','renderFeel','colorLanguage','mustInclude','mustNotInclude'],
  set: ['setName','timeOfDay','weather','interiorExterior','architecturalStyle','backgroundDensity','environmentalWear','setContinuity'],
  camera: ['shotType','cameraDistance','lensLength','depthOfField','composition','cameraMovementDuringAction'],
  lighting: ['keyLight','lightDirection','lightTemperature','atmosphere','mood'],
  action: ['primaryAction','secondaryAction','timing'],
  continuity: ['priorShotContinuity','wardrobeState','propState2','screenDirection','eyelineContinuity','timeElapsed'],
  forbidden: ['customForbidden'],
};
const AUTOFILL_CHARACTER_FIELDS = ['currentEmotion','currentPose','headDirection','eyeDirection','positionInFrame','continuityState'];
const AUTOFILL_WARDROBE_FIELDS = ['top','bottom','outerwear','shoes','condition','continuityNote'];
const AUTOFILL_PROP_FIELDS = ['propType','location','state','whoIsHolding'];
const AUTOFILL_SOURCES = ['USER_TEXT','PROJECT_KNOWLEDGE','ASSET_CANON','PRIOR_SHOT','AI_INFERENCE'];

let autofillProposal = null; // the parsed extraction result, kept while the review modal is open
let autofillAccepted = {};   // key -> boolean, which proposed items are currently checked

function buildAssetSummary(proj){
  const chars = proj.characters.map(c=>`${c.name}${c.role?` (${c.role})`:''}${c.age?`, age ${c.age}`:''}${c.defaultWardrobe?` — default wardrobe: ${c.defaultWardrobe}`:''}`).join('\n') || '(none saved)';
  const sets = proj.sets.map(s=>`${s.name}${s.location?` — ${s.location}`:''}${s.architecturalStyle?`, ${s.architecturalStyle}`:''}`).join('\n') || '(none saved)';
  const props = proj.props.map(p=>`${p.name}${p.type?` (${p.type})`:''}`).join('\n') || '(none saved)';
  return `SAVED CHARACTERS:\n${chars}\n\nSAVED SETS:\n${sets}\n\nSAVED PROPS:\n${props}`;
}

function buildProjectKnowledgeSummary(proj){
  const facts = proj.facts.filter(f=>f.status==='approved'||f.status==='locked'||f.status==='edited');
  if(facts.length===0) return '(no locked/approved project facts yet)';
  return facts.map(f=>`[${f.category}] ${f.subject}: ${f.factText}`).join('\n');
}

function buildCurrentShotSummary(proj){
  const shot = proj.shot;
  const lines = [];
  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const val = shot[lock] ? shot[lock][f] : null;
      if(fieldFilled(val)) lines.push(`${lock}.${f} = ${val}`);
    });
  });
  shot.characterRefs.forEach(cr=>{
    const c = proj.characters.find(x=>x.id===cr.charId);
    lines.push(`character already attached: ${c?c.name:'unknown'}`);
  });
  return lines.length ? lines.join('\n') : '(shot is currently empty)';
}

function buildSmartAutofillSystemPrompt(proj, extraSourceText){
  const modeNote = proj.shot.mode==='Image Edit Prompt'
    ? 'This is an IMAGE EDIT shot. Identify what should be preserved exactly (face, hair, body, background, camera, lighting, pose, environment — whichever apply) versus what should change. Put the "change only" detail in the correct lock field, and put an explicit preservation instruction in forbidden.customForbidden (e.g. "Preserve exactly: face, hair, body, background, camera, lighting, pose. Change only: shirt.").'
    : proj.shot.mode.includes('Video')
    ? 'This is a VIDEO/ANIMATION shot. Pay extra attention to movement, timing, camera movement, duration, and start/end state — these belong in the action and camera fields.'
    : 'This is an image shot.';

  return `You are the Smart Autofill extraction engine inside Xpert Prompt, a production tool built on one rule: anything left unspecified in a prompt gets silently invented by image/video generators. Your job is to ORGANIZE evidence into the right fields — you are NOT a creative writer and you must NOT complete the scene.

${modeNote}

===== THE SINGLE MOST IMPORTANT RULE =====
You may ONLY populate a field from one of these three evidence sources:
1. USER_TEXT — the exact detail the user just typed, or a direct, unambiguous paraphrase of it. Nothing more.
2. PROJECT_KNOWLEDGE — a fact that is actually listed below in the locked/approved project knowledge.
3. ASSET_CANON — a value that is actually present on a matched saved character/set/prop's own fields below.

Anything else — weather, time of day beyond what's stated, background extras (vendors, kids, drones, vehicles, crowd density), camera angle, lens, lighting, mood, pose beyond what's literally described, facial expression — if it is NOT explicitly present in the user's text, the locked project knowledge, or a matched asset's own fields, IT DOES NOT GO IN THE MAIN OUTPUT. It either gets left out entirely, or — only if genuinely implied by the wording (like "after school" implying afternoon) — goes in as source=AI_INFERENCE with a reason explaining exactly what wording implied it and confidence no higher than MEDIUM.

CRITICAL — PROVENANCE MUST BE LITERALLY TRUE: never label something USER_TEXT unless you could point to the exact words in the user's input that say it. Do NOT invent a plausible-sounding environmental or atmospheric detail and then mislabel it USER_TEXT or PROJECT_KNOWLEDGE to make it look sourced — this is the single worst failure mode for this tool and defeats its entire purpose. If you are inventing it because it would typically make sense for the scene, genre, or setting, that is AI_INFERENCE at best, and in most cases should simply be omitted rather than included at all.

When in real doubt, leave the field out. An empty field the user can see and fill in is far better than a wrong or invented one they don't notice.

ASSET LIBRARY (match mentioned names against these; note the matched name exactly if you find one; only use fields actually present on the matched asset — do not invent details about it):
${buildAssetSummary(proj)}

LOCKED/APPROVED PROJECT KNOWLEDGE (only these facts count as PROJECT_KNOWLEDGE — nothing else):
${buildProjectKnowledgeSummary(proj)}

FIELDS ALREADY FILLED IN THE CURRENT SHOT (do not repeat these, do not contradict them unless the user's new text clearly overrides them):
${buildCurrentShotSummary(proj)}

${extraSourceText ? `ADDITIONAL PROJECT SOURCE EXCERPTS SELECTED BY THE USER (only these count as PROJECT_KNOWLEDGE-equivalent source text):\n${extraSourceText}\n` : ''}

Return ONLY a JSON object, no preamble, no markdown fences, matching exactly this shape (omit any field the text gives no basis for — do not guess just to fill space):

{
  "style": { "<fieldKey>": {"value":"...", "source":"USER_TEXT|PROJECT_KNOWLEDGE|ASSET_CANON|PRIOR_SHOT|AI_INFERENCE", "confidence":"HIGH|MEDIUM|LOW", "reason":"required if source is AI_INFERENCE — the exact wording that implied it"} },
  "set": { ... same shape, fields from: setName, timeOfDay, weather, interiorExterior, architecturalStyle, backgroundDensity, environmentalWear, setContinuity },
  "camera": { ... fields from: shotType, cameraDistance, lensLength, depthOfField, composition, cameraMovementDuringAction },
  "lighting": { ... fields from: keyLight, lightDirection, lightTemperature, atmosphere, mood },
  "action": { ... fields from: primaryAction, secondaryAction, timing },
  "continuity": { ... fields from: priorShotContinuity, wardrobeState, propState2, screenDirection, eyelineContinuity, timeElapsed },
  "forbidden": { "customForbidden": {...} },
  "characters": [ { "name":"as mentioned in text", "matchedAssetName": "exact saved character name if matched, else null",
      "currentEmotion":{...}, "currentPose":{...}, "headDirection":{...}, "eyeDirection":{...}, "positionInFrame":{...}, "continuityState":{...},
      "wardrobe": { "top":{...}, "bottom":{...}, "outerwear":{...}, "shoes":{...}, "condition":{...}, "continuityNote":{...} } } ],
  "props": [ { "name":"as mentioned in text", "matchedAssetName": "exact saved prop name if matched, else null",
      "propType":{...}, "location":{...}, "state":{...}, "whoIsHolding":{...} } ]
}

Rules:
- Every leaf value is either omitted entirely, or an object with value/source/confidence (and reason if AI_INFERENCE).
- source=PRIOR_SHOT: carried over from what's already filled in the current shot above.
- Match character/prop names loosely (first name, nickname) against the asset library list above — but only pull field values that are actually listed for that asset, never invent additional attributes about a matched asset.
- If the user's text is short and only supports a handful of fields, return a handful of fields. A short, mostly-empty result is correct and expected when the input is short — it is not a failure.`;
}

function textSupportsValue(rawText, value){
  if(!value || !value.trim()) return false;
  const normalizedText = rawText.toLowerCase();
  const normalizedValue = value.toLowerCase().trim();
  if(normalizedText.includes(normalizedValue)) return true;
  // require most of the distinctive (4+ letter) words in the value to actually
  // appear verbatim in the user's own text — catches paraphrases while still
  // rejecting invented content that happens to share a filler word or two.
  const words = normalizedValue.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>=4);
  if(words.length===0) return normalizedText.includes(normalizedValue);
  const matched = words.filter(w=>normalizedText.includes(w));
  return (matched.length / words.length) >= 0.6;
}

function sanitizeAutofillProvenance(proposal, rawUserText){
  const recheck = (item)=>{
    if(!item) return item;
    if(item.source==='USER_TEXT' && !textSupportsValue(rawUserText, item.value)){
      item.source = 'AI_INFERENCE';
      item.confidence = 'LOW';
      item.reason = 'Reclassified: this could not be verified against your actual input text.' + (item.reason ? ' ' + item.reason : '');
    }
    return item;
  };
  Object.keys(AUTOFILL_SIMPLE_LOCKS).forEach(lock=>{
    if(!proposal[lock]) return;
    Object.keys(proposal[lock]).forEach(f=>{ proposal[lock][f] = recheck(proposal[lock][f]); });
  });
  (proposal.characters||[]).forEach(c=>{
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{ if(c[f]) c[f] = recheck(c[f]); });
    if(c.wardrobe) AUTOFILL_WARDROBE_FIELDS.forEach(f=>{ if(c.wardrobe[f]) c.wardrobe[f] = recheck(c.wardrobe[f]); });
  });
  (proposal.props||[]).forEach(p=>{
    AUTOFILL_PROP_FIELDS.forEach(f=>{ if(p[f]) p[f] = recheck(p[f]); });
  });
  return proposal;
}

async function runSmartAutofill(){
  const proj = activeProject();
  if(!hasAIKey()){ openAISettingsModal('Add your Anthropic API key to use Smart Autofill.'); return; }
  const textEl = document.getElementById('autofillInput');
  const text = textEl ? textEl.value.trim() : '';
  if(!text){ openMessageModal('Paste in what you know about this shot first.'); return; }

  const selectedSourceIds = Array.from(document.querySelectorAll('.autofill-source-check:checked')).map(el=>el.value);
  const extraSourceText = selectedSourceIds.length
    ? proj.sources.filter(s=>selectedSourceIds.includes(s.id)).map(s=>`--- ${s.name} ---\n${(s.content||'').slice(0,3000)}`).join('\n\n')
    : '';

  const statusEl = document.getElementById('autofillStatus');
  if(statusEl) statusEl.textContent = 'Analyzing…';

  try{
    const system = buildSmartAutofillSystemPrompt(proj, extraSourceText);
    const raw = await callClaude(system, text, 3500);
    const parsed = parseJsonSafe(raw);
    if(!parsed){ if(statusEl) statusEl.textContent = "Couldn't parse a result — try again or simplify the text."; return; }
    autofillProposal = sanitizeAutofillProvenance(parsed, text);
    initAutofillAccepted(autofillProposal);
    renderAutofillReviewModal();
  }catch(e){
    if(statusEl) statusEl.textContent = (e.code==='NO_API_KEY') ? 'Add your API key in AI Settings first.' : 'Something went wrong — try again.';
  }
}

function initAutofillAccepted(proposal){
  autofillAccepted = {};
  const defaultFor = (item)=> item && item.source!=='AI_INFERENCE' && item.confidence!=='LOW';
  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const item = proposal[lock] && proposal[lock][f];
      if(item) autofillAccepted[`${lock}.${f}`] = defaultFor(item);
    });
  });
  (proposal.characters||[]).forEach((c,ci)=>{
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{
      if(c[f]) autofillAccepted[`char.${ci}.${f}`] = defaultFor(c[f]);
    });
    AUTOFILL_WARDROBE_FIELDS.forEach(f=>{
      const item = c.wardrobe && c.wardrobe[f];
      if(item) autofillAccepted[`char.${ci}.wardrobe.${f}`] = defaultFor(item);
    });
  });
  (proposal.props||[]).forEach((p,pi)=>{
    AUTOFILL_PROP_FIELDS.forEach(f=>{
      if(p[f]) autofillAccepted[`prop.${pi}.${f}`] = defaultFor(p[f]);
    });
  });
}

function buildAutofillPreviewShot(proj){
  // clone the current shot and tentatively apply every currently-checked item,
  // so "still unspecified" reflects what would remain missing after Apply.
  const shot = JSON.parse(JSON.stringify(proj.shot));
  const proposal = autofillProposal;
  if(!proposal) return shot;

  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const key = `${lock}.${f}`;
      const item = proposal[lock] && proposal[lock][f];
      if(item && autofillAccepted[key]){
        if(lock==='forbidden') shot.forbidden.customForbidden = item.value;
        else shot[lock][f] = item.value;
      }
    });
  });

  (proposal.characters||[]).forEach((c,ci)=>{
    const matched = proj.characters.find(x=> c.matchedAssetName && x.name.toLowerCase()===c.matchedAssetName.toLowerCase());
    const alreadyAttached = matched && shot.characterRefs.some(cr=>cr.charId===matched.id);
    if(matched && !alreadyAttached){
      shot.characterRefs.push({ charId: matched.id, currentEmotion:'', currentPose:'', eyeDirection:'', headDirection:'', positionInFrame:'', continuityState:'' });
    }
  });

  return shot;
}

function computeAutofillStillMissing(proj){
  const previewShot = buildAutofillPreviewShot(proj);
  const previewProj = Object.assign({}, proj, { shot: previewShot });
  const gaps = [];
  LOCK_DEFS.forEach(def=>{
    const ev = evaluateLock(previewProj, def.key);
    ev.missing.CRITICAL.forEach(m=>gaps.push({severity:'CRITICAL', text:m}));
    ev.missing.IMPORTANT.forEach(m=>gaps.push({severity:'IMPORTANT', text:m}));
  });
  return gaps;
}

function toggleAutofillItem(key, checked){
  autofillAccepted[key] = checked;
  renderAutofillReviewModal();
}

function editAutofillItemValue(pathParts, currentValue){
  openTextInputModal({
    title: 'Edit value',
    defaultValue: currentValue,

    onConfirm: (val)=>{

      for(let i=0;i<pathParts.length-1;i++){ target = target[pathParts[i]]; }
      target[pathParts[pathParts.length-1]].value = val;
      renderAutofillReviewModal();
    }
  });
}

function applyAutofillProposal(){
  const proj = activeProject();
  const proposal = autofillProposal;
  if(!proposal) return;
  const touchedLocks = new Set();

  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const key = `${lock}.${f}`;
      const item = proposal[lock] && proposal[lock][f];
      if(item && autofillAccepted[key]){
        if(lock==='forbidden') proj.shot.forbidden.customForbidden = item.value;
        else proj.shot[lock][f] = item.value;
        touchedLocks.add(lock);
      }
    });
  });

  (proposal.characters||[]).forEach((c,ci)=>{
    let charId = null;
    let matched = c.matchedAssetName ? proj.characters.find(x=>x.name.toLowerCase()===c.matchedAssetName.toLowerCase()) : null;
    const anyFieldAccepted = AUTOFILL_CHARACTER_FIELDS.some(f=>autofillAccepted[`char.${ci}.${f}`]) || AUTOFILL_WARDROBE_FIELDS.some(f=>autofillAccepted[`char.${ci}.wardrobe.${f}`]);
    if(!anyFieldAccepted && !matched) return;

    if(!matched){
      // no saved asset matched this name — create a lightweight one so it's reusable later
      matched = { id: uid(), name: c.name, role:'', age:'', bodyType:'', faceShape:'', skinTone:'', eyeColor:'', hair:'', hairColor:'', distinguishing:'', defaultWardrobe:'', forbiddenDeviations:'', referenceNote:'', referenceImages:[] };
      proj.characters.push(matched);
    }
    charId = matched.id;

    let cr = proj.shot.characterRefs.find(x=>x.charId===charId);
    if(!cr){
      cr = { charId, currentEmotion:'', currentPose:'', eyeDirection:'', headDirection:'', positionInFrame:'', continuityState:'' };
      proj.shot.characterRefs.push(cr);
    }
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{
      const item = c[f];
      if(item && autofillAccepted[`char.${ci}.${f}`]){ cr[f] = item.value; touchedLocks.add('character'); }
    });

    const anyWardrobeAccepted = AUTOFILL_WARDROBE_FIELDS.some(f=>autofillAccepted[`char.${ci}.wardrobe.${f}`]);
    if(anyWardrobeAccepted){
      let wr = proj.shot.wardrobeRefs.find(x=>x.charId===charId);
      if(!wr){
        wr = { charId, top:'', bottom:'', outerwear:'', shoes:'', condition:'', fabric:'', continuityNote:'' };
        proj.shot.wardrobeRefs.push(wr);
      }
      AUTOFILL_WARDROBE_FIELDS.forEach(f=>{
        const item = c.wardrobe && c.wardrobe[f];
        if(item && autofillAccepted[`char.${ci}.wardrobe.${f}`]){ wr[f] = item.value; touchedLocks.add('wardrobe'); }
      });
    }
  });

  (proposal.props||[]).forEach((p,pi)=>{
    const anyAccepted = AUTOFILL_PROP_FIELDS.some(f=>autofillAccepted[`prop.${pi}.${f}`]);
    if(!anyAccepted) return;
    let propRef = proj.shot.props.find(x=>x.propName && x.propName.toLowerCase()===p.name.toLowerCase());
    if(!propRef){
      propRef = { propName: p.name, propType:'', location:'', state:'', whoIsHolding:'', forbiddenChanges:'' };
      proj.shot.props.push(propRef);
    }
    AUTOFILL_PROP_FIELDS.forEach(f=>{
      const item = p[f];
      if(item && autofillAccepted[`prop.${pi}.${f}`]){ propRef[f] = item.value; touchedLocks.add('prop'); }
    });
  });

  save();
  closeAutofillModal();
  autofillProposal = null;
  autofillAccepted = {};
  setView('builder');
  touchedLocks.forEach(l=>{ openLocks[l]=true; });
  renderAll();
}

function fieldLabelize(f){
  return f.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).trim();
}

function autofillItemRow(pathKey, pathParts, item, label){
  if(!item) return '';
  const checked = !!autofillAccepted[pathKey];
  const sourceLabel = item.source.replace(/_/g,' ');
  const confColor = item.confidence==='HIGH' ? 'var(--green-text)' : item.confidence==='MEDIUM' ? 'var(--orange-text)' : 'var(--red-text)';
  return `<div class="audit-item" style="align-items:flex-start;">
    <input type="checkbox" ${checked?'checked':''} onchange="toggleAutofillItem('${pathKey}', this.checked)" style="margin-top:2px;">
    <div style="flex:1;">
      <div><strong>${escapeHtml(label)}:</strong> ${escapeHtml(item.value)}
        <button class="btn btn-sm btn-ghost" style="padding:1px 6px;font-size:10px;" onclick='editAutofillItemValue(${JSON.stringify(pathParts)})'>edit</button>
      </div>
      <div style="font-size:10.5px;color:var(--text-faint);margin-top:2px;">
        <span style="color:${confColor};font-weight:600;">${item.confidence}</span> · ${escapeHtml(sourceLabel)}${item.reason ? ` — ${escapeHtml(item.reason)}` : ''}
      </div>
    </div>
  </div>`;
}

function autofillLockSection(lockKey, label){
  const proposal = autofillProposal;
  const fields = AUTOFILL_SIMPLE_LOCKS[lockKey];
  const rows = fields.map(f=>{
    const item = proposal[lockKey] && proposal[lockKey][f];
    if(!item || item.source==='AI_INFERENCE') return '';
    return autofillItemRow(`${lockKey}.${f}`, [lockKey, f], item, fieldLabelize(f));
  }).filter(Boolean).join('');
  if(!rows) return '';
  return `<div class="section-block"><h3>${label}</h3>${rows}</div>`;
}

function autofillCharactersSection(){
  const proposal = autofillProposal;
  const chars = proposal.characters || [];
  if(chars.length===0) return '';
  const cards = chars.map((c,ci)=>{
    const matchNote = c.matchedAssetName ? `<span style="color:var(--green-text);font-size:11px;">matched: ${escapeHtml(c.matchedAssetName)}</span>` : `<span style="color:var(--orange-text);font-size:11px;">new — will be added to Asset Library</span>`;
    const fieldRows = AUTOFILL_CHARACTER_FIELDS.map(f=>{
      const item = c[f];
      if(!item || item.source==='AI_INFERENCE') return '';
      return autofillItemRow(`char.${ci}.${f}`, ['characters',ci,f], item, fieldLabelize(f));
    }).filter(Boolean).join('');
    const wardrobeRows = AUTOFILL_WARDROBE_FIELDS.map(f=>{
      const item = c.wardrobe && c.wardrobe[f];
      if(!item || item.source==='AI_INFERENCE') return '';
      return autofillItemRow(`char.${ci}.wardrobe.${f}`, ['characters',ci,'wardrobe',f], item, 'Wardrobe: '+fieldLabelize(f));
    }).filter(Boolean).join('');
    if(!fieldRows && !wardrobeRows && !c.matchedAssetName) return ''; // nothing evidence-bound to show for this one
    return `<div class="entity"><div class="entity-head"><strong>${escapeHtml(c.name)}</strong>${matchNote}</div>${fieldRows || wardrobeRows ? fieldRows+wardrobeRows : '<div class="sub">No directly-sourced attributes — see AI Suggestions below if any were inferred.</div>'}</div>`;
  }).filter(Boolean).join('');
  if(!cards) return '';
  return `<div class="section-block"><h3>Characters</h3><div class="entity-list">${cards}</div></div>`;
}

function autofillPropsSection(){
  const proposal = autofillProposal;
  const props = proposal.props || [];
  if(props.length===0) return '';
  const cards = props.map((p,pi)=>{
    const matchNote = p.matchedAssetName ? `<span style="color:var(--green-text);font-size:11px;">matched: ${escapeHtml(p.matchedAssetName)}</span>` : `<span style="color:var(--orange-text);font-size:11px;">new</span>`;
    const rows = AUTOFILL_PROP_FIELDS.map(f=>{
      const item = p[f];
      if(!item || item.source==='AI_INFERENCE') return '';
      return autofillItemRow(`prop.${pi}.${f}`, ['props',pi,f], item, fieldLabelize(f));
    }).filter(Boolean).join('');
    if(!rows) return '';
    return `<div class="entity"><div class="entity-head"><strong>${escapeHtml(p.name)}</strong>${matchNote}</div>${rows}</div>`;
  }).filter(Boolean).join('');
  if(!cards) return '';
  return `<div class="section-block"><h3>Props</h3><div class="entity-list">${cards}</div></div>`;
}

function collectAutofillSuggestions(){
  const proposal = autofillProposal;
  const items = [];
  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const item = proposal[lock] && proposal[lock][f];
      if(item && item.source==='AI_INFERENCE') items.push({ pathKey:`${lock}.${f}`, pathParts:[lock,f], label:`${fieldLabelize(lock)} — ${fieldLabelize(f)}`, item });
    });
  });
  (proposal.characters||[]).forEach((c,ci)=>{
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{
      const item = c[f];
      if(item && item.source==='AI_INFERENCE') items.push({ pathKey:`char.${ci}.${f}`, pathParts:['characters',ci,f], label:`${c.name} — ${fieldLabelize(f)}`, item });
    });
    AUTOFILL_WARDROBE_FIELDS.forEach(f=>{
      const item = c.wardrobe && c.wardrobe[f];
      if(item && item.source==='AI_INFERENCE') items.push({ pathKey:`char.${ci}.wardrobe.${f}`, pathParts:['characters',ci,'wardrobe',f], label:`${c.name} wardrobe — ${fieldLabelize(f)}`, item });
    });
  });
  (proposal.props||[]).forEach((p,pi)=>{
    AUTOFILL_PROP_FIELDS.forEach(f=>{
      const item = p[f];
      if(item && item.source==='AI_INFERENCE') items.push({ pathKey:`prop.${pi}.${f}`, pathParts:['props',pi,f], label:`${p.name} — ${fieldLabelize(f)}`, item });
    });
  });
  return items;
}

function autofillSuggestionsSection(){

function autofillStillMissingSection(){
  const proj = activeProject();

  proj.sources.push(src);

function handlePasteSource(){

  const contentInput = document.getElementById('pasteSourceContent');
  const name = nameInput.value.trim() || 'Pasted note';

  const src = addTextSource(name, content);
  nameInput.value=''; contentInput.value='';
  renderAll();
  analyzeSource(src.id);
}

async function extractPdfText(arrayBuffer){
  if(typeof pdfjsLib === 'undefined'){
    throw new Error('PDF reader library failed to load — check your internet connection and try again.');
  }
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    fullText += textContent.items.map(item=>item.str).join(' ') + '\n\n';
  }
  return fullText;
}

function handleFileUpload(input){
  const files = Array.from(input.files||[]);
  const proj = activeProject();
  files.forEach(file=>{
    const isImage = file.type.startsWith('image/');
    const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name);

    if(isPdf){
      const reader = new FileReader();
      reader.onload = async (e)=>{
        const src = { id: uid(), name:file.name, kind:'file', content:'', addedAt: Date.now(), status:'pending' };
        proj.sources.push(src);
        sourceBusyIds[src.id] = true;
        save(); renderAll();
        try{
          const text = await extractPdfText(e.target.result);
          if(!text || !text.trim()){
            src.status = 'error';
            delete sourceBusyIds[src.id];
            save(); renderAll();
            openMessageModal(`"${file.name}" doesn't appear to contain selectable text — it may be a scanned or image-based PDF. Try an OCR tool first, or paste the text manually.`);
            return;
          }
          src.content = text;
          delete sourceBusyIds[src.id];
          save(); renderAll();
          analyzeSource(src.id);
        }catch(err){
          console.error('PDF extraction failed', err);
          src.status = 'error';
          delete sourceBusyIds[src.id];
          save(); renderAll();
          openMessageModal(`Couldn't read "${file.name}" as a PDF: ${err.message}`);
        }
      };
      reader.readAsArrayBuffer(file);
      return;
    }

    const reader = new FileReader();
    reader.onload = (e)=>{
      let src;
      if(isImage){
        src = { id: uid(), name:file.name, kind:'image', imageData: e.target.result.split(',')[1], mediaType:file.type, addedAt: Date.now(), status:'pending' };
      } else {
        src = { id: uid(), name:file.name, kind:'file', content: e.target.result, addedAt: Date.now(), status:'pending' };
      }
      proj.sources.push(src);
      save(); renderAll();
      analyzeSource(src.id);
    };
    if(isImage) reader.readAsDataURL(file);
    else reader.readAsText(file);
  });
  input.value='';
}

/* ---------- extraction ---------- */

const EXTRACTION_SYSTEM = `You are the project-knowledge extraction engine inside Xpert Prompt, a production tool for AI image/video creators. Extract concrete, reusable production facts from the material provided — the project may be a film, book, product, commercial, game, or anything else, so do not assume a fixed structure.

Return ONLY a JSON array, no preamble, no markdown fences. Each item:
{"category": one of [${KNOWLEDGE_CATEGORIES.map(c=>`"${c}"`).join(', ')}], "subject": short noun phrase this fact is about (e.g. "Zeke Lamb", "the vehicle", "brand logo"), "fact": one concise factual sentence, stated as the source states it (do not invent or embellish)}

Only extract facts that are actually stated in the material. If the material has no extractable production facts, return [].`;

async function analyzeSource(sourceId){
  const proj = activeProject();
  const src = proj.sources.find(s=>s.id===sourceId);
  if(!src) return;
  if(!hasAIKey()){
    openAISettingsModal('Add your Anthropic API key to analyze project sources.');
    return;
  }
  sourceBusyIds[sourceId] = true;
  renderAll();
  try{
    let newFacts = [];
    if(src.kind==='image'){
      const userContent = [
        { type:'image', source:{ type:'base64', media_type: src.mediaType||'image/jpeg', data: src.imageData } },
        { type:'text', text: 'Extract production facts visible in this reference image (appearance, wardrobe, materials, colors, environment, style — whatever applies). Follow the JSON format from your instructions.' }
      ];
      const raw = await callClaude(EXTRACTION_SYSTEM, userContent);
      const parsed = parseJsonSafe(raw);
      if(Array.isArray(parsed)) newFacts = parsed;
    } else {
      const chunks = chunkText(src.content || '', 3000);
      for(const chunk of chunks){
        const raw = await callClaude(EXTRACTION_SYSTEM, `SOURCE: ${src.name}\n\nMATERIAL:\n${chunk}`);
        const parsed = parseJsonSafe(raw);
        if(Array.isArray(parsed)) newFacts = newFacts.concat(parsed);
      }
    }
    newFacts.forEach(f=>{
      if(!f || !f.fact) return;
      proj.facts.push({
        id: uid(), sourceId: src.id, sourceName: src.name,
        category: KNOWLEDGE_CATEGORIES.includes(f.category) ? f.category : 'creative rules',
        subject: f.subject || 'general', factText: f.fact,
        status: 'proposed', createdAt: Date.now(),
      });
    });
    src.status = 'analyzed';
    recomputeConflicts(proj);
  }catch(e){
    console.error('Analysis failed', e);
    src.status = 'error';
    if(e.code==='NO_API_KEY'){ openAISettingsModal('Add your Anthropic API key to analyze project sources.'); }
  }
  delete sourceBusyIds[sourceId];
  save(); renderAll();
}

function removeSource(sourceId){
  openConfirmModal({
    title: 'Remove source?',
    message: 'Remove this source? Facts already extracted from it will remain but lose their source link.',
    confirmLabel: 'Remove',
    danger: true,
    onConfirm: ()=>{
      const proj = activeProject();
      proj.sources = proj.sources.filter(s=>s.id!==sourceId);
      save(); renderAll();
    }
  });
}

/* ---------- conflict detection ---------- */

function recomputeConflicts(proj){
  const groups = {};
  proj.facts.filter(f=>f.status!=='rejected').forEach(f=>{
    const key = f.category + '::' + normalizeSubject(f.subject);
    (groups[key] = groups[key]||[]).push(f);
  });
  // clear old conflict flags, recompute fresh
  proj.facts.forEach(f=>{ f.conflictGroup = null; });
  Object.entries(groups).forEach(([key,list])=>{
    if(list.length<2) return;
    const distinctTexts = new Set(list.map(f=>normalizeSubject(f.factText)));
    if(distinctTexts.size>1){
      list.forEach(f=>{ f.conflictGroup = key; });
    }
  });
}

function setFactStatus(factId, status){

function editFactText(factId){

  if(!f) return;
  openTextInputModal({
    title: 'Edit fact',
    defaultValue: f.factText,
    confirmLabel: 'Save',

    onConfirm: (newText)=>{
      f.factText = newText;

function resolveConflictKeep(conflictGroup, keepFactId){
  const proj = activeProject();
  proj.facts.filter(f=>f.conflictGroup===conflictGroup).forEach(f=>{
    if(f.id===keepFactId){ f.status='approved'; }
    else { f.status='rejected'; }
  });
  recomputeConflicts(proj);
  save(); renderAll();
}

function resolveConflictRejectAll(conflictGroup){
  openConfirmModal({
    title: 'Reject all conflicting facts?',
    message: 'None of the conflicting statements will be treated as canon. You can add a corrected source or fact later.',
    confirmLabel: 'Reject all',
    danger: true,
    onConfirm: ()=>{
      const proj = activeProject();
      proj.facts.filter(f=>f.conflictGroup===conflictGroup).forEach(f=>{ f.status='rejected'; });
      recomputeConflicts(proj);
      save(); renderAll();
    }
  });
}

function resolveConflictReplace(conflictGroup){
  const proj = activeProject();
  const facts = proj.facts.filter(f=>f.conflictGroup===conflictGroup);
  if(facts.length===0) return;
  openTextInputModal({
    title: 'Replace with current canon',
    message: `Write the correct, current fact about "${facts[0].subject}". This replaces every conflicting statement below — none of them have to be right as written.`,
    placeholder: 'e.g. The vehicle is matte black with silver trim, repainted after the Season 2 finale.',
    confirmLabel: 'Save as canon',
    onConfirm: (text)=>{
      facts.forEach(f=>{ f.status='rejected'; });
      proj.facts.push({
        id: uid(), sourceId: null, sourceName: 'Manual correction (you)',
        category: facts[0].category, subject: facts[0].subject, factText: text,
        status: 'locked', createdAt: Date.now(),
      });
      recomputeConflicts(proj);
      save(); renderAll();
    }
  });
}

async function askProject(){

  const factList = authoritative.map(f=>`[${f.category}] ${f.subject}: ${f.factText} (source: ${f.sourceName})`).join('\n');

  try{

  }catch(e){
    askProjectAnswer = (e.code==='NO_API_KEY') ? 'Add your Anthropic API key in AI Settings first.' : 'Something went wrong reaching the project knowledge engine. Try again.';
  }
  askProjectBusy = false;
  save();
  renderAll();
}

/* ---------- retrieval into locks ---------- */

function getRelevantFacts(proj, lockKey, limit){
  const shot = proj.shot;
  const authoritative = proj.facts.filter(f=> (f.status==='approved'||f.status==='locked'||f.status==='edited') && CATEGORY_TO_LOCK[f.category]===lockKey);
  if(authoritative.length===0) return [];
  // build keyword set from what's attached to this shot
  const keywords = new Set();
  shot.characterRefs.forEach(cr=>{ const c=proj.characters.find(x=>x.id===cr.charId); if(c&&c.name) keywords.add(normalizeSubject(c.name)); });
  if(shot.set.setName) keywords.add(normalizeSubject(shot.set.setName));
  shot.props.forEach(p=>{ if(p.propName) keywords.add(normalizeSubject(p.propName)); });
  let relevant = authoritative.filter(f=>{
    const subj = normalizeSubject(f.subject);
    if(keywords.size===0) return true; // nothing attached yet — show general facts for this lock
    for(const k of keywords){ if(k && (subj.includes(k) || k.includes(subj))) return true; }
    // style/forbidden/camera/lighting facts are usually project-wide, always relevant
    return ['style','forbidden','camera','lighting'].includes(lockKey);
  });
  return limit ? relevant.slice(0, limit) : relevant;
}

function knowledgePanel(proj, lockKey){
  const facts = getRelevantFacts(proj, lockKey, 6);
  if(facts.length===0) return '';
  return `<div style="background:var(--bg-raised);border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-top:2px;">
    <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--cyan);margin-bottom:6px;">From Project Knowledge</div>

      </div>`).join('')}
    </div>
  </div>`;
}

  const proj = activeProject();
  const shot = proj.shot;
  const { perLock } = computeCompleteness(proj);

  return `
  <div class="page-header">
    <div>
      <h1>Shot Builder</h1>
      <div class="sub">Fill in what matters. Anything left unspecified will eventually drift — the auditor will tell you what's still open before you generate.</div>
    </div>
    <div class="header-actions">
      <select class="btn" style="padding:8px 10px;" onchange="updateShotField('mode', this.value)">
        ${MODES.map(m=>`<option ${shot.mode===m?'selected':''}>${m}</option>`).join('')}
      </select>
      <select class="btn" style="padding:8px 10px;" onchange="updateShotField('platform', this.value)">
        ${PLATFORMS.map(p=>`<option ${shot.platform===p?'selected':''}>${p}</option>`).join('')}
      </select>
      <button class="btn" style="border-color:var(--gold);color:var(--gold);" onclick="openSmartAutofillModal()">✨ Smart Autofill</button>
      <button class="btn btn-gold" onclick="attemptGoToOutput()">Generate prompt →</button>
    </div>
  </div>

  <div class="lock-grid">
    ${lockCardStyle(proj, perLock.style)}
    ${lockCardCharacter(proj, perLock.character)}
    ${lockCardSet(proj, perLock.set)}
    ${lockCardWardrobe(proj, perLock.wardrobe)}
    ${lockCardProp(proj, perLock.prop)}
    ${lockCardCamera(proj, perLock.camera)}
    ${lockCardLighting(proj, perLock.lighting)}
    ${lockCardAction(proj, perLock.action)}
    ${lockCardContinuity(proj, perLock.continuity)}
    ${lockCardForbidden(proj, perLock.forbidden)}
  </div>
  `;
}

function statusChip(status){
  if(status==='complete') return `<span class="status-chip status-complete">Complete</span>`;
  if(status==='partial') return `<span class="status-chip status-partial">Partial</span>`;
  return `<span class="status-chip status-missing">Missing</span>`;
}

function lockHeader(num, key, label, status){
  const open = !!openLocks[key];
  return `<div class="lock-card-head" onclick="toggleLock('${key}')">
    <div class="lock-title"><span class="lock-num">${num}</span>${label}</div>
    <div style="display:flex;align-items:center;gap:10px;">
      ${statusChip(status)}
      <span class="chev ${open?'open':''}">▶</span>
    </div>
  </div>`;
}

function toggleLock(key){ openLocks[key] = !openLocks[key]; renderAll(); setTimeout(()=>document.getElementById('lock-'+key)?.scrollIntoView({behavior:'smooth',block:'nearest'}),30); }

function fieldWarn(missingList, label){
  // returns inline warn note html if this label text appears in the missing arrays
  return '';
}

function auditNote(ev){
  if(ev.missing.CRITICAL.length===0 && ev.missing.IMPORTANT.length===0 && ev.missing.OPTIONAL.length===0) return '';
  const items = [...ev.missing.CRITICAL.map(m=>['CRITICAL',m]), ...ev.missing.IMPORTANT.map(m=>['IMPORTANT',m]), ...ev.missing.OPTIONAL.map(m=>['OPTIONAL',m])];
  return `<div class="audit-list">${items.map(([tag,txt])=>`<div class="audit-item"><span class="audit-tag ${tag}">${tag}</span><span>${escapeHtml(txt)}</span></div>`).join('')}</div>`;
}

function lockCardStyle(proj, ev){
  const s = proj.shot.style;
  const open = !!openLocks['style'];
  return `<div class="lock-card" id="lock-style" style="grid-column:1/-1;--lock-color:${LOCK_COLORS.style};">
    ${lockHeader(1,'style','Style Lock', ev.status)}
    <div class="lock-body ${open?'open':''}">
      <div class="field-row">
        <div class="field"><label>Visual medium</label><input type="text" value="${escapeHtml(s.visualMedium)}" placeholder="stylized 3D animation, anime, cinematic realism..." oninput="updateNested('style','visualMedium',this.value)"></div>

function lockCardCharacter(proj, ev){
  const shot = proj.shot;
  const open = !!openLocks['character'];
  const available = proj.characters.filter(c=>!shot.characterRefs.some(cr=>cr.charId===c.id));

    ${lockHeader(2,'character','Character Lock', ev.status)}
    <div class="lock-body ${open?'open':''}">

        <select id="charAddSelect">

        <button class="btn btn-sm btn-ghost" onclick="setView('library')">+ Create new character</button>
      </div>
      <div class="entity-list">
        ${shot.characterRefs.map(cr=>characterRefBlock(proj, cr)).join('') || `<div class="empty-state" style="padding:16px;">No characters attached to this shot yet.</div>`}

      ${auditNote(ev)}
    </div>
