<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpert Prompt — Specify Everything. Leave Nothing to Chance.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAFF;
  --bg-raised:#F7F4FE;
  --panel:#FFFFFF;
  --panel-2:#F3EEFF;
  --border:#E3DBFC;
  --border-soft:#ECE6FD;
  --text:#211A36;
  --text-dim:#6B6483;
  --text-faint:#9C93B8;
  --gold:#7C3AED;
  --gold-dim:#C9B3FA;
  --cyan:#06B6D4;
  --green:#22C55E;
  --orange:#F97316;
  --red:#EF4444;
  --green-text:#15803D;
  --orange-text:#C2410C;
  --red-text:#B91C1C;
  --cyan-text:#0E7490;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Public Sans',sans-serif;}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
::selection{background:var(--gold);color:#FFFFFF;}
button{font-family:'Public Sans',sans-serif;cursor:pointer;}
textarea,input,select{font-family:'Public Sans',sans-serif;}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:5px;z-index:100;
  background:linear-gradient(90deg,#7C3AED,#E8368F,#14B8A6,#F2762E,#2F8FE0,#E0AA1B,#F0426B,#2FAE6B,#5B62E0,#E5433B);}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh;margin-top:5px;}
#sidebar{width:250px;flex-shrink:0;background:var(--bg-raised);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;}
#main{flex:1;min-width:0;padding:28px 34px 80px;}

.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px 14px;border-bottom:1px solid var(--border);}
.brand .mark{font-size:20px;font-weight:700;letter-spacing:0.5px;}
.brand .mark span{color:var(--gold);}
.brand .tagline{font-size:11px;color:var(--text-faint);letter-spacing:0.3px;}

.side-section{display:flex;flex-direction:column;gap:6px;}
.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-faint);padding:0 6px;margin-bottom:2px;}
.side-btn{background:transparent;border:1px solid transparent;color:var(--text-dim);text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;display:flex;align-items:center;gap:8px;transition:.15s;}
.side-btn:hover{background:var(--panel);color:var(--text);}
.side-btn.active{background:var(--panel-2);color:var(--text);border-color:var(--border);}
.side-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
.side-btn.active .dot{background:var(--gold);}

#projectPicker{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;}
.new-project-btn{width:100%;background:transparent;border:1px dashed var(--border);color:var(--text-dim);padding:8px;border-radius:8px;font-size:12.5px;}
.new-project-btn:hover{border-color:var(--gold-dim);color:var(--gold);}

/* ---------- gauge ---------- */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 4px;}
.gauge-pct{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
.gauge-sub{font-size:10.5px;color:var(--text-faint);text-align:center;}

/* ---------- header ---------- */
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:20px;flex-wrap:wrap;}
.page-header h1{font-size:22px;margin:0 0 4px;}
.page-header .sub{color:var(--text-dim);font-size:13px;max-width:640px;line-height:1.5;}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- buttons ---------- */
.btn{border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.btn:hover{border-color:var(--text-faint);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#FFFFFF;font-weight:600;}
.btn-gold:hover{background:#6A2FD9;}
.btn-ghost{background:transparent;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{color:var(--red);}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
.switch{width:36px;height:20px;border-radius:20px;background:var(--panel-2);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:.15s;}
.switch.on{background:var(--gold-dim);border-color:var(--gold);}
.switch .knob{position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:.15s;}
.switch.on .knob{left:17px;background:var(--gold);}

/* ---------- cards / locks ---------- */
.lock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.lock-card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--lock-color,var(--border));border-radius:var(--radius);overflow:hidden;}
.lock-card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;}
.lock-card-head:hover{background:var(--panel-2);}
.lock-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;}
.lock-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--lock-color,var(--text-faint));width:18px;font-weight:600;}
.status-chip{font-size:10px;text-transform:uppercase;letter-spacing:0.6px;padding:3px 8px;border-radius:20px;font-weight:600;}
.status-complete{background:rgba(34,197,94,0.15);color:var(--green-text);}
.status-partial{background:rgba(249,115,22,0.15);color:var(--orange-text);}
.status-missing{background:rgba(239,68,68,0.15);color:var(--red-text);}
.lock-body{padding:0 16px 16px;display:none;flex-direction:column;gap:10px;}
.lock-body.open{display:flex;}
.chev{color:var(--text-faint);transition:transform .15s;font-size:11px;}
.chev.open{transform:rotate(90deg);}

.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;}
.field input,.field select,.field textarea{background:var(--bg-raised);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:13px;width:100%;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold-dim);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.field-warn{border-color:var(--orange) !important;}
.warn-note{font-size:11px;color:var(--orange);display:flex;align-items:center;gap:5px;}
.warn-note.crit{color:var(--red);}

.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);}
.chk input{width:14px;height:14px;accent-color:var(--gold);}

/* multi-entity (characters/props) */
.entity-list{display:flex;flex-direction:column;gap:12px;}
.entity{border:1px solid var(--border-soft);border-radius:8px;padding:12px;background:var(--bg-raised);}
.entity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.entity-head input.name-input{font-weight:600;font-size:13.5px;background:transparent;border:none;color:var(--text);padding:2px 0;border-bottom:1px dashed transparent;}
.entity-head input.name-input:focus{border-bottom:1px dashed var(--gold-dim);outline:none;}
.remove-x{background:transparent;border:none;color:var(--text-faint);font-size:16px;line-height:1;padding:2px 6px;}
.remove-x:hover{color:var(--red);}

/* ---------- library grid ---------- */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.lib-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.lib-card h4{margin:0 0 4px;font-size:14px;}
.lib-card .meta{font-size:11.5px;color:var(--text-faint);margin-bottom:8px;}
.lib-card-actions{display:flex;gap:6px;margin-top:8px;}

/* section blocks */
.section-block{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
.section-block h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;}

/* ---------- audit panel ---------- */
.audit-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.audit-item{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 10px;border-radius:7px;background:var(--bg-raised);}
.audit-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;padding:2px 6px;border-radius:5px;flex-shrink:0;margin-top:1px;}
.audit-tag.CRITICAL{background:rgba(239,68,68,0.2);color:var(--red-text);}
.audit-tag.IMPORTANT{background:rgba(249,115,22,0.2);color:var(--orange-text);}
.audit-tag.OPTIONAL{background:rgba(155,161,168,0.2);color:var(--text-dim);}

/* strict mode modal */
.overlay{position:fixed;inset:0;background:rgba(10,11,13,0.7);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:8vh 16px 24px;}
.overlay.show{display:flex;}
.modal{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:420px;width:90%;}
.modal h4{margin:0 0 8px;font-size:15px;}
.modal p{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0 0 16px;}
.modal-actions{display:flex;flex-direction:column;gap:8px;}

/* ---------- output ---------- */
.output-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.output-tab{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:20px;font-size:12px;}
.output-tab.active{background:var(--gold);color:#FFFFFF;border-color:var(--gold);font-weight:600;}
.output-box{background:var(--bg-raised);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;color:var(--text);max-height:480px;overflow-y:auto;}
.char-count{font-size:11px;color:var(--text-faint);margin-top:6px;text-align:right;}

.readiness-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:0.3px;}
.r-EXCELLENT{background:rgba(34,197,94,0.15);color:var(--green-text);}
.r-GOOD{background:rgba(6,182,212,0.15);color:var(--cyan-text);}
.r-NEEDS{background:rgba(249,115,22,0.15);color:var(--orange-text);}
.r-HIGH{background:rgba(239,68,68,0.15);color:var(--red-text);}

.qc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px;}
.qc-item{background:var(--bg-raised);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}
.qc-item .label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.4px;}
.qc-item .bar{height:5px;background:var(--panel-2);border-radius:3px;margin-top:6px;overflow:hidden;}
.qc-item .bar-fill{height:100%;background:var(--gold);}
.qc-item .score{font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:4px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
.empty-state h3{color:var(--text-dim);margin-bottom:6px;}

.version-list{display:flex;flex-direction:column;gap:8px;}
.version-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg-raised);border:1px solid var(--border-soft);border-radius:8px;padding:10px 14px;}
.version-item .v-meta{font-size:12px;color:var(--text-faint);}

textarea.doctor-input{min-height:160px;}

@media(max-width:880px){
  #app{flex-direction:column;}
  #sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;}
  .side-section{flex:1;min-width:140px;}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">XPERT <span>PROMPT</span></div>
      <div class="tagline">Specify everything. Leave nothing to chance.</div>
      <div style="font-size:9px;color:var(--text-faint);opacity:0.6;margin-top:2px;">build: keyboard-safe-modals-v1</div>
    </div>

    <div class="side-section">
      <div class="side-label">Project</div>
      <select id="projectPicker"></select>
      <button class="new-project-btn" onclick="createProject()">+ New project</button>
    </div>

    <div class="gauge-wrap" id="gaugeWrap" title="Overall completeness across the 10 locks"></div>

    <div class="side-section">
      <div class="side-label">Workspace</div>
      <button class="side-btn active" data-view="bible" onclick="setView('bible')"><span class="dot"></span>Project Bible</button>
      <button class="side-btn" data-view="storybible" onclick="setView('storybible')"><span class="dot"></span>Story Bible</button>
      <button class="side-btn" data-view="library" onclick="setView('library')"><span class="dot"></span>Asset Library</button>
      <button class="side-btn" data-view="bulkimport" onclick="setView('bulkimport')"><span class="dot"></span>Bulk Import</button>
      <button class="side-btn" data-view="knowledge" onclick="setView('knowledge')"><span class="dot"></span>Project Knowledge</button>
      <button class="side-btn" data-view="builder" onclick="setView('builder')"><span class="dot"></span>Shot Builder</button>
      <button class="side-btn" data-view="output" onclick="attemptGoToOutput()"><span class="dot"></span>Prompt Output</button>
      <button class="side-btn" data-view="doctor" onclick="setView('doctor')"><span class="dot"></span>Prompt Doctor</button>
      <button class="side-btn" data-view="versions" onclick="setView('versions')"><span class="dot"></span>Version History</button>
      <button class="side-btn" data-view="backup" onclick="setView('backup')"><span class="dot"></span>Backup &amp; Restore</button>
    </div>

    <div class="side-section" style="margin-top:auto;">
      <div class="toggle" style="padding:8px 6px;">
        <div class="switch" id="strictSwitch" onclick="toggleStrict()"><div class="knob"></div></div>
        <span>Strict Production Mode</span>
      </div>
      <button class="side-btn" onclick="openAISettingsModal()" id="aiSettingsBtn"><span class="dot"></span>AI Settings</button>
      <button class="side-btn" onclick="openStorageDiagnosticsModal()"><span class="dot"></span>Storage Diagnostics</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="overlay" id="strictOverlay">
  <div class="modal">
    <h4 id="strictModalTitle">Detail may be inferred</h4>
    <p id="strictModalBody">This detail may be inferred by the image/video model. Define it before generating?</p>
    <div class="modal-actions">
      <button class="btn btn-gold" onclick="strictResolve('define')">Define now</button>
      <button class="btn" onclick="strictResolve('allow')">Allow model to interpret</button>
      <button class="btn btn-ghost" onclick="strictResolve('skip')">Not important</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.8.162/pdf.min.js"></script>
<script>
if(typeof pdfjsLib !== 'undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.8.162/pdf.worker.min.js';
}
</script>
<script>
/* =========================================================
   XPERT PROMPT — data model & core logic
   Storage: localStorage, key "perfectPrompt_projects_v1"
   ========================================================= */

const STORAGE_KEY = 'perfectPrompt_projects_v1';
const AI_CONFIG_KEY = 'xp_ai_config';

function getAIConfig(){
  try{
    const raw = localStorage.getItem(AI_CONFIG_KEY);
    return raw ? JSON.parse(raw) : { apiKey: '' };
  }catch(e){ return { apiKey: '' }; }
}
function saveAIConfig(apiKey){
  try{ localStorage.setItem(AI_CONFIG_KEY, JSON.stringify({ apiKey })); }catch(e){ console.error('Could not save AI config', e); }
}
function hasAIKey(){ return !!(getAIConfig().apiKey || '').trim(); }

function openStorageDiagnosticsModal(){
  const existing = document.getElementById('storageDiagOverlay');
  if(existing) existing.remove();

  const keys = Object.keys(localStorage).filter(k=>k.startsWith(STORAGE_KEY));
  const results = keys.map(k=>{
    const raw = localStorage.getItem(k);
    let parsed = null, error = null;
    try{ parsed = JSON.parse(raw); }catch(e){ error = e.message; }
    const projects = (parsed && Array.isArray(parsed.projects)) ? parsed.projects : [];
    return {
      key: k,
      rawLength: raw ? raw.length : 0,
      activeProjectId: parsed ? parsed.activeProjectId : null,
      error,
      projects: projects.map(p=>({
        id: p.id, name: p.name,
        characters: (p.characters||[]).length,
        characterNames: (p.characters||[]).map(c=>c.name).join(', '),
        sets: (p.sets||[]).length,
        setNames: (p.sets||[]).map(s=>s.name).join(', '),
        props: (p.props||[]).length,
        propNames: (p.props||[]).map(pr=>pr.name).join(', '),
        sources: (p.sources||[]).length,
        facts: (p.facts||[]).length,
        factsApproved: (p.facts||[]).filter(f=>f.status==='locked'||f.status==='approved').length,
        versions: (p.versions||[]).length,
        refImages: (p.characters||[]).reduce((s,c)=>s+(c.referenceImages||[]).length,0) + (p.sets||[]).reduce((s,st)=>s+(st.referenceImages||[]).length,0) + (p.props||[]).reduce((s,pr)=>s+(pr.referenceImages||[]).length,0),
      })),
    };
  });

  const overlay = document.createElement('div');
  overlay.id = 'storageDiagOverlay';
  overlay.className = 'overlay show';
  overlay.innerHTML = `<div class="modal" style="max-width:680px;max-height:85vh;overflow-y:auto;">
    <h4>Storage Diagnostics</h4>
    <p>Read-only — this only looks at what's already saved. Nothing here changes, deletes, or migrates anything.</p>
    ${keys.length===0 ? '<div class="empty-state">No Xpert Prompt storage keys found at all in this browser.</div>' : results.map(r=>`
      <div class="section-block">
        <h3 style="font-size:13px;word-break:break-all;">${escapeHtml(r.key)}</h3>
        <div class="sub">Raw size: ${r.rawLength.toLocaleString()} characters${r.error ? ` — <span style="color:var(--red-text);">could not parse: ${escapeHtml(r.error)}</span>` : ''}</div>
        ${r.error ? '' : `
          <div class="sub" style="margin-top:4px;">activeProjectId: ${escapeHtml(String(r.activeProjectId))}</div>
          <div class="entity-list" style="margin-top:8px;">
            ${r.projects.map(p=>`
              <div class="entity">
                <strong>${escapeHtml(p.name)}</strong> <span class="sub">(id: ${escapeHtml(p.id)})</span>
                <div style="font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.7;">
                  Characters: <strong>${p.characters}</strong>${p.characterNames ? ` — ${escapeHtml(p.characterNames)}` : ''}<br>
                  Sets: <strong>${p.sets}</strong>${p.setNames ? ` — ${escapeHtml(p.setNames)}` : ''}<br>
                  Props: <strong>${p.props}</strong>${p.propNames ? ` — ${escapeHtml(p.propNames)}` : ''}<br>
                  Sources: <strong>${p.sources}</strong> · Facts: <strong>${p.facts}</strong> (${p.factsApproved} locked/approved) · Versions: <strong>${p.versions}</strong> · Reference images: <strong>${p.refImages}</strong>
                </div>
              </div>
            `).join('') || '<div class="sub">(zero projects in this record)</div>'}
          </div>
        `}
      </div>
    `).join('')}
    <div class="modal-actions" style="flex-direction:row;justify-content:flex-end;">
      <button class="btn" onclick="downloadAllStorageBackups()">Download backups</button>
      <button class="btn btn-gold" onclick="document.getElementById('storageDiagOverlay').remove()">Close</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function downloadAllStorageBackups(){
  const keys = Object.keys(localStorage).filter(k=>k.startsWith(STORAGE_KEY));
  keys.forEach(k=>{
    const raw = localStorage.getItem(k);
    const blob = new Blob([raw], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = k + '_BACKUP.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  openMessageModal(`Downloaded ${keys.length} backup file${keys.length!==1?'s':''} to your Downloads folder. Nothing in storage was changed.`);
}

function openAISettingsModal(message){
  const existing = document.getElementById('aiSettingsOverlay');
  if(existing) existing.remove();
  const config = getAIConfig();
  const overlay = document.createElement('div');
  overlay.id = 'aiSettingsOverlay';
  overlay.className = 'overlay show';
  overlay.innerHTML = `<div class="modal" style="max-width:440px;">
    <h4>AI Settings</h4>
    <p>${escapeHtml(message || "Xpert Prompt calls the Anthropic API directly from your browser to analyze project sources and answer Ask Project questions. Your key is stored only in this browser's local storage — never sent anywhere except api.anthropic.com.")}</p>
    <div class="field" style="margin-bottom:14px;">
      <label>Anthropic API key</label>
      <input type="password" id="aiKeyInput" placeholder="sk-ant-..." value="${escapeHtml(config.apiKey||'')}">
    </div>
    <div class="modal-actions">
      <button class="btn btn-gold" id="saveAIKeyBtn">Save key</button>
      <button class="btn btn-ghost" onclick="document.getElementById('aiSettingsOverlay').remove()">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#saveAIKeyBtn').onclick = ()=>{
    const val = overlay.querySelector('#aiKeyInput').value.trim();
    saveAIConfig(val);
    overlay.remove();
    renderAll();
  };
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ console.error('Storage read failed', e); }

  let loadFailure = false;
  if(raw){
    let parsed = null;
    try{ parsed = JSON.parse(raw); }catch(e){ console.error('Parse failed, attempting repair', e); }
    if(!parsed || !Array.isArray(parsed.projects)){
      // Back up the raw, unreadable value under a NEVER-auto-overwritten key
      // before doing anything else — this must happen before any repair
      // attempt or fallback, so nothing is lost even if repair also fails.
      try{
        const backupKey = STORAGE_KEY + '_recovery_' + Date.now();
        localStorage.setItem(backupKey, raw);
      }catch(e){ console.error('Backup of unreadable data failed', e); }
      // Best-effort repair using the same bracket-balancing recovery already
      // built for Smart Autofill's JSON handling.
      const repaired = repairTruncatedJson(raw);
      if(repaired && Array.isArray(repaired.projects)) parsed = repaired;
    }
    if(parsed && Array.isArray(parsed.projects)){
      DB = parsed;
    } else {
      loadFailure = true; // raw existed but could not be read or repaired
    }
  }

  if(!DB.projects || DB.projects.length===0){
    if(loadFailure){
      // A real, unreadable value exists in storage right now. Never silently
      // overwrite it — surface this instead and work from a temporary blank
      // project in memory only, without saving over the original.
      showOnScreenError('Your saved project data could not be read. It has NOT been deleted — a backup of the raw data was saved under a key starting with "'+STORAGE_KEY+'_recovery_" (check Local Storage in DevTools). Working from a temporary blank project until this is resolved.');
    }
    const p = blankProject('Zeke Zoom 2076');
    p.bible.visualStyle = 'Premium stylized theatrical 3D animation. Clearly animated faces and environments. No photorealistic CGI, no realistic digital humans, no live-action skin texture.';
    p.bible.world = 'South Bronx, 2076.';
    DB.projects = [p];
    DB.activeProjectId = p.id;
    if(!loadFailure) save(); // only persist the blank default for genuine first-time use — never over an unreadable existing value
  }
  if(!DB.activeProjectId) DB.activeProjectId = DB.projects[0].id;
  // migrate older saved projects that predate Project Knowledge
  DB.projects.forEach(p=>{
    if(!p.bible) p.bible = { visualStyle:'', world:'', permanentRules:'' }; // never crash on a record missing bible entirely
    if(!Array.isArray(p.sources)) p.sources = [];
    if(!Array.isArray(p.facts)) p.facts = [];
    if(!p.shot) p.shot = blankShot(); // never crash on a record missing a shot entirely — fill with a safe default, never overwrite an existing one
    if(!p.shot.strictResolutions) p.shot.strictResolutions = {};
    migrateReferenceImages(p);
    if(!p.shot.contentType) p.shot.contentType = 'character_environment';
    migrateToSchemaV2(p);
  });
  if(!loadFailure) save();
}

/* ---------------- Schema v2 migration — additive only, never destructive ----------------
   Adds Story Bible, chapters, canon status, prop categorization, and — most
   importantly — splits the old versions[] (which conflated story position
   with revision history) into a real shots[] (story position) plus
   versions[] that now reference a shotId (pure revision history). Every
   existing version is preserved; nothing is deleted, only reorganized. */
function migrateToSchemaV2(p){
  if(p.schemaVersion >= CURRENT_SCHEMA_VERSION) return;

  if(!p.storyBible) p.storyBible = { corePhilosophy:'', premise:'', themes:'' };
  if(!Array.isArray(p.chapters)) p.chapters = [];
  if(!Array.isArray(p.shots)) p.shots = [];

  (p.characters||[]).forEach(c=>{ if(!c.canonStatus) c.canonStatus = 'canon'; }); // existing saved assets are treated as already-established canon
  (p.sets||[]).forEach(s=>{ if(!s.canonStatus) s.canonStatus = 'canon'; });
  (p.props||[]).forEach(pr=>{
    if(!pr.canonStatus) pr.canonStatus = 'canon';
    if(!pr.category) pr.category = 'prop';
  });

  // Split legacy versions[] (story position + revision history conflated)
  // into shots[] (story position) + versions[] referencing a shotId.
  (p.versions||[]).forEach((v, idx)=>{
    if(v.shotId) return; // already migrated
    const newShot = {
      id: uid(),
      chapterId: null, sceneId: null,
      shotNumber: idx + 1,
      title: v.label || `Shot ${idx+1}`,
      description: '',
      shotState: v.snapshot,
      endState: v.endState || '',
      canonStatus: 'draft',
      createdAt: v.savedAt || Date.now(),
      updatedAt: v.savedAt || Date.now(),
    };
    p.shots.push(newShot);
    v.shotId = newShot.id;
  });

  p.schemaVersion = CURRENT_SCHEMA_VERSION;
}

function escapeHtml(s){
  if(s===undefined||s===null) return '';

}

/* ---------------- completeness engine ---------------- */

function fieldFilled(v){
  if(v===undefined||v===null) return false;
  if(typeof v==='boolean') return true;
  if(typeof v==='string') return v.trim().length>0;
  if(Array.isArray(v)) return v.length>0;
  if(typeof v==='object') return Object.values(v).some(x=> (typeof x==='string'? x.trim().length>0 : !!x));
  return !!v;
}

function evaluateLock(proj, lockKey){
  const shot = proj.shot;
  const missing = { CRITICAL:[], IMPORTANT:[], OPTIONAL:[] };
  const def = LOCK_DEFS.find(l=>l.key===lockKey);
  const contentType = shot.contentType || 'character_environment';
  const charApplicable = isCharacterApplicable(contentType);
  const wardrobeApplicable = isWardrobeApplicable(contentType);
  const propsApplicable = isPropsApplicable(contentType);

  function check(section, fieldKey, label, severity){
    if(fieldKey==='__chars_min1'){
      if(charApplicable && shot.characterRefs.length===0) missing.CRITICAL.push('No character reference attached to this shot.');
      return;
    }
    if(fieldKey==='__wardrobe_min1'){
      if(wardrobeApplicable && shot.characterRefs.length>0 && shot.wardrobeRefs.length===0) missing.CRITICAL.push('Wardrobe not defined for any character.');
      return;
    }
    const val = section ? section[fieldKey] : undefined;
    if(!fieldFilled(val)) missing[severity].push(`${label} undefined`);
  }

  // Character and Wardrobe locks are entirely N/A for content types that don't
  // involve a character at all — this must be decided before any per-field
  // checks run, so a genuinely character-less shot can reach 100% without ever
  // being asked for one.
  if(lockKey==='character' && !charApplicable){
    return { missing, status:'complete', notApplicable:true };
  }
  if(lockKey==='wardrobe' && !wardrobeApplicable){
    return { missing, status:'complete', notApplicable:true };
  }

  if(lockKey==='style'){
    check(shot.style,'visualMedium','Visual medium','CRITICAL');
    check(shot.style,'styleDescription','Style description','CRITICAL');
    check(shot.style,'realismLevel','Realism level','IMPORTANT');
    check(shot.style,'renderFeel','Render feel','IMPORTANT');
    check(shot.style,'colorLanguage','Color language','OPTIONAL');
    check(shot.style,'styleReferences','Style references','OPTIONAL');
  } else if(lockKey==='character'){
    check(null,'__chars_min1','','CRITICAL');
    if(shot.characterRefs.length){
      shot.characterRefs.forEach(cr=>{
        const c = proj.characters.find(x=>x.id===cr.charId);
        const nm = c? c.name : 'Character';
        if(!fieldFilled(cr.currentEmotion)) missing.IMPORTANT.push(`${nm}: current emotion undefined`);
        if(!fieldFilled(cr.currentPose)) missing.IMPORTANT.push(`${nm}: current pose undefined`);
        if(!fieldFilled(cr.eyeDirection)) missing.OPTIONAL.push(`${nm}: eye direction undefined`);
        if(!fieldFilled(cr.continuityState)) missing.IMPORTANT.push(`${nm}: continuity state (what happened just before) undefined`);
        if(!c || (c.referenceImages||[]).length===0) missing.IMPORTANT.push(`${nm}: text canon present, visual reference MISSING — drift risk`);
      });
    }
  } else if(lockKey==='set'){
    check(shot.set,'setName','Set name','CRITICAL');
    check(shot.set,'timeOfDay','Time of day','CRITICAL');
    check(shot.set,'weather','Weather','IMPORTANT');
    check(shot.set,'architecturalStyle','Architectural style','IMPORTANT');
    check(shot.set,'backgroundDensity','Background population','OPTIONAL');
    check(shot.set,'environmentalWear','Environmental wear','OPTIONAL');
  } else if(lockKey==='wardrobe'){
    check(null,'__wardrobe_min1','','CRITICAL');
    shot.wardrobeRefs.forEach(wr=>{
      const c = proj.characters.find(x=>x.id===wr.charId);
      const nm = c? c.name : 'Character';
      if(!fieldFilled(wr.top) && !fieldFilled(wr.bottom)) missing.IMPORTANT.push(`${nm}: top/bottom wardrobe undefined`);
      if(!fieldFilled(wr.condition)) missing.IMPORTANT.push(`${nm}: wardrobe condition undefined`);
    });
  } else if(lockKey==='prop'){
    shot.props.forEach(p=>{
      if(!fieldFilled(p.state)) missing.IMPORTANT.push(`${p.propName||'Prop'}: state undefined`);
    });
  } else if(lockKey==='camera'){
    check(shot.camera,'shotType','Shot type','CRITICAL');
    check(shot.camera,'lensLength','Lens / focal length','IMPORTANT');
    check(shot.camera,'cameraDistance','Camera distance','IMPORTANT');
    check(shot.camera,'depthOfField','Depth of field','OPTIONAL');
    check(shot.camera,'composition','Composition style','OPTIONAL');
  } else if(lockKey==='lighting'){
    check(shot.lighting,'keyLight','Key light','CRITICAL');
    check(shot.lighting,'lightDirection','Light direction','IMPORTANT');
    check(shot.lighting,'lightTemperature','Light temperature','IMPORTANT');
    check(shot.lighting,'atmosphere','Atmospheric effects','OPTIONAL');
    check(shot.lighting,'mood','Mood','OPTIONAL');
  } else if(lockKey==='action'){
    check(shot.action,'primaryAction','Primary action','CRITICAL');
    check(shot.action,'secondaryAction','Secondary action','OPTIONAL');
    check(shot.action,'timing','Timing','OPTIONAL');
  } else if(lockKey==='continuity'){
    check(shot.continuity,'priorShotContinuity','Prior-shot continuity summary','CRITICAL');
    if(wardrobeApplicable) check(shot.continuity,'wardrobeState','Wardrobe state','IMPORTANT');
    if(propsApplicable) check(shot.continuity,'propState2','Prop state','IMPORTANT');
    check(shot.continuity,'screenDirection','Screen direction','OPTIONAL');
    if(charApplicable) check(shot.continuity,'eyelineContinuity','Eyeline continuity','OPTIONAL');
  } else if(lockKey==='forbidden'){
    const anyChecked = Object.values(shot.forbidden.checks||{}).some(v=>v);
    if(!anyChecked && !fieldFilled(shot.forbidden.customForbidden)) missing.IMPORTANT.push('No forbidden deviations selected');
  }

  const totalFields = missing.CRITICAL.length + missing.IMPORTANT.length + missing.OPTIONAL.length;
  let status = 'complete';
  if(missing.CRITICAL.length>0) status = 'missing';
  else if(missing.IMPORTANT.length>0 || missing.OPTIONAL.length>0) status = totalFields>0 ? 'partial' : 'complete';
  if(missing.CRITICAL.length===0 && missing.IMPORTANT.length===0 && missing.OPTIONAL.length===0) status='complete';

  return { missing, status };
}

function computeCompleteness(proj){
  let weightedFilled = 0, weightedTotal = 0;
  const weights = {CRITICAL:3, IMPORTANT:2, OPTIONAL:1};
  const perLock = {};
  LOCK_DEFS.forEach(def=>{
    const ev = evaluateLock(proj, def.key);
    perLock[def.key] = ev;
    const critSlots = def.critical.length || (def.key==='character'?1:def.key==='wardrobe'?1:0);
    const impSlots = def.important.length;
    const optSlots = def.optional.length;
    // approximate total possible slots as fixed baseline per lock type (use missing+some assumed filled baseline of 1 each)
    const critMissing = ev.missing.CRITICAL.length;
    const impMissing = ev.missing.IMPORTANT.length;
    const optMissing = ev.missing.OPTIONAL.length;
    const critTotal = Math.max(critSlots,1);
    const impTotal = Math.max(impSlots,1);
    const optTotal = Math.max(optSlots,1);
    weightedFilled += weights.CRITICAL*(critTotal-Math.min(critMissing,critTotal)) + weights.IMPORTANT*(impTotal-Math.min(impMissing,impTotal)) + weights.OPTIONAL*(optTotal-Math.min(optMissing,optTotal));
    weightedTotal += weights.CRITICAL*critTotal + weights.IMPORTANT*impTotal + weights.OPTIONAL*optTotal;
  });
  const pct = weightedTotal>0 ? Math.round((weightedFilled/weightedTotal)*100) : 0;
  return { pct, perLock };
}

function readinessLabel(pct, anyCritical){
  if(anyCritical) return {label:'HIGH DRIFT RISK', cls:'r-HIGH'};
  if(pct>=90) return {label:'EXCELLENT', cls:'r-EXCELLENT'};
  if(pct>=75) return {label:'GOOD', cls:'r-GOOD'};
  return {label:'NEEDS DETAIL', cls:'r-NEEDS'};
}

function renderGauge(){
  const proj = activeProject();
  const { pct, perLock } = computeCompleteness(proj);
  const anyCritical = LOCK_DEFS.some(d=>perLock[d.key].missing.CRITICAL.length>0);
  const r = readinessLabel(pct, anyCritical);
  const wrap = document.getElementById('gaugeWrap');

  const size=96, cx=size/2, cy=size/2, radius=40, segGap=4;
  const segCount = LOCK_DEFS.length;
  const segAngle = (360-segGap*segCount)/segCount;
  let svgSegs='';
  LOCK_DEFS.forEach((d,i)=>{
    const ev = perLock[d.key];
    let color = 'var(--text-faint)';
    if(ev.status==='complete') color='var(--green)';
    else if(ev.status==='partial') color='var(--orange)';
    else if(ev.status==='missing') color='var(--red)';
    const startAngle = i*(segAngle+segGap) - 90;
    const endAngle = startAngle+segAngle;
    svgSegs += arcPath(cx,cy,radius,startAngle,endAngle,color,d.key);
  });

  wrap.innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${svgSegs}
    </svg>
    <div class="gauge-pct">${pct}%</div>
    <span class="readiness-badge ${r.cls}" style="font-size:10px;padding:3px 9px;">${r.label}</span>
    <div class="gauge-sub">Click a segment to jump to that lock</div>
  `;
  wrap.querySelectorAll('path').forEach(p=>{
    p.style.cursor='pointer';
    p.addEventListener('click', ()=>{
      setView('builder');
      setTimeout(()=>{ openLocks[p.dataset.lock]=true; renderAll(); document.getElementById('lock-'+p.dataset.lock)?.scrollIntoView({behavior:'smooth',block:'center'}); },50);
    });
  });
}

function arcPath(cx,cy,r,startDeg,endDeg,color,lockKey){
  const toRad = d=> d*Math.PI/180;
  const x1 = cx + r*Math.cos(toRad(startDeg));
  const y1 = cy + r*Math.sin(toRad(startDeg));
  const x2 = cx + r*Math.cos(toRad(endDeg));
  const y2 = cy + r*Math.sin(toRad(endDeg));
  const largeArc = (endDeg-startDeg)>180?1:0;
  return `<path data-lock="${lockKey}" d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" stroke="${color}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
}

      danger: true,

function removeEntity(collection, id){
  openConfirmModal({
    title: 'Remove from library?',
    message: 'Remove this from the library? Shots referencing it will lose the link.',
    confirmLabel: 'Remove',
    danger: true,
    onConfirm: ()=>{
      const proj = activeProject();
      proj[collection] = proj[collection].filter(x=>x.id!==id);
      proj.shot.characterRefs = proj.shot.characterRefs.filter(cr=>proj.characters.some(c=>c.id===cr.charId));
      proj.shot.wardrobeRefs = proj.shot.wardrobeRefs.filter(wr=>proj.characters.some(c=>c.id===wr.charId));
      save(); renderAll();
    }
  });
}

function editEntity(type, id){
  const proj = activeProject();
  const collection = type==='character'?'characters':type==='set'?'sets':'props';
  const entity = proj[collection].find(x=>x.id===id);
  if(!entity) return;
  const fieldsByType = {
    character: [['name','Name'],['role','Role'],['age','Age'],['bodyType','Body type'],['faceShape','Face shape'],['skinTone','Skin tone'],['eyeColor','Eye color'],['hair','Hair style/length/texture'],['hairColor','Hair color'],['distinguishing','Distinguishing features'],['defaultWardrobe','Default wardrobe'],['forbiddenDeviations','Forbidden deviations (do not alter)'],['referenceNote','Reference image note']],
    set: [['name','Name'],['location','Location'],['era','Year / era'],['architecturalStyle','Architectural style'],['geography','Set geography (rooms, streets, layout)'],['forbiddenChanges','Forbidden changes (architecture, furniture, signage)'],['referenceNote','Reference image / floor plan note']],
    prop: [['name','Name'],['type','Prop type'],['category','Category'],['material','Material'],['color','Color'],['state','Default state (off / powered / open / closed...)'],['referenceNote','Reference image note']],
  };
  const fields = fieldsByType[type];
  const formHtml = fields.map(([key,label])=>`
    <div class="field">
      <label>${label}</label>
      ${key==='category' ?
        `<select data-key="category">${['prop','technology','vehicle'].map(c=>`<option value="${c}" ${entity.category===c?'selected':''}>${c}</option>`).join('')}</select>` :
      key==='distinguishing'||key==='forbiddenDeviations'||key==='geography'||key==='forbiddenChanges'||key==='defaultWardrobe' ?
        `<textarea rows="2" data-key="${key}">${escapeHtml(entity[key])}</textarea>` :
        `<input type="text" data-key="${key}" value="${escapeHtml(entity[key])}">`}
    </div>`).join('');

  const overlay = document.createElement('div');
  overlay.className='overlay show';
  overlay.innerHTML = `<div class="modal" style="max-width:520px;max-height:80vh;overflow-y:auto;">
    <h4>Edit ${type}</h4>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">${formHtml}</div>
    <div class="modal-actions" style="flex-direction:row;justify-content:flex-end;">
      <button class="btn" id="cancelEditEntity">Cancel</button>
      <button class="btn btn-gold" id="saveEditEntity">Save</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelEditEntity').onclick = ()=> overlay.remove();
  overlay.querySelector('#saveEditEntity').onclick = ()=>{
    fields.forEach(([key])=>{
      const el = overlay.querySelector(`[data-key="${key}"]`);
      entity[key] = el.value;
    });
    save(); overlay.remove(); renderAll();
  };
}

/* ============================================================
   VISUAL REFERENCE IMAGE SYSTEM
   Generic across characters, sets, and props — same structure,
   same functions, parameterized by collection name. Text tells
   the generator what something is; the approved reference shows
   it who/what it is. Both are kept, never one discarded for the other.
   ============================================================ */

function openReferenceManager(collection, assetId){
  renderReferenceManagerModal(collection, assetId);
}

function closeReferenceManager(){
  const el = document.getElementById('refManagerOverlay');
  if(el) el.remove();
}

function structuralReferenceConflicts(entity){
  // Flags when 2+ non-"INSPIRATION ONLY" references both claim authority
  // over the same control (e.g. two images both dictating FACE IDENTITY)
  // without one being clearly senior (MASTER CANON) to the other.
  const refs = (entity.referenceImages||[]).filter(r=>r.authorityLevel!=='INSPIRATION ONLY');
  const byControl = {};
  refs.forEach(r=>{
    (r.controls||[]).forEach(c=>{
      (byControl[c] = byControl[c]||[]).push(r);
    });
  });
  const conflicts = [];
  Object.entries(byControl).forEach(([control, list])=>{
    if(list.length<2) return;
    const hasMaster = list.some(r=>r.authorityLevel==='MASTER CANON');
    if(!hasMaster){
      conflicts.push({ control, count: list.length });
    }
  });
  return conflicts;
}

function renderReferenceManagerModal(collection, assetId){
  closeReferenceManager();
  const proj = activeProject();
  const entity = getEntity(proj, collection, assetId);
  if(!entity) return;
  if(!Array.isArray(entity.referenceImages)) entity.referenceImages = [];
  const refs = entity.referenceImages;
  const conflicts = structuralReferenceConflicts(entity);

  const overlay = document.createElement('div');
  overlay.id = 'refManagerOverlay';
  overlay.className = 'overlay show';
  overlay.innerHTML = `<div class="modal" style="max-width:680px;max-height:85vh;overflow-y:auto;">
    <h4>Manage References — ${escapeHtml(entity.name||'Unnamed')}</h4>
    <p>Upload reference images and define what each one controls. Text tells the generator what this is; these images show it who/what it is.</p>

    <input type="file" multiple accept="image/*" id="refUploadInput" style="margin-bottom:14px;">

    ${conflicts.length ? `<div style="background:rgba(239,68,68,0.1);border:1px solid var(--red);border-radius:8px;padding:10px 12px;margin-bottom:14px;">
      <strong style="color:var(--red-text);font-size:12.5px;">⚠ Visual Reference Conflict</strong>
      <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">
        ${conflicts.map(c=>`${c.count} references both claim authority over <strong>${escapeHtml(c.control)}</strong> with no Master Canon to break the tie.`).join('<br>')}
        Pick which reference should be Master Canon for this, or narrow what each one controls.
      </div>
    </div>` : ''}

    ${refs.length>1 ? `<button class="btn btn-sm" id="checkVisualConsistencyBtn" style="margin-bottom:14px;">Check visual consistency with AI</button>
    <div id="visualConsistencyResult"></div>` : ''}

    <div class="lib-grid" id="refImageGrid">
      ${refs.length ? refs.map(r=>referenceImageCard(collection, assetId, r)).join('') : '<div class="empty-state" style="grid-column:1/-1;padding:20px;">No reference images yet — upload above.</div>'}
    </div>

    <div class="modal-actions" style="flex-direction:row;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-gold" onclick="closeReferenceManager()">Done</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#refUploadInput').addEventListener('change', function(){
    handleReferenceUpload(collection, assetId, this);
  });
  const consistencyBtn = overlay.querySelector('#checkVisualConsistencyBtn');
  if(consistencyBtn) consistencyBtn.onclick = ()=> checkVisualConsistency(collection, assetId);
}

function referenceImageCard(collection, assetId, ref){
  const isMaster = ref.authorityLevel==='MASTER CANON';
  return `<div class="lib-card" style="${isMaster?'border-color:var(--gold);':''}">
    <img src="data:${ref.mediaType};base64,${ref.imageData}" style="width:100%;height:140px;object-fit:cover;border-radius:6px;margin-bottom:8px;">
    ${isMaster ? `<div style="color:var(--gold);font-weight:700;font-size:11px;margin-bottom:6px;">★ MASTER CANON</div>` : ''}
    <div class="field">
      <label>View / Type</label>
      <select onchange="setReferenceViewType('${collection}','${assetId}','${ref.id}',this.value)">
        ${REF_VIEW_TYPES.map(t=>`<option ${ref.viewType===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Authority level</label>
      <select onchange="setReferenceAuthority('${collection}','${assetId}','${ref.id}',this.value)">
        ${REF_AUTHORITY_LEVELS.map(a=>`<option ${ref.authorityLevel===a?'selected':''}>${a}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>What this image locks</label>
      <div class="checkbox-grid">
        ${REF_CONTROLS.map(c=>`<label class="chk"><input type="checkbox" ${(ref.controls||[]).includes(c)?'checked':''} onchange="toggleReferenceControl('${collection}','${assetId}','${ref.id}','${c}',this.checked)">${c}</label>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea rows="2" onblur="updateReferenceNotes('${collection}','${assetId}','${ref.id}',this.value)" placeholder="e.g. Use face, hair, skin tone. Clothing may change by scene.">${escapeHtml(ref.notes)}</textarea>
    </div>
    <button class="btn btn-sm btn-danger" style="margin-top:6px;" onclick="removeReferenceImage('${collection}','${assetId}','${ref.id}')">Remove</button>
  </div>`;
}

function handleReferenceUpload(collection, assetId, input){
  const files = Array.from(input.files||[]);
  const proj = activeProject();
  const entity = getEntity(proj, collection, assetId);
  if(!entity) return;
  let pending = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      entity.referenceImages.push({
        id: uid(),
        imageData: e.target.result.split(',')[1],
        mediaType: file.type || 'image/jpeg',
        viewType: 'OTHER',
        authorityLevel: entity.referenceImages.length===0 ? 'MASTER CANON' : 'SUPPORTING REFERENCE',
        controls: [],
        notes: '',
        addedAt: Date.now(),
      });
      pending--;
      if(pending===0){ save(); renderReferenceManagerModal(collection, assetId); renderAll(); }
    };
    reader.readAsDataURL(file);
  });
}

function setReferenceViewType(collection, assetId, refId, viewType){
  const proj = activeProject();
  const entity = getEntity(proj, collection, assetId);
  const ref = entity.referenceImages.find(r=>r.id===refId);
  if(ref){ ref.viewType = viewType; save(); }
}

function setReferenceAuthority(collection, assetId, refId, level){
  const proj = activeProject();
  const entity = getEntity(proj, collection, assetId);
  if(level==='MASTER CANON'){
    entity.referenceImages.forEach(r=>{ if(r.id!==refId && r.authorityLevel==='MASTER CANON') r.authorityLevel='APPROVED REFERENCE'; });
  }
  const ref = entity.referenceImages.find(r=>r.id===refId);
  if(ref) ref.authorityLevel = level;
  save();
  renderReferenceManagerModal(collection, assetId);
  renderAll();
}

function toggleReferenceControl(collection, assetId, refId, control, checked){
  const proj = activeProject();
  const entity = getEntity(proj, collection, assetId);
  const ref = entity.referenceImages.find(r=>r.id===refId);
  if(!ref) return;
  if(!Array.isArray(ref.controls)) ref.controls = [];
  if(checked && !ref.controls.includes(control)) ref.controls.push(control);
  if(!checked) ref.controls = ref.controls.filter(c=>c!==control);
  save();
}

function updateReferenceNotes(collection, assetId, refId, text){
  const proj = activeProject();
  const entity = getEntity(proj, collection, assetId);
  const ref = entity.referenceImages.find(r=>r.id===refId);
  if(ref){ ref.notes = text; save(); }
}

function removeReferenceImage(collection, assetId, refId){
  openConfirmModal({
    title: 'Remove reference image?',
    message: 'This removes the image and its settings from this asset.',
    confirmLabel: 'Remove',
    danger: true,
    onConfirm: ()=>{
      const proj = activeProject();
      const entity = getEntity(proj, collection, assetId);
      entity.referenceImages = entity.referenceImages.filter(r=>r.id!==refId);
      save();
      renderReferenceManagerModal(collection, assetId);

    }
