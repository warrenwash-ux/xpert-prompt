/* ============================================================
   STORY CONTEXT RESOLUTION — walks project.shots[] in real story
   order (chapter → scene → shot number), never by edit time, and
   never lets a LATER shot contaminate an EARLIER one.
   Priority: (1) prior shot's explicit End State, (2) prior shot's
   structured shotState, (3) canon defaults only when no temporary
   state exists at all.
   ============================================================ */

function getShotSortKey(proj, shot){
  const chapter = (proj.chapters||[]).find(c=>c.id===shot.chapterId);
  const scene = chapter ? (chapter.scenes||[]).find(s=>s.id===shot.sceneId) : null;
  return [chapter ? chapter.number : 0, scene ? scene.number : 0, shot.shotNumber || 0];
}
function compareSortKeys(a,b){
  for(let i=0;i<3;i++){ if(a[i]!==b[i]) return a[i]-b[i]; }
  return 0;
}
function getTargetSortKey(proj, chapterId, sceneId, shotNumber){
  const chapter = (proj.chapters||[]).find(c=>c.id===chapterId);
  const scene = chapter ? (chapter.scenes||[]).find(s=>s.id===sceneId) : null;
  return [chapter ? chapter.number : 0, scene ? scene.number : 0, shotNumber || 0];
}

function resolveStoryContext(proj, chapterId, sceneId, shotNumber){
  const targetKey = getTargetSortKey(proj, chapterId, sceneId, shotNumber);
  const priorEntries = (proj.shots||[])
    .map(s=>({ shot:s, key:getShotSortKey(proj,s) }))
    .filter(x=> compareSortKeys(x.key, targetKey) < 0) // strictly BEFORE target — later shots can never contaminate an earlier one
    .sort((a,b)=> compareSortKeys(a.key, b.key));

  const priorEntry = priorEntries[priorEntries.length-1]; // the closest one immediately before target, by story position
  if(!priorEntry){
    return { priorShot:null, context:null }; // first shot in the story — no temporary continuity to inherit, canon only
  }
  const priorShot = priorEntry.shot;
  const state = priorShot.shotState || {};
  return {
    priorShot,
    context: {
      priorShotEndState: priorShot.endState || '', // strongest continuity source
      wardrobeRefs: state.wardrobeRefs || [],
      props: state.props || [],
      characterRefs: state.characterRefs || [], // position, pose, emotion, eyeline per character
      set: state.set || {}, // location, time of day, environment state
      lighting: state.lighting || {},
    }
  };
}

function buildShotEndStateSummary(proj, shot){
  const lines = [];
  shot.characterRefs.forEach(cr=>{
    const c = proj.characters.find(x=>x.id===cr.charId);
    const nm = c ? c.name : 'Character';
    const bits = [cr.currentPose, cr.positionInFrame ? `positioned ${cr.positionInFrame}` : '', cr.eyeDirection ? `looking ${cr.eyeDirection}` : ''].filter(Boolean).join(', ');
    if(bits) lines.push(`${nm}: ${bits}`);
  });
  shot.wardrobeRefs.forEach(wr=>{
    const c = proj.characters.find(x=>x.id===wr.charId);
    const nm = c ? c.name : 'Character';
    const bits = [wr.top, wr.bottom, wr.condition].filter(Boolean).join(', ');
    if(bits) lines.push(`${nm} wardrobe: ${bits}`);
  });
  shot.props.forEach(p=>{
    const bits = [p.state, p.whoIsHolding ? `with ${p.whoIsHolding}` : ''].filter(Boolean).join(', ');
    if(bits) lines.push(`${p.propName || 'Prop'}: ${bits}`);
  });
  if(fieldFilled(shot.set.setName)) lines.push(`Location: ${shot.set.setName}${shot.set.interiorExterior ? ` (${shot.set.interiorExterior})` : ''}`);
  if(fieldFilled(shot.lighting.keyLight)) lines.push(`Lighting: ${shot.lighting.keyLight}${shot.lighting.lightTemperature ? `, ${shot.lighting.lightTemperature}` : ''}`);
  if(fieldFilled(shot.continuity.timeElapsed)) lines.push(`Time elapsed: ${shot.continuity.timeElapsed}`);
  return lines.length ? lines.join('. ') + '.' : '';
}

function applyNewShot(mode){
  const proj = activeProject();
  const outgoing = proj.shot;

  if(mode==='fresh'){
    const fresh = blankShot();
    fresh.platform = outgoing.platform; // target generator is a tool choice, not shot-specific
    proj.shot = fresh;
  } else {
    const next = blankShot();
    next.platform = outgoing.platform;
    next.mode = outgoing.mode;
    next.contentType = outgoing.contentType;
    next.style = JSON.parse(JSON.stringify(outgoing.style)); // production style stays consistent across a scene
    next.set = JSON.parse(JSON.stringify(outgoing.set)); // location persists unless the user changes it
    next.forbidden = JSON.parse(JSON.stringify(outgoing.forbidden)); // production-wide protections persist

    // Characters stay attached, but per-shot pose/expression/eyeline reset to
    // blank — this is the actual fix for the stale-data bug: a new shot must
    // never silently inherit the previous shot's pose, expression, or eyeline.
    next.characterRefs = outgoing.characterRefs.map(cr=>({
      charId: cr.charId, currentEmotion:'', currentPose:'', eyeDirection:'', headDirection:'', positionInFrame:'', continuityState:''
    }));
    next.wardrobeRefs = JSON.parse(JSON.stringify(outgoing.wardrobeRefs)); // what they're wearing carries forward
    next.props = JSON.parse(JSON.stringify(outgoing.props)); // held props and condition carry forward
    next.lighting = JSON.parse(JSON.stringify(outgoing.lighting)); // same room, moments later, shouldn't need retyping the lighting

    // Camera and action are always reset — how a shot is framed and acted
    // is specific to that shot, never blindly cloned.

    // Continuity: physical/spatial state carries forward, and the prior-shot
    // summary is auto-built from the outgoing shot's end state so the user
    // never has to manually re-describe what just happened — still fully
    // editable afterward.
    next.continuity.priorShotContinuity = buildShotEndStateSummary(proj, outgoing);
    next.continuity.wardrobeState = outgoing.continuity.wardrobeState;
    next.continuity.propState2 = outgoing.continuity.propState2;
    next.continuity.screenDirection = outgoing.continuity.screenDirection;
    next.continuity.eyelineContinuity = outgoing.continuity.eyelineContinuity;
    next.continuity.timeElapsed = outgoing.continuity.timeElapsed;

    proj.shot = next;
  }

  save();
  currentShotVersionId = null;
  openLocks = {};
  setView('builder');
}

function refreshLockCardInPlace(lockKey){
  const proj = activeProject();
  const ev = evaluateLock(proj, lockKey);
  const card = document.getElementById('lock-'+lockKey);
  if(!card) return;
  const chipHolder = card.querySelector('.lock-card-head .status-chip');
  if(chipHolder){
    chipHolder.outerHTML = statusChip(ev.status);
  }
  const body = card.querySelector('.lock-body');
  const oldAudit = body?.querySelector('.audit-list');
  const newAuditHtml = auditNote(ev);
  if(oldAudit){
    oldAudit.outerHTML = newAuditHtml;
  } else if(body && newAuditHtml){
    body.insertAdjacentHTML('beforeend', newAuditHtml);
  }
  renderGauge();
}

/* ---------------- VIEW: Prompt Output ---------------- */

function buildPromptParts(proj){
  const shot = proj.shot;
  const parts = {};

  // STYLE
  let style = [proj.bible.visualStyle, proj.bible.world, shot.style.styleDescription, shot.style.visualMedium ? `Medium: ${shot.style.visualMedium}.` : '', shot.style.realismLevel?`Realism level: ${shot.style.realismLevel}.`:'', shot.style.renderFeel, shot.style.colorLanguage?`Color language: ${shot.style.colorLanguage}.`:'', shot.style.mustInclude?`Must include: ${shot.style.mustInclude}.`:'', shot.style.mustNotInclude?`Must not include: ${shot.style.mustNotInclude}.`:''].filter(Boolean).join(' ');
  parts.style = style;

  // BIBLE RULES
  parts.bibleRules = proj.bible.permanentRules;

  // CHARACTERS
  parts.characters = shot.characterRefs.map(cr=>{
    const c = proj.characters.find(x=>x.id===cr.charId);
    if(!c) return '';
    const bits = [
      `${c.name}${c.role?` (${c.role})`:''}${c.age?`, age ${c.age}`:''}.`,
      [c.bodyType,c.faceShape,c.skinTone].filter(Boolean).join(', '),
      [c.eyeColor?`${c.eyeColor} eyes`:'', c.hairColor||c.hair? `${c.hairColor||''} ${c.hair||''} hair`.trim():''].filter(Boolean).join(', '),
      c.distinguishing,
      cr.currentEmotion?`Currently ${cr.currentEmotion}.`:'',
      cr.currentPose?`Pose: ${cr.currentPose}.`:'',
      cr.headDirection?`Head facing ${cr.headDirection}.`:'',
      cr.eyeDirection?`Eyes looking ${cr.eyeDirection}.`:'',
      cr.positionInFrame?`Positioned ${cr.positionInFrame} in frame.`:'',
      cr.continuityState?`Continuity: ${cr.continuityState}.`:'',
      c.forbiddenDeviations?`Do not alter: ${c.forbiddenDeviations}.`:'',
    ].filter(Boolean).join(' ');
    return bits;
  }).filter(Boolean).join('\n');

  // SET
  const s = shot.set;
  parts.set = [
    s.setName?`Location: ${s.setName}${s.location?` — ${s.location}`:''}.`:'',
    s.timeOfDay?`Time of day: ${s.timeOfDay}.`:'',
    s.weather?`Weather: ${s.weather}.`:'',
    s.interiorExterior,
    s.architecturalStyle?`Architecture: ${s.architecturalStyle}.`:'',
    s.backgroundDensity?`Background population: ${s.backgroundDensity}.`:'',
    s.environmentalWear?`Environmental wear: ${s.environmentalWear}.`:'',
  ].filter(Boolean).join(' ');

  // WARDROBE
  parts.wardrobe = shot.wardrobeRefs.map(wr=>{
    const c = proj.characters.find(x=>x.id===wr.charId);
    const bits = [`${c?c.name:'Character'} wearing`, [wr.top,wr.bottom,wr.outerwear,wr.shoes].filter(Boolean).join(', ')+'.', wr.condition?`Condition: ${wr.condition}.`:'', wr.continuityNote].filter(Boolean).join(' ');
    return bits;
  }).join('\n');

  // PROPS
  parts.props = shot.props.map(p=>{
    return [`${p.propName||'Prop'}${p.propType?` (${p.propType})`:''}`, p.location?`located ${p.location}`:'', p.state?`, state: ${p.state}`:'', p.whoIsHolding?`, held by ${p.whoIsHolding}`:'', p.forbiddenChanges?`. Do not change: ${p.forbiddenChanges}.`:'.'].filter(Boolean).join(' ');
  }).join('\n');

  // CAMERA
  const cam = shot.camera;
  parts.camera = [cam.shotType?`${cam.shotType} shot.`:'', cam.cameraDistance?`Distance: ${cam.cameraDistance}.`:'', cam.lensLength?`Lens: ${cam.lensLength}.`:'', cam.depthOfField?`Depth of field: ${cam.depthOfField}.`:'', cam.composition?`Composition: ${cam.composition}.`:'', cam.cameraMovementDuringAction?`Camera movement: ${cam.cameraMovementDuringAction}.`:''].filter(Boolean).join(' ');

  // LIGHTING
  const l = shot.lighting;
  parts.lighting = [l.keyLight?`Key light: ${l.keyLight}.`:'', l.lightDirection?`Direction: ${l.lightDirection}.`:'', l.lightTemperature?`Temperature: ${l.lightTemperature}.`:'', l.atmosphere?`Atmosphere: ${l.atmosphere}.`:'', l.mood?`Mood: ${l.mood}.`:''].filter(Boolean).join(' ');

  // ACTION
  const a = shot.action;
  parts.action = [a.primaryAction, a.secondaryAction?`Secondary: ${a.secondaryAction}.`:'', a.timing?`Timing: ${a.timing}.`:''].filter(Boolean).join(' ');

  // CONTINUITY
  const c = shot.continuity;
  parts.continuity = [c.priorShotContinuity, c.wardrobeState?`Wardrobe carried over: ${c.wardrobeState}.`:'', c.propState2?`Prop state carried over: ${c.propState2}.`:'', c.screenDirection?`Screen direction: ${c.screenDirection}.`:'', c.eyelineContinuity?`Eyeline: ${c.eyelineContinuity}.`:'', c.timeElapsed?`Time elapsed: ${c.timeElapsed}.`:''].filter(Boolean).join(' ');

  // FORBIDDEN
  const checked = Object.keys(shot.forbidden.checks||{}).filter(k=>shot.forbidden.checks[k]);
  const autoNoWarp = [];
  if(shot.action.noWarp) autoNoWarp.push('no warping','no morphing');
  if(shot.action.noExtraFingers) autoNoWarp.push('no extra fingers','no limb distortion');
  parts.forbidden = ['Do not include: ' + [...checked, ...autoNoWarp].join(', ') + '.', shot.forbidden.customForbidden ? shot.forbidden.customForbidden : ''].filter(Boolean).join(' ');

  return parts;
}

function assembleMaster(proj){
  const p = buildPromptParts(proj);
  const sections = [
    p.style,
    p.bibleRules,
    p.set,
    p.characters,
    p.wardrobe,
    p.props,
    p.camera,
    p.lighting,
    p.action,
    p.continuity,
    p.forbidden,
  ].filter(x=>x && x.trim().length);
  return sections.join('\n\n');
}

function assembleCompressed(proj, limit){
  // priority order: character identity, style lock, key action, major continuity, critical forbidden
  const p = buildPromptParts(proj);
  const priorityOrder = [p.style, p.characters, p.action, p.set, p.continuity, p.forbidden, p.wardrobe, p.camera, p.lighting, p.props, p.bibleRules];
  let out = '';
  for(const chunk of priorityOrder){
    if(!chunk) continue;
    const candidate = out ? out + ' ' + chunk : chunk;
    if(limit && candidate.length > limit) {
      const remaining = limit - out.length - 1;
      if(remaining > 20) out = out + ' ' + chunk.slice(0, remaining-1).trim() + '…';
      break;
    }
    out = candidate;
  }
  return out.trim();
}

function assembleReferenceAssetList(proj){
  const shot = proj.shot;
  const lines = [];
  shot.characterRefs.forEach(cr=>{
    const c = proj.characters.find(x=>x.id===cr.charId);
    lines.push(`• Character reference: ${c?c.name:'Unknown'}${c&&c.referenceNote?` — ${c.referenceNote}`:''}`);
  });
  if(shot.set.setName){
    const src = proj.sets.find(s=>s.name===shot.set.setName);
    lines.push(`• Set reference: ${shot.set.setName}${src&&src.referenceNote?` — ${src.referenceNote}`:''}`);
  }
  shot.props.forEach(p=>{
    const src = proj.props.find(x=>x.name===p.propName);
    lines.push(`• Prop reference: ${p.propName}${src&&src.referenceNote?` — ${src.referenceNote}`:''}`);
  });
  if(shot.style.styleReferences) lines.push(`• Style reference: ${shot.style.styleReferences}`);
  return lines.join('\n') || 'No reference assets attached to this shot.';
}

function visualReferenceInstructionLine(assetName, ref){
  const controlsText = (ref.controls||[]).length ? (ref.controls||[]).join(', ').toLowerCase() : null;
  let instruction;
  if(ref.authorityLevel==='MASTER CANON'){
    instruction = controlsText ? `Preserve ${controlsText} from the supplied master reference.` : `Preserve facial identity, hair silhouette, skin tone, apparent age, and body proportions from the supplied master reference.`;
  } else if(ref.authorityLevel==='INSPIRATION ONLY'){
    instruction = `Inspiration only — do not treat any detail here as established canon.`;
  } else {
    instruction = controlsText ? `Use this image for ${controlsText} only. Do not use it to redefine anything not listed here.` : `Supporting reference — use judgment on which visible attributes apply.`;
  }
  if(ref.notes) instruction += ` Note: ${ref.notes}`;
  const label = ref.viewType && ref.viewType!=='OTHER' ? `${assetName} — ${ref.authorityLevel} (${ref.viewType})` : `${assetName} — ${ref.authorityLevel}`;
  return `${label}\n${instruction}`;
}

function assembleVisualReferenceInstructions(proj){
  const shot = proj.shot;
  const lines = [];

  shot.characterRefs.forEach(cr=>{
    const c = proj.characters.find(x=>x.id===cr.charId);
    if(c && (c.referenceImages||[]).length){
      c.referenceImages.forEach(r=> lines.push(visualReferenceInstructionLine(c.name, r)));
    }
  });

  if(shot.set.setName){
    const setEntity = proj.sets.find(s=>s.name===shot.set.setName);
    if(setEntity && (setEntity.referenceImages||[]).length){
      setEntity.referenceImages.forEach(r=> lines.push(visualReferenceInstructionLine(setEntity.name, r)));
    }
  }

  shot.props.forEach(p=>{
    const src = proj.props.find(x=>x.name===p.propName);
    if(src && (src.referenceImages||[]).length){
      src.referenceImages.forEach(r=> lines.push(visualReferenceInstructionLine(src.name, r)));
    }
  });

  return lines.length ? lines.join('\n\n') : 'No visual reference images attached to this shot — text canon only. Attach references in Asset Library to reduce drift risk.';
}

function platformNote(platform){
  const notes = {
    'Midjourney':'Phrase as a dense comma-separated descriptor list rather than full sentences; aspect ratio and stylize parameters can be appended separately.',
    'Stable Diffusion':'Lead with the strongest visual descriptors; keep negative prompt terms in a separate negative field.',
    'Runway':'Write the video prompt as a single flowing shot description emphasizing camera movement and motion timing.',
    'Veo':'Describe action and camera movement in natural, cinematic language with clear temporal ordering.',
    'Kling':'Emphasize motion physics and temporal continuity between start and end frame.',
    'Hailuo':'Keep motion descriptions concrete and avoid ambiguous action verbs.',
    'Sora':'Write in narrative prose describing the scene as it unfolds over time.',
    'ChatGPT Image Generation':'Full natural-language sentences work well; be explicit about what must not change.',
    'Leonardo':'Front-load style and medium keywords before scene description.',
  };
  return notes[platform] || '';
}

function viewDoctor(){
  return `
  <div class="page-header">
    <div>
      <h1>Prompt Doctor</h1>
      <div class="sub">Paste an existing prompt. It will be checked against the ten locks to flag what's well specified, what's likely to drift, and what the model will probably have to infer.</div>
    </div>
  </div>
  <div class="section-block">
    <div class="field">
      <label>Existing prompt</label>
      <textarea class="doctor-input" id="doctorInput" placeholder="Paste a prompt you already wrote..."></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn btn-gold" onclick="runDoctor()">Diagnose</button>
      <button class="btn" onclick="fixMyPrompt()">Fix my prompt (rebuild into Shot Builder)</button>
    </div>
  </div>
  <div id="doctorResults"></div>
  `;
}

const DOCTOR_KEYWORDS = {
  style:['style','stylized','realistic','animation','render','3d','2d','anime','cinematic','photoreal'],
  character:['character','wearing','age','hair','eyes','face','expression'],
  set:['location','room','street','interior','exterior','time of day','morning','evening','night','weather'],
  wardrobe:['wearing','shirt','jacket','shoes','outfit','dressed'],
  prop:['holding','prop','device','object','phone','weapon','tool'],
  camera:['shot','angle','close-up','wide','lens','camera','pov'],
  lighting:['light','lighting','shadow','sunset','golden hour','neon','glow'],
  action:['walking','running','jumping','moving','gesture','action'],
  continuity:['previous','before','after','continuity','still','remains'],
  forbidden:['do not','no ','never','avoid','forbidden','without'],
};

function runDoctor(){
  const text = document.getElementById('doctorInput').value.toLowerCase();
  const results = LOCK_DEFS.map(def=>{
    const kws = DOCTOR_KEYWORDS[def.key] || [];
    const hits = kws.filter(k=>text.includes(k));
    const coverage = hits.length / kws.length;
    let status = coverage>0.4 ? 'complete' : coverage>0 ? 'partial' : 'missing';
    return { def, status, hits };
  });

  const wellSpecified = results.filter(r=>r.status==='complete').map(r=>r.def.label);
  const underspecified = results.filter(r=>r.status!=='complete').map(r=>r.def.label);
  const willInfer = results.filter(r=>r.status==='missing').map(r=>`${r.def.label.replace(' Lock','')} details will likely be invented by the model`);
  const driftRisks = [];
  if(!text.includes('style') && !text.includes('render')) driftRisks.push('No explicit style anchor — realism could creep into a stylized project.');
  if(!DOCTOR_KEYWORDS.continuity.some(k=>text.includes(k))) driftRisks.push('No continuity anchor — repeated generations of this scene may not match each other.');
  if(!DOCTOR_KEYWORDS.forbidden.some(k=>text.includes(k))) driftRisks.push('No forbidden-deviations language — nothing is explicitly protected from drift.');

  document.getElementById('doctorResults').innerHTML = `
    <div class="section-block">
      <h3 style="color:var(--green);">Well specified</h3>
      ${wellSpecified.length ? `<div class="checkbox-grid">${wellSpecified.map(l=>`<div class="chk">✓ ${l}</div>`).join('')}</div>` : '<div class="empty-state" style="padding:12px;">Nothing scored as well specified yet.</div>'}
    </div>
    <div class="section-block">
      <h3 style="color:var(--orange);">Underspecified</h3>
      ${underspecified.length ? `<div class="checkbox-grid">${underspecified.map(l=>`<div class="chk">△ ${l}</div>`).join('')}</div>` : '<div class="empty-state" style="padding:12px;">Nothing underspecified — nice work.</div>'}
    </div>
    <div class="section-block">
      <h3 style="color:var(--red);">The model will probably have to infer</h3>
      ${willInfer.length ? `<div class="audit-list">${willInfer.map(m=>`<div class="audit-item"><span class="audit-tag CRITICAL">INFER</span><span>${escapeHtml(m)}</span></div>`).join('')}</div>` : '<div class="empty-state" style="padding:12px;">No major inference gaps detected.</div>'}
    </div>
    <div class="section-block">
      <h3>Where drift could happen</h3>
      ${driftRisks.length ? `<div class="audit-list">${driftRisks.map(m=>`<div class="audit-item"><span class="audit-tag IMPORTANT">RISK</span><span>${escapeHtml(m)}</span></div>`).join('')}</div>` : '<div class="empty-state" style="padding:12px;">No obvious drift risks detected from keyword analysis.</div>'}
    </div>
  `;
}

function fixMyPrompt(){
  const text = document.getElementById('doctorInput').value;
  if(!text.trim()){ openMessageModal('Paste a prompt first.'); return; }
  const proj = activeProject();
  proj.shot.style.styleDescription = (proj.shot.style.styleDescription ? proj.shot.style.styleDescription + '\n' : '') + text;
  save();
  setView('builder');
  openLocks['style']=true;
  renderAll();
}

let pendingImportPackage = null;

function exportProjectPackage(){
  const proj = activeProject();
  const pkg = {

    packageSchemaVersion: CURRENT_SCHEMA_VERSION,
    exportedAt: Date.now(),

  };
  const json = JSON.stringify(pkg, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  const safeName = (proj.name || 'project').replace(/[^a-z0-9]+/gi,'_');
  a.href = url;
  a.download = `${safeName}_Master_${dateStr}.xpert.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleImportFileSelect(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let pkg = null;
    try{ pkg = JSON.parse(e.target.result); }catch(err){
      openMessageModal('This file could not be read as a valid project package: ' + err.message);
      return;
    }
    if(!pkg || !pkg.project || typeof pkg.project !== 'object' || !pkg.project.name){
      openMessageModal('This file does not look like a valid Xpert Prompt Master Project Package.');
      return;
    }
    pendingImportPackage = pkg;
    renderImportReviewModal(pkg);
  };
  reader.readAsText(file);
  input.value = '';
}

function commitProjectImport(){
  if(!pendingImportPackage) return;
  const proj = pendingImportPackage.project;
  try{
    migrateReferenceImages(proj);
    migrateToSchemaV2(proj);
    if(!proj.id || DB.projects.some(p=>p.id===proj.id)) proj.id = uid(); // never collide with an existing project id
    DB.projects.push(proj);
    DB.activeProjectId = proj.id;
    pendingImportPackage = null;
    document.getElementById('importReviewOverlay')?.remove();
    save();
    currentView = 'bible';
    renderAll();
    openMessageModal(`Import complete. "${proj.name}" has been added as a new project — nothing existing was overwritten or changed.`);
  }catch(e){
    openMessageModal('Import failed: ' + e.message + '. Nothing was changed — your existing projects are untouched.');
  }
}

/* ============================================================
   BULK PRODUCTION IMPORTER — paste/upload reconstructed canon,
   AI extraction, review with per-item approve/edit/reject, and
   conflict detection against LOCKED canon before anything commits.
   ============================================================ */

let bulkImportProposal = null;
let bulkImportAccepted = {};

const BULK_IMPORT_BIBLE_RULES_SCHEMA = `Extract PROJECT BIBLE, STORY BIBLE, and PRODUCTION/FORBIDDEN RULES from the material below. Return ONLY a JSON object, no preamble, no markdown fences:

{
  "projectBible": { "visualStyle": "...", "world": "...", "permanentRules": "..." },
  "storyBible": { "corePhilosophy": "...", "premise": "...", "themes": "..." },
  "productionRules": ["...", "..."],
  "forbiddenRules": ["...", "..."]
}

Extract EVERY named production rule the material describes as a rule/system, even if it also mirrors something an app might implement structurally (e.g. "10 Shot Locks", "Continuity State", "Shot End State", "True Autofill Safe Mode", "True Autofill Complete Mode", "Evidence Priority", "Character Continuity", "Set Continuity", "Forbidden Drift") — the user wants an accurate count of what the document actually states, not your judgment about redundancy. One entry per named rule/system, concise. Only extract what's explicitly written — never invent rule content.`;

const BULK_IMPORT_ASSETS_SCHEMA = `Extract CHARACTERS and SETS from the material below. Return ONLY a JSON object, no preamble, no markdown fences:

{
  "characters": [ { "name":"...", "role":"...", "age":"...", "defaultWardrobe":"...", "forbiddenDeviations":"...", "confidence":"HIGH|MEDIUM|LOW", "suggestedCanonStatus":"draft|approved|canon|locked" } ],
  "sets": [ { "name":"...", "location":"...", "era":"...", "architecturalStyle":"...", "geography":"...", "forbiddenChanges":"...", "confidence":"HIGH|MEDIUM|LOW", "suggestedCanonStatus":"draft|approved|canon|locked" } ]
}

suggestedCanonStatus rules (only apply if the material gives a status instruction; otherwise default to "canon"):
- The story's civilian/hero protagonist identity → "locked"
- Family members / core recurring cast → "canon"
- Approved recurring sets/locations → "canon"
- Anything the material explicitly calls "locked" or "core" → "locked"
- Otherwise → "canon" (per the rule: character assets are canon until references are reattached/verified — never leave this as "draft" unless the material is genuinely tentative)

Only extract characters/sets the material actually names — never invent one to fill out the cast.`;

const BULK_IMPORT_PROPS_SCHEMA = `Extract PROPS, TECHNOLOGY, and VEHICLES from the material below. Return ONLY a JSON object, no preamble, no markdown fences:

{
  "props": [ { "name":"...", "type":"...", "category":"prop|technology|vehicle", "material":"...", "color":"...", "state":"...", "confidence":"HIGH|MEDIUM|LOW", "suggestedCanonStatus":"draft|approved|canon|locked" } ]
}

CRITICAL CATEGORIZATION RULES:
- Anything under a "TECHNOLOGY" heading, or described as a suit/system/AI/device/tech component (e.g. an adaptive suit, its material, its helmet/visor system, a cape/mantle system, an internal AI core, protective/weapon rules for it) is category="technology" — extract EACH named technological COMPONENT as its own separate item (a suit's material, its helmet system, its visor, its cape system, its core AI, etc. are each their own technology entries if individually named and described — do not collapse them into one single entry unless the material treats them as one).
- Anything under a "VEHICLE" heading, or an actual car/motorcycle/aircraft, is category="vehicle".
- If the material explicitly dual-classifies something as BOTH vehicle AND technology (e.g. "categorized Vehicle / Technology"), set category to "vehicle" (its primary physical nature) but include the technology classification explicitly in the "type" field, e.g. "type": "Motorcycle / Mobile Lab (also classified as Technology)" — never silently drop either classification.
- Core technology explicitly marked "locked" or "core" in the material should have suggestedCanonStatus="locked"; otherwise "canon".
- Only extract items the material actually names — never invent one.`;

const BULK_IMPORT_STRUCTURE_SCHEMA = `Extract CHAPTER/SCENE STRUCTURE and CANON FACTS from the material below. Return ONLY a JSON object, no preamble, no markdown fences:

{
  "chapters": [ { "number":1, "title":"...", "scenes":[{"number":1,"title":"..."}] } ],
  "facts": [ { "category":"...", "subject":"...", "factText":"...", "confidence":"HIGH|MEDIUM|LOW" } ]
}

CRITICAL — DO NOT FABRICATE STRUCTURE: only create a chapter entry for a chapter the material actually names or describes (a title, an opening, functions/purpose described). If the material states a total planned chapter count (e.g. "Total Chapters: 5") but only some chapters are actually detailed, do NOT invent titles or scenes for the undetailed ones — instead add ONE fact capturing the planned total, e.g. {"category":"story events","subject":"Chapter structure","factText":"Production planned for 5 total chapters; only Chapter 1 is currently detailed.","confidence":"HIGH"}. Never fabricate a scene that isn't named.

For canon facts: scan the ENTIRE material — Project Bible, Story Bible, characters, sets, technology, and production sections all contain factual statements worth capturing as individual canon facts, not just a dedicated "facts" section. Extract concrete, reusable production facts as separate entries. Only extract what's explicitly stated.`;

function openBulkImportAnalyze(){
  const textEl = document.getElementById('bulkImportInput');
  const text = textEl ? textEl.value.trim() : '';
  if(!text){ openMessageModal('Paste or upload reconstruction text first.'); return; }
  if(!hasAIKey()){ openAISettingsModal('Add your Anthropic API key to analyze bulk import text.'); return; }
  runBulkImportAnalysis(text);
}

function handleBulkImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const textEl = document.getElementById('bulkImportInput');
    if(textEl) textEl.value = e.target.result;
  };
  reader.readAsText(file);
  input.value = '';
}

let bulkImportPartialNotes = [];

async function runBulkImportAnalysis(text){
  const statusEl = document.getElementById('bulkImportStatus');
  if(statusEl) statusEl.textContent = 'Analyzing…';
  const material = text.slice(0,20000);
  const systemPrompt = 'You are a production-bible extraction engine for Xpert Prompt. Extract only what is explicitly stated in the material — never invent characters, sets, props, chapters, scenes, or rules.';

  try{
    // Four independent calls, each with its own token budget — this is the
    // actual fix: a single combined call let earlier categories (characters,
    // sets) consume the whole budget and silently starve everything after
    // them (technology, chapters, facts, rules), exactly matching the
    // reported all-later-categories-are-zero symptom.
    const [bibleRes, assetsRes, propsRes, structureRes] = await Promise.allSettled([
      callClaudeRawWithRetry(systemPrompt, `${BULK_IMPORT_BIBLE_RULES_SCHEMA}\n\nMATERIAL:\n${material}`, 3000),
      callClaudeRawWithRetry(systemPrompt, `${BULK_IMPORT_ASSETS_SCHEMA}\n\nMATERIAL:\n${material}`, 4000),
      callClaudeRawWithRetry(systemPrompt, `${BULK_IMPORT_PROPS_SCHEMA}\n\nMATERIAL:\n${material}`, 4000),
      callClaudeRawWithRetry(systemPrompt, `${BULK_IMPORT_STRUCTURE_SCHEMA}\n\nMATERIAL:\n${material}`, 4000),
    ]);

    const notes = [];
    const parseOrNote = (settled, label)=>{
      if(settled.status!=='fulfilled'){ notes.push(`${label} extraction failed: ${settled.reason && settled.reason.message || 'unknown error'}.`); return null; }
      const parsed = parseJsonSafe(settled.value.text);
      if(!parsed){ notes.push(`${label} response could not be read, even after recovery.`); return null; }
      if(settled.value.stopReason==='max_tokens') notes.push(`${label} response was cut off by a length limit — what was returned before the cutoff has been kept.`);
      return parsed;
    };

    const bible = parseOrNote(bibleRes, 'Project Bible / Story Bible / Production Rules') || {};
    const assets = parseOrNote(assetsRes, 'Characters / Sets') || {};
    const propsData = parseOrNote(propsRes, 'Props / Technology / Vehicles') || {};
    const structure = parseOrNote(structureRes, 'Chapters / Canon Facts') || {};

    const merged = {
      projectBible: bible.projectBible || {},
      storyBible: bible.storyBible || {},
      productionRules: bible.productionRules || [],
      forbiddenRules: bible.forbiddenRules || [],
      characters: assets.characters || [],
      sets: assets.sets || [],
      props: propsData.props || [],
      chapters: structure.chapters || [],
      facts: structure.facts || [],
    };

    if(!Object.values(merged).some(v => (Array.isArray(v) ? v.length>0 : Object.keys(v||{}).length>0))){
      if(statusEl) statusEl.textContent = "Nothing could be extracted this time — try again.";
      return;
    }

    bulkImportProposal = merged;
    bulkImportPartialNotes = notes;
    bulkImportAccepted = {};
    (merged.characters||[]).forEach((c,i)=> bulkImportAccepted[`char.${i}`] = true);
    (merged.sets||[]).forEach((s,i)=> bulkImportAccepted[`set.${i}`] = true);
    (merged.props||[]).forEach((p,i)=> bulkImportAccepted[`prop.${i}`] = true);
    (merged.facts||[]).forEach((f,i)=> bulkImportAccepted[`fact.${i}`] = true);
    if(statusEl) statusEl.textContent = '';
    renderAll();
  }catch(e){
    if(statusEl) statusEl.textContent = (e.code==='NO_API_KEY') ? 'Add your API key in AI Settings first.' : 'Something went wrong — try again.';
  }
}

function findExistingByName(proj, collection, name){
  return proj[collection].find(x=>x.name && name && x.name.toLowerCase().trim() === name.toLowerCase().trim());
}

function bulkImportConflicts(proj){
  const p = bulkImportProposal;
  if(!p) return [];
  const conflicts = [];
  (p.characters||[]).forEach((c,i)=>{
    const existing = findExistingByName(proj, 'characters', c.name);
    if(existing && existing.canonStatus==='locked'){
      conflicts.push({ key:`char.${i}`, collection:'characters', existing, imported:c, label:c.name });
    }
  });
  (p.sets||[]).forEach((s,i)=>{
    const existing = findExistingByName(proj, 'sets', s.name);
    if(existing && existing.canonStatus==='locked'){
      conflicts.push({ key:`set.${i}`, collection:'sets', existing, imported:s, label:s.name });
    }
  });
  (p.props||[]).forEach((pr,i)=>{
    const existing = findExistingByName(proj, 'props', pr.name);
    if(existing && existing.canonStatus==='locked'){
      conflicts.push({ key:`prop.${i}`, collection:'props', existing, imported:pr, label:pr.name });
    }
  });
  return conflicts;
}

function resolveBulkConflict(key, resolution){
  const proj = activeProject();
  if(!proj.__bulkConflictResolutions) proj.__bulkConflictResolutions = {};
  proj.__bulkConflictResolutions[key] = resolution; // 'keep' | 'use' | 'edit'
  renderAll();
}

function toggleBulkImportItem(key, checked){
  bulkImportAccepted[key] = checked;
  renderAll();
}

function currentProjectStats(proj){
  return {
    characters: proj.characters.length,
    sets: proj.sets.length,
    props: proj.props.filter(p=>p.category!=='vehicle'&&p.category!=='technology').length,
    technology: proj.props.filter(p=>p.category==='technology').length,
    vehicles: proj.props.filter(p=>p.category==='vehicle').length,
    chapters: (proj.chapters||[]).length,
    facts: proj.facts.length,
  };
}

function bulkImportDelta(proj, conflictKeys){
  const p = bulkImportProposal;
  if(!p) return null;
  const tally = (list, collection)=>{
    let added=0, updated=0;
    (list||[]).forEach((item,i)=>{
      const key = `${collection}.${i}`;
      if(conflictKeys.has(key)) return; // handled separately
      const existing = findExistingByName(proj, collection==='char'?'characters':collection==='set'?'sets':'props', item.name);
      if(existing) updated++; else added++;
    });
    return { added, updated };
  };
  const charDelta = tally(p.characters, 'char');
  const setDelta = tally(p.sets, 'set');
  const propsOnly = (p.props||[]).map((x,i)=>({x,i})).filter(o=>o.x.category!=='vehicle'&&o.x.category!=='technology');
  const techOnly = (p.props||[]).map((x,i)=>({x,i})).filter(o=>o.x.category==='technology');
  const vehicleOnly = (p.props||[]).map((x,i)=>({x,i})).filter(o=>o.x.category==='vehicle');
  const tallyProps = (items)=>{
    let added=0, updated=0;
    items.forEach(({x,i})=>{
      const key = `prop.${i}`;
      if(conflictKeys.has(key)) return;
      const existing = findExistingByName(proj, 'props', x.name);
      if(existing) updated++; else added++;
    });
    return { added, updated };
  };
  return {
    characters: charDelta, sets: setDelta,
    props: tallyProps(propsOnly), technology: tallyProps(techOnly), vehicles: tallyProps(vehicleOnly),
    chapters: { added: (p.chapters||[]).filter(ch=>!(proj.chapters||[]).some(ec=>ec.number===ch.number)).length, updated: (p.chapters||[]).filter(ch=>(proj.chapters||[]).some(ec=>ec.number===ch.number)).length },
    facts: { added: (p.facts||[]).length, updated: 0 }, // facts always add as new proposed facts, never overwrite
  };
}

function commitBulkImport(){
  const proj = activeProject();
  const p = bulkImportProposal;
  if(!p) return;
  const resolutions = proj.__bulkConflictResolutions || {};

  if(p.projectBible){
    if(fieldFilled(p.projectBible.visualStyle)) proj.bible.visualStyle = p.projectBible.visualStyle;
    if(fieldFilled(p.projectBible.world)) proj.bible.world = p.projectBible.world;
    if(fieldFilled(p.projectBible.permanentRules)) proj.bible.permanentRules = [proj.bible.permanentRules, p.projectBible.permanentRules].filter(Boolean).join('\n');
  }
  if(p.storyBible){
    if(!proj.storyBible) proj.storyBible = { corePhilosophy:'', premise:'', themes:'' };
    if(fieldFilled(p.storyBible.corePhilosophy)) proj.storyBible.corePhilosophy = p.storyBible.corePhilosophy;
    if(fieldFilled(p.storyBible.premise)) proj.storyBible.premise = p.storyBible.premise;
    if(fieldFilled(p.storyBible.themes)) proj.storyBible.themes = p.storyBible.themes;
  }

  (p.characters||[]).forEach((c,i)=>{
    const key = `char.${i}`;
    if(resolutions[key]==='keep' || resolutions[key]==='edit') return;
    if(!bulkImportAccepted[key] && resolutions[key]!=='use') return;
    const existing = findExistingByName(proj, 'characters', c.name);
    if(existing && existing.canonStatus!=='locked'){
      Object.assign(existing, { role:c.role||existing.role, age:c.age||existing.age, defaultWardrobe:c.defaultWardrobe||existing.defaultWardrobe, forbiddenDeviations:c.forbiddenDeviations||existing.forbiddenDeviations });
    } else if(!existing){
      proj.characters.push({ id: uid(), name:c.name, role:c.role||'', age:c.age||'', bodyType:'', faceShape:'', skinTone:'', eyeColor:'', hair:'', hairColor:'', distinguishing:'', defaultWardrobe:c.defaultWardrobe||'', forbiddenDeviations:c.forbiddenDeviations||'', referenceNote:'', canonStatus:c.suggestedCanonStatus||'canon', referenceImages:[] });
    }
  });
  (p.sets||[]).forEach((s,i)=>{
    const key = `set.${i}`;
    if(resolutions[key]==='keep' || resolutions[key]==='edit') return;
    if(!bulkImportAccepted[key] && resolutions[key]!=='use') return;
    const existing = findExistingByName(proj, 'sets', s.name);
    if(existing && existing.canonStatus!=='locked'){
      Object.assign(existing, { location:s.location||existing.location, era:s.era||existing.era, architecturalStyle:s.architecturalStyle||existing.architecturalStyle, geography:s.geography||existing.geography, forbiddenChanges:s.forbiddenChanges||existing.forbiddenChanges });
    } else if(!existing){
      proj.sets.push({ id: uid(), name:s.name, location:s.location||'', era:s.era||'', architecturalStyle:s.architecturalStyle||'', geography:s.geography||'', forbiddenChanges:s.forbiddenChanges||'', referenceNote:'', canonStatus:s.suggestedCanonStatus||'canon', referenceImages:[] });
    }
  });
  (p.props||[]).forEach((pr,i)=>{
    const key = `prop.${i}`;
    if(resolutions[key]==='keep' || resolutions[key]==='edit') return;
    if(!bulkImportAccepted[key] && resolutions[key]!=='use') return;
    const existing = findExistingByName(proj, 'props', pr.name);
    if(existing && existing.canonStatus!=='locked'){
      Object.assign(existing, { type:pr.type||existing.type, category:pr.category||existing.category, material:pr.material||existing.material, color:pr.color||existing.color, state:pr.state||existing.state });
    } else if(!existing){
      proj.props.push({ id: uid(), name:pr.name, type:pr.type||'', category:pr.category||'prop', material:pr.material||'', color:pr.color||'', state:pr.state||'', referenceNote:'', canonStatus:pr.suggestedCanonStatus||'canon', referenceImages:[] });
    }
  });
  (p.chapters||[]).forEach(ch=>{
    let existingChapter = (proj.chapters||[]).find(c=>c.number===ch.number);
    if(!existingChapter){
      existingChapter = { id: uid(), number: ch.number, title: ch.title||`Chapter ${ch.number}`, scenes: [] };
      proj.chapters.push(existingChapter);
    }
    (ch.scenes||[]).forEach(sc=>{
      if(!(existingChapter.scenes||[]).some(s=>s.number===sc.number)){
        existingChapter.scenes.push({ id: uid(), number: sc.number, title: sc.title||`Scene ${sc.number}` });
      }
    });
  });
  (p.facts||[]).forEach((f,i)=>{
    if(!bulkImportAccepted[`fact.${i}`]) return;
    proj.facts.push({ id: uid(), sourceId:null, sourceName:'Bulk Import', category:f.category||'creative rules', subject:f.subject||'general', factText:f.factText, status:'proposed', createdAt: Date.now() });
  });
  const allRules = [...(p.productionRules||[]), ...(p.forbiddenRules||[])];
  if(allRules.length){
    proj.bible.permanentRules = [proj.bible.permanentRules, ...allRules].filter(Boolean).join('\n');
  }

  recomputeConflicts(proj);
  bulkImportProposal = null;
  bulkImportAccepted = {};
  bulkImportPartialNotes = [];
  proj.__bulkConflictResolutions = {};
  save();
  currentView = 'bulkimport'; // stay here — supports pasting the next incremental pass immediately
  renderAll();
  openMessageModal('Import committed and merged into the current project. Nothing from earlier passes was reset — you can paste the next pass now if you have one.');
}

function viewVersions(){
  const proj = activeProject();
  const currentVersion = proj.versions.find(v=>v.id===currentShotVersionId);

function saveVersion(){
  const proj = activeProject();
  openTextInputModal({
    title: 'Save version',
    defaultValue: `v${proj.versions.length+1}`,
    confirmLabel: 'Save',
    onConfirm: (label)=>{
      const v = { id: uid(), label, savedAt: Date.now(), snapshot: JSON.parse(JSON.stringify(proj.shot)), endState: buildShotEndStateSummary(proj, proj.shot) };
      proj.versions.push(v);
      currentShotVersionId = v.id;
      save();
      setView('versions');
    }
  });
}
function updateCurrentVersion(){
  const proj = activeProject();
  const v = proj.versions.find(x=>x.id===currentShotVersionId);
  if(!v){ saveVersion(); return; }
  openConfirmModal({
    title: `Update "${v.label}"?`,
    message: 'This overwrites that saved shot with the current shot workspace. The previous saved state will be replaced.',
    confirmLabel: 'Update',
    onConfirm: ()=>{
      v.snapshot = JSON.parse(JSON.stringify(proj.shot));
      v.savedAt = Date.now();
      save();
      renderAll();
    }
  });
}
function restoreVersion(id){
  const proj = activeProject();
  const v = proj.versions.find(x=>x.id===id);
  if(!v) return;
  openConfirmModal({
    title: 'Restore version?',
    message: `Restore "${v.label}"? This replaces the current shot in the builder.`,
    confirmLabel: 'Restore',
    onConfirm: ()=>{
      proj.shot = JSON.parse(JSON.stringify(v.snapshot));
      currentShotVersionId = v.id;
      save(); setView('builder');
    }
  });
}
function duplicateVersion(id){
  const proj = activeProject();
  const v = proj.versions.find(x=>x.id===id);
  if(!v) return;
  proj.versions.push({ id: uid(), label: v.label+' (copy)', savedAt: Date.now(), snapshot: JSON.parse(JSON.stringify(v.snapshot)) });
  save(); renderAll();
}
function deleteVersion(id){
  openConfirmModal({
    title: 'Delete version?',
    message: 'Delete this saved version? This cannot be undone.',
    confirmLabel: 'Delete',
    danger: true,
    onConfirm: ()=>{
      const proj = activeProject();
      proj.versions = proj.versions.filter(x=>x.id!==id);
      save(); renderAll();
    }
  });
}

function clearStrictOverride(gapId){
  const proj = activeProject();
  if(proj.shot.strictResolutions) delete proj.shot.strictResolutions[gapId];
  save(); renderAll();

/* ---------- Strict Production Mode — gate on Generate ---------- */

let strictGateQueue = [];
let strictGateActive = null;

function attemptGoToOutput(){
  const proj = activeProject();
  if(!proj.strictMode){ setView('output'); return; }
  const gaps = getUnresolvedCriticalGaps(proj);
  if(gaps.length===0){ setView('output'); return; }
  strictGateQueue = gaps.slice();
  showNextStrictGate();
}

function showNextStrictGate(){
  if(strictGateQueue.length===0){
    document.getElementById('strictOverlay').classList.remove('show');
    strictGateActive = null;
    setView('output');
    return;
  }
  strictGateActive = strictGateQueue.shift();
  document.getElementById('strictModalTitle').textContent = 'Detail may be inferred';
  document.getElementById('strictModalBody').textContent = `${strictGateActive.label} is still undefined. This detail may be inferred by the image/video model. Define it before generating?`;
  document.getElementById('strictOverlay').classList.add('show');
}

function strictResolve(action){
  const proj = activeProject();
  if(action==='define'){
    const lockKey = strictGateActive ? strictGateActive.lockKey : null;
    document.getElementById('strictOverlay').classList.remove('show');
    strictGateQueue = [];
    strictGateActive = null;
    setView('builder');
    if(lockKey){
      openLocks[lockKey] = true;
      setTimeout(()=>{ renderAll(); document.getElementById('lock-'+lockKey)?.scrollIntoView({behavior:'smooth',block:'center'}); }, 60);
    }
    return;
  }
  if(strictGateActive){
    if(!proj.shot.strictResolutions) proj.shot.strictResolutions = {};
    proj.shot.strictResolutions[strictGateActive.id] = (action==='allow') ? 'allow' : 'skip';
    save();
  }
  strictGateActive = null;
  showNextStrictGate();
}

/* ---------------- global error visibility ----------------
   If anything throws anywhere in the app, show it on screen instead of
   failing silently — this matters most on mobile where there's no console. */
window.addEventListener('error', function(e){
  showOnScreenError(e.message + (e.filename ? ` (line ${e.lineno})` : ''));
});
window.addEventListener('unhandledrejection', function(e){
  showOnScreenError('Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
function showOnScreenError(msg){
  let banner = document.getElementById('errorBanner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'errorBanner';
    banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#B91C1C;color:#fff;padding:12px 16px;font-family:monospace;font-size:12px;z-index:9999;max-height:40vh;overflow-y:auto;';
    document.body.appendChild(banner);
  }
  const line = document.createElement('div');
  line.style.cssText = 'margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.2);padding-bottom:4px;';
  line.textContent = '⚠ ' + msg;
  banner.appendChild(line);
}
