async function checkVisualConsistency(collection, assetId){
  const proj = activeProject();
  const entity = getEntity(proj, collection, assetId);
  const resultEl = document.getElementById('visualConsistencyResult');
  if(!hasAIKey()){ openAISettingsModal('Add your Anthropic API key to check reference images for visual consistency.'); return; }
  const refs = (entity.referenceImages||[]).filter(r=>r.authorityLevel!=='INSPIRATION ONLY');
  if(refs.length<2){ if(resultEl) resultEl.textContent = 'Need at least two non-inspiration references to compare.'; return; }
  if(resultEl) resultEl.innerHTML = `<div class="sub">Comparing ${refs.length} reference images…</div>`;
  const content = [
    { type:'text', text: `These are reference images for "${entity.name}". Each is labeled with what it's meant to control. Identify any real visual inconsistencies BETWEEN images that claim authority over the same attribute (e.g. two images both meant to control face identity, but showing different faces). Be specific and concrete. If everything looks consistent, say so plainly. Do not invent problems.\n\nLabels:\n${refs.map((r,i)=>`Image ${i+1}: controls [${(r.controls||[]).join(', ')||'unspecified'}], authority: ${r.authorityLevel}`).join('\n')}` },
    ...refs.map(r=>({ type:'image', source:{ type:'base64', media_type:r.mediaType, data:r.imageData } })),
  ];
  try{
    const answer = await callClaude('You are a visual continuity checker for a production tool. Be concrete, brief, and only flag real inconsistencies you can actually see.', content);
    if(resultEl) resultEl.innerHTML = `<div class="output-box" style="font-family:'Public Sans',sans-serif;margin-top:8px;">${escapeHtml(answer)}</div>`;
  }catch(e){
    if(resultEl) resultEl.textContent = (e.code==='NO_API_KEY') ? 'Add your API key in AI Settings first.' : 'Could not complete the check — try again.';
  }
}

/* ============================================================
   PROJECT KNOWLEDGE — universal ingestion, extraction, review,
   conflict detection, and context-aware retrieval.
   Uses the Anthropic API directly from this artifact.
   ============================================================ */

async function callClaudeRaw(systemPrompt, userContent, maxTokens){
  const config = getAIConfig();
  if(!config.apiKey || !config.apiKey.trim()){
    const err = new Error('NO_API_KEY');
    err.code = 'NO_API_KEY';
    throw err;
  }
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": config.apiKey.trim(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: maxTokens || 1000,
      system: systemPrompt,
      messages: [{ role:"user", content: userContent }],
    })
  });
  const data = await response.json();
  if(data.type==='error'){
    const err = new Error(data.error?.message || 'API_ERROR');
    err.code = 'API_ERROR';
    throw err;
  }
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
  return { text: textBlocks.join('\n'), stopReason: data.stop_reason };
}

async function callClaude(systemPrompt, userContent, maxTokens){
  const result = await callClaudeRaw(systemPrompt, userContent, maxTokens);
  return result.text;
}

/* ---------- robust JSON extraction & repair -----------
   Handles: markdown fences, leading/trailing explanatory text around the
   JSON, and JSON truncated mid-object because the model hit its output
   limit. A single malformed field must never destroy an otherwise-good
   result — this is used everywhere a model response is parsed as JSON. */

function extractJsonBlock(text){
  const cleaned = text.replace(/```json/gi,'').replace(/```/g,'');
  let startIdx = -1;
  for(let i=0;i<cleaned.length;i++){
    if(cleaned[i]==='{' || cleaned[i]==='['){ startIdx = i; break; }
  }
  if(startIdx===-1) return cleaned.trim();
  const openChar = cleaned[startIdx];
  const closeChar = openChar==='{' ? '}' : ']';
  let depth = 0, inString = false, escapeNext = false;
  for(let i=startIdx;i<cleaned.length;i++){
    const ch = cleaned[i];
    if(escapeNext){ escapeNext=false; continue; }
    if(ch==='\\'){ escapeNext=true; continue; }
    if(ch==='"'){ inString = !inString; continue; }
    if(inString) continue;
    if(ch===openChar) depth++;
    else if(ch===closeChar){
      depth--;
      if(depth===0) return cleaned.slice(startIdx, i+1);
    }
  }
  // never closed — likely truncated by an output limit; hand back what
  // exists from the opening bracket onward so repairTruncatedJson can try.
  return cleaned.slice(startIdx);
}

function repairTruncatedJson(text){
  function closersFor(s){
    const stack = [];
    let inString=false, escapeNext=false;
    for(let i=0;i<s.length;i++){
      const ch = s[i];
      if(escapeNext){ escapeNext=false; continue; }
      if(ch==='\\'){ escapeNext=true; continue; }
      if(ch==='"'){ inString = !inString; continue; }
      if(inString) continue;
      if(ch==='{') stack.push('}');
      else if(ch==='[') stack.push(']');
      else if(ch==='}' || ch===']') stack.pop();
    }
    return stack;
  }
  // first attempt: just balance whatever is already there
  try{ return JSON.parse(text + closersFor(text).slice().reverse().join('')); }catch(e){}
  // otherwise back off to the last structurally-safe cut point (a comma or
  // opening bracket outside any string) and try again from there
  for(let cut=text.length-1; cut>0; cut--){
    if(text[cut]===',' || text[cut]==='{' || text[cut]==='['){
      const trimmed = text.slice(0,cut);
      try{ return JSON.parse(trimmed + closersFor(trimmed).slice().reverse().join('')); }
      catch(e){ continue; }
    }
  }
  return null;
}

function parseJsonSafe(text){
  if(!text) return null;
  const block = extractJsonBlock(text);
  try{ return JSON.parse(block); }catch(e){}
  return repairTruncatedJson(block);
}

function chunkText(text, size){
  const chunks = [];
  for(let i=0;i<text.length;i+=size) chunks.push(text.slice(i,i+size));
  return chunks;
}

/* ============================================================
   SMART AUTOFILL — one-box ingestion.
   User pastes messy free text -> Claude sorts it into the 10 locks,
   matching named characters/sets/props against the Asset Library and
   Project Knowledge -> nothing is applied until the user reviews it.
   Every proposed value carries a source and confidence; low-confidence
   / inferred values start UNCHECKED so nothing slips in silently.
   ============================================================ */

const AUTOFILL_SIMPLE_LOCKS = {
  style: ['visualMedium','styleDescription','realismLevel','renderFeel','colorLanguage','mustInclude','mustNotInclude'],
  set: ['setName','timeOfDay','weather','interiorExterior','architecturalStyle','backgroundDensity','environmentalWear','setContinuity'],
  camera: ['shotType','cameraDistance','lensLength','depthOfField','composition','cameraMovementDuringAction'],
  lighting: ['keyLight','lightDirection','lightTemperature','atmosphere','mood'],
  action: ['primaryAction','secondaryAction','timing'],
  continuity: ['priorShotContinuity','wardrobeState','propState2','screenDirection','eyelineContinuity','timeElapsed'],
  forbidden: ['customForbidden'],
};
const AUTOFILL_CHARACTER_FIELDS = ['currentEmotion','currentPose','headDirection','eyeDirection','positionInFrame','continuityState'];
const AUTOFILL_WARDROBE_FIELDS = ['top','bottom','outerwear','shoes','condition','continuityNote'];
const AUTOFILL_PROP_FIELDS = ['propType','location','state','whoIsHolding'];
const AUTOFILL_SOURCES = ['USER_TEXT','ASSET_CANON','PROJECT_BIBLE','STORY_BIBLE','PROJECT_KNOWLEDGE','PRIOR_SHOT','AI_INFERENCE','AI_SUGGESTED'];

let autofillProposal = null; // the parsed extraction result, kept while the review modal is open
let autofillMode = 'safe'; // 'safe' | 'complete' — Complete allows AI_SUGGESTED minor shot-specific proposals

// Complete Autofill may only ever propose values for these fields — never
// style, set, wardrobe, forbidden, character identity, or primary action.
// Enforced in code, not just prompt wording, so model non-compliance can't
// leak a "suggestion" into anything that touches canon.
const AI_SUGGESTABLE_FIELDS = new Set([
  'camera.shotType','camera.cameraDistance','camera.lensLength','camera.depthOfField','camera.composition','camera.cameraMovementDuringAction',
  'lighting.keyLight','lighting.lightDirection','lighting.lightTemperature','lighting.atmosphere','lighting.mood',
  'action.secondaryAction','action.timing',
]);

let autofillAccepted = {};   // key -> boolean, which proposed items are currently checked

function buildAssetSummary(proj){
  const chars = proj.characters.map(c=>`${c.name}${c.role?` (${c.role})`:''}${c.age?`, age ${c.age}`:''}${c.defaultWardrobe?` — default wardrobe: ${c.defaultWardrobe}`:''}`).join('\n') || '(none saved)';
  const sets = proj.sets.map(s=>`${s.name}${s.location?` — ${s.location}`:''}${s.architecturalStyle?`, ${s.architecturalStyle}`:''}`).join('\n') || '(none saved)';
  const props = proj.props.map(p=>`${p.name}${p.type?` (${p.type})`:''}`).join('\n') || '(none saved)';
  return `SAVED CHARACTERS:\n${chars}\n\nSAVED SETS:\n${sets}\n\nSAVED PROPS:\n${props}`;
}

function buildProjectBibleSummary(proj){
  const b = proj.bible || {};
  const parts = [];
  if(fieldFilled(b.visualStyle)) parts.push(`Visual style (permanent): ${b.visualStyle}`);
  if(fieldFilled(b.world)) parts.push(`World (permanent): ${b.world}`);
  if(fieldFilled(b.permanentRules)) parts.push(`Additional permanent rules: ${b.permanentRules}`);
  return parts.length ? parts.join('\n') : '(no Project Bible content saved yet)';
}

function buildStoryBibleSummary(proj){
  const sb = proj.storyBible || {};
  const parts = [];
  if(fieldFilled(sb.corePhilosophy)) parts.push(`Core philosophy: ${sb.corePhilosophy}`);
  if(fieldFilled(sb.premise)) parts.push(`Premise: ${sb.premise}`);
  if(fieldFilled(sb.themes)) parts.push(`Themes: ${sb.themes}`);
  return parts.length ? parts.join('\n') : '(no Story Bible content saved yet)';
}

function buildResolvedStoryContextSummary(proj){
  const shot = proj.shot;
  if(!shot.chapterId && !shot.sceneId && !shot.shotNumber) return null; // no story position set — standalone shot, nothing to resolve
  const resolved = resolveStoryContext(proj, shot.chapterId, shot.sceneId, shot.shotNumber);
  if(!resolved.priorShot) return '(this is the first shot in the story — no prior shot to inherit from; use canon defaults only)';
  const ctx = resolved.context;
  const lines = [`Immediately prior shot in story order: "${resolved.priorShot.title}"`];
  if(ctx.priorShotEndState) lines.push(`Prior shot end state (strongest continuity source): ${ctx.priorShotEndState}`);
  (ctx.wardrobeRefs||[]).forEach(wr=>{
    const c = proj.characters.find(x=>x.id===wr.charId);
    const bits = [wr.top, wr.bottom, wr.condition].filter(Boolean).join(', ');
    if(bits) lines.push(`${c?c.name:'Character'} wardrobe carried from prior shot: ${bits}`);
  });
  (ctx.props||[]).forEach(p=>{
    if(p.state || p.whoIsHolding) lines.push(`${p.propName||'Prop'} carried from prior shot: ${[p.state, p.whoIsHolding?`held by ${p.whoIsHolding}`:''].filter(Boolean).join(', ')}`);
  });
  (ctx.characterRefs||[]).forEach(cr=>{
    const c = proj.characters.find(x=>x.id===cr.charId);
    const bits = [cr.currentPose, cr.eyeDirection?`looking ${cr.eyeDirection}`:''].filter(Boolean).join(', ');
    if(bits) lines.push(`${c?c.name:'Character'} prior state: ${bits}`);
  });
  if(fieldFilled(ctx.set && ctx.set.setName)) lines.push(`Prior location: ${ctx.set.setName}${ctx.set.timeOfDay?`, ${ctx.set.timeOfDay}`:''}`);
  if(fieldFilled(ctx.lighting && ctx.lighting.keyLight)) lines.push(`Prior lighting: ${ctx.lighting.keyLight}${ctx.lighting.lightTemperature?`, ${ctx.lighting.lightTemperature}`:''}`);
  return lines.join('\n');
}

/* ---------- Deterministic Project Bible → Style Lock mapping ----------
   This does NOT depend on the AI extraction call succeeding, complying, or
   even running at all — it reads proj.bible.visualStyle directly with plain
   text parsing and produces PROJECT_BIBLE/HIGH evidence for the four core
   Style fields. It only ever fills fields the shot-specific extraction
   didn't already supply (explicit shot text always wins), and it never
   writes anything back into the Project Bible itself. */

function deriveBibleStyleDefaults(proj){
  const b = proj.bible || {};
  const result = {};
  if(!fieldFilled(b.visualStyle)) return result;

  const fullText = b.visualStyle.trim();
  const sentences = fullText.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
  const lower = fullText.toLowerCase();

  // Visual medium: the first sentence almost always names the medium
  // ("Premium stylized theatrical 3D animation.")
  result.visualMedium = { value: sentences[0] || fullText, source:'PROJECT_BIBLE', confidence:'HIGH' };

  // Style description: the full permanent style text — this field is
  // explicitly meant to hold a fuller description, unlike the terser fields.
  result.styleDescription = { value: fullText, source:'PROJECT_BIBLE', confidence:'HIGH' };

  // Realism level: keyword-detect against the same options Style Lock's
  // own dropdown offers, so the value is guaranteed to match the field.
  let realism = null;
  if(/highly stylized/.test(lower)) realism = 'highly stylized';
  else if(/semi-realistic/.test(lower)) realism = 'semi-realistic';
  else if(/\bstylized\b/.test(lower) || /\banimat/.test(lower)) realism = 'stylized';
  else if(/photorealistic/.test(lower) && !/(no|not|never)\s+photorealistic/.test(lower)) realism = 'photorealistic';
  else if(/\brealistic\b/.test(lower) && !/(no|not|never)\s+realistic/.test(lower)) realism = 'realistic';
  if(realism) result.realismLevel = { value: realism, source:'PROJECT_BIBLE', confidence:'HIGH' };

  // Render feel: pull out the remaining descriptive sentences (prohibitions,
  // rendering qualities) beyond the medium itself, so it's not just a
  // duplicate of visualMedium/styleDescription.
  const renderFeelText = sentences.slice(1).join(' ').trim();
  result.renderFeel = { value: renderFeelText || fullText, source:'PROJECT_BIBLE', confidence:'HIGH' };

  return result;
}

function mergeBibleStyleDefaults(mergedProposal, proj){
  const bibleDefaults = deriveBibleStyleDefaults(proj);
  if(!mergedProposal.style) mergedProposal.style = {};
  Object.entries(bibleDefaults).forEach(([field, item])=>{
    if(!mergedProposal.style[field]){ // only fills a gap — explicit shot-text extraction always takes priority
      mergedProposal.style[field] = item;
    }
  });
  return mergedProposal;
}

function buildProjectKnowledgeSummary(proj){
  const facts = proj.facts.filter(f=>f.status==='approved'||f.status==='locked'||f.status==='edited');
  if(facts.length===0) return '(no locked/approved project facts yet)';
  return facts.map(f=>`[${f.category}] ${f.subject}: ${f.factText}`).join('\n');
}

function buildCurrentShotSummary(proj){
  const shot = proj.shot;
  const lines = [];
  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const val = shot[lock] ? shot[lock][f] : null;
      if(fieldFilled(val)) lines.push(`${lock}.${f} = ${val}`);
    });
  });
  shot.characterRefs.forEach(cr=>{
    const c = proj.characters.find(x=>x.id===cr.charId);
    lines.push(`character already attached: ${c?c.name:'unknown'}`);
  });
  return lines.length ? lines.join('\n') : '(shot is currently empty)';
}

function buildSmartAutofillBasePrompt(proj, extraSourceText){
  const modeNote = proj.shot.mode==='Image Edit Prompt'
    ? 'This is an IMAGE EDIT shot. Identify what should be preserved exactly (face, hair, body, background, camera, lighting, pose, environment — whichever apply) versus what should change. Put the "change only" detail in the correct lock field, and put an explicit preservation instruction in forbidden.customForbidden (e.g. "Preserve exactly: face, hair, body, background, camera, lighting, pose. Change only: shirt.").'
    : proj.shot.mode.includes('Video')
    ? 'This is a VIDEO/ANIMATION shot. Pay extra attention to movement, timing, camera movement, duration, and start/end state — these belong in the action and camera fields.'
    : 'This is an image shot.';

  return `You are the Smart Autofill extraction engine inside Xpert Prompt, a production tool built on one rule: anything left unspecified in a prompt gets silently invented by image/video generators. Your job is to ORGANIZE evidence into the right fields — you are NOT a creative writer and you must NOT complete the scene.

${modeNote}

===== THE SINGLE MOST IMPORTANT RULE =====
You may ONLY populate a field from one of these evidence sources, in this priority order when more than one could apply to the same field:
1. USER_TEXT — the exact detail the user just typed for THIS shot, or a direct, unambiguous paraphrase of it. Explicit current-shot instructions always take priority and may intentionally override any other source below for this one shot.
2. ASSET_CANON — a value actually present on a matched saved character/set/prop's own fields below. Never use anything from an asset marked canonStatus=locked that conflicts with what the user actually typed — flag it instead of silently picking one.
3. PROJECT_BIBLE / STORY_BIBLE — permanent project-wide and narrative canon below. Established, standing canon, not a guess — use it with confidence=HIGH whenever it directly supports a field the user's text didn't otherwise specify. Never invent this content, and never treat this shot's text as changing the Bible itself.
4. PROJECT_KNOWLEDGE — a fact actually listed below in the locked/approved project knowledge.
5. PRIOR_SHOT — the resolved story context below, from the shot immediately before this one in chapter/scene/shot-number order (NOT simply whatever was last edited). Use this for wardrobe, held props, vehicle/location state, and lighting the user's text doesn't otherwise change — this is what lets the user avoid retyping the same wardrobe, location, or lighting every shot. The prior shot's explicit End State is the strongest single source within this tier.
6. AI_INFERENCE — last resort only, requires the user's explicit approval, never HIGH confidence.

Anything else — weather, time of day beyond what's stated, background extras (vendors, kids, drones, vehicles, crowd density), camera angle, lens, lighting, mood, pose beyond what's literally described, facial expression — if it is NOT explicitly present in the user's text, a matched asset's own fields, the Bibles, the locked project knowledge, or the resolved prior-shot context, IT DOES NOT GO IN THE MAIN OUTPUT. It either gets left out entirely, or — only if genuinely implied by the wording (like "after school" implying afternoon) — goes in as source=AI_INFERENCE with a reason explaining exactly what wording implied it and confidence no higher than MEDIUM.

CRITICAL — PROVENANCE MUST BE LITERALLY TRUE: never label something USER_TEXT unless you could point to the exact words in the user's input that say it. Do NOT invent a plausible-sounding environmental or atmospheric detail and then mislabel it USER_TEXT, PROJECT_BIBLE, or PROJECT_KNOWLEDGE to make it look sourced. If you are inventing it because it would typically make sense for the scene, genre, or setting, that is AI_INFERENCE at best, and in most cases should simply be omitted rather than included at all.

When in real doubt, leave the field out. An empty field the user can see and fill in is far better than a wrong or invented one they don't notice.

PROJECT BIBLE — PERMANENT PROJECT-WIDE CANON (use for Style/Set fields the shot text doesn't otherwise specify; source=PROJECT_BIBLE, confidence=HIGH):
${buildProjectBibleSummary(proj)}

STORY BIBLE — NARRATIVE CANON (source=STORY_BIBLE, confidence=HIGH when directly relevant):
${buildStoryBibleSummary(proj)}

ASSET LIBRARY (match mentioned names against these; note the matched name exactly if you find one; only use fields actually present on the matched asset — do not invent details about it):
${buildAssetSummary(proj)}

LOCKED/APPROVED PROJECT KNOWLEDGE (only these facts count as PROJECT_KNOWLEDGE — nothing else):
${buildProjectKnowledgeSummary(proj)}

RESOLVED STORY CONTEXT (source=PRIOR_SHOT — the shot immediately before this one in chapter/scene/shot-number order; use for wardrobe/props/location/lighting continuity the user's text doesn't override):
${buildResolvedStoryContextSummary(proj) || '(this shot has no chapter/scene/shot-number position set — no story context to resolve)'}

FIELDS ALREADY FILLED IN THE CURRENT SHOT (do not repeat these, do not contradict them unless the user's new text clearly overrides them):
${buildCurrentShotSummary(proj)}

${extraSourceText ? `ADDITIONAL PROJECT SOURCE EXCERPTS SELECTED BY THE USER (only these count as PROJECT_KNOWLEDGE-equivalent source text):\n${extraSourceText}\n` : ''}`;
}

function buildSimpleSchemaInstructions(mode){
  const completeModeBlock = mode==='complete' ? `

COMPLETE AUTOFILL MODE IS ON. After using all real evidence above, you MAY additionally propose reasonable shot-specific values, source="AI_SUGGESTED", confidence="MEDIUM", for ONLY these still-empty fields: camera.shotType, camera.cameraDistance, camera.lensLength, camera.depthOfField, camera.composition, camera.cameraMovementDuringAction, lighting.keyLight, lighting.lightDirection, lighting.lightTemperature, lighting.atmosphere, lighting.mood, action.secondaryAction, action.timing. These are minor cinematic choices, not canon. NEVER use source="AI_SUGGESTED" for style, set, wardrobe, forbidden, or action.primaryAction — those must stay evidence-based or blank. Never invent major canon (a character's face/age/proportions, permanent wardrobe, set architecture, new principal characters, or story action beyond what's described) under any source label.` : `

SAFE AUTOFILL MODE IS ON. Do not propose creative/cinematic filler for unspecified fields — leave anything not supported by real evidence out entirely.`;

  return `The user's text may be short or extremely long and detailed — a long, richly detailed input is expected and desired, not a problem. Extract everything it supports.

Also determine the SHOT CONTENT TYPE — what the shot actually contains — and return it as a top-level "contentType" field. The value must be EXACTLY one of these five strings: character_environment, character_only, environment_only, product_only, vehicle_only.

If the user's text explicitly says things like "environment only", "no characters", "set only", "location only", "establishing shot, no subject", or clearly equivalent language, classify contentType as environment_only with source=USER_TEXT and confidence=HIGH — this is directly stated evidence, not an inference, and must not be downgraded. If the text describes a character present in an environment, use character_environment. If it's about a character with no meaningful environment detail, use character_only. If it centers on a product or prop with no character, use product_only. If it centers on a vehicle with no character, use vehicle_only. If genuinely ambiguous, use character_environment as the default and mark confidence MEDIUM.
${completeModeBlock}

Return ONLY a JSON object, no preamble, no markdown fences, matching exactly this shape (omit any field the text gives no basis for):

{
  "contentType": {"value":"character_environment|character_only|environment_only|product_only|vehicle_only", "source":"USER_TEXT|AI_INFERENCE", "confidence":"HIGH|MEDIUM|LOW"},
  "style": { "<fieldKey>": {"value":"...", "source":"USER_TEXT|ASSET_CANON|PROJECT_BIBLE|STORY_BIBLE|PROJECT_KNOWLEDGE|PRIOR_SHOT|AI_INFERENCE", "confidence":"HIGH|MEDIUM|LOW", "reason":"required if source is AI_INFERENCE"} },
  "set": { ... fields from: setName, timeOfDay, weather, interiorExterior, architecturalStyle, backgroundDensity, environmentalWear, setContinuity },
  "camera": { ... fields from: shotType, cameraDistance, lensLength, depthOfField, composition, cameraMovementDuringAction },
  "lighting": { ... fields from: keyLight, lightDirection, lightTemperature, atmosphere, mood },
  "action": { ... fields from: primaryAction, secondaryAction, timing — for an environment-only shot with no subject, "Static establishing environment" or "No subject action" or "Environment-only establishing shot" are all valid primaryAction values if that's genuinely what the text describes },
  "continuity": { ... fields from: priorShotContinuity, wardrobeState, propState2, screenDirection, eyelineContinuity, timeElapsed — omit wardrobeState/propState2/eyelineContinuity entirely if the shot has no character/wardrobe/props },
  "forbidden": { "customForbidden": {...} }
}

Do NOT include "characters" or "props" keys in this response — those are extracted separately. Keep each value concise (a phrase, not a paragraph) so the response stays compact regardless of how much detail the source text contains.`;
}

const AUTOFILL_ENTITY_SCHEMA_INSTRUCTIONS = `The user's text may describe one character/prop briefly, or many characters/props in exhaustive detail — handle either case fully; do not shorten or skip entities to save space.

Return ONLY a JSON object, no preamble, no markdown fences, matching exactly this shape (empty arrays if none apply):

{
  "characters": [ { "name":"as mentioned in text", "matchedAssetName": "exact saved character name if matched, else null",
      "currentEmotion":{"value":"...","source":"...","confidence":"...","reason":"..."}, "currentPose":{...}, "headDirection":{...}, "eyeDirection":{...}, "positionInFrame":{...}, "continuityState":{...},
      "wardrobe": { "top":{...}, "bottom":{...}, "outerwear":{...}, "shoes":{...}, "condition":{...}, "continuityNote":{...} } } ],
  "props": [ { "name":"as mentioned in text", "matchedAssetName": "exact saved prop name if matched, else null",
      "propType":{...}, "location":{...}, "state":{...}, "whoIsHolding":{...} } ]
}

Do NOT include "style", "set", "camera", "lighting", "action", "continuity", or "forbidden" keys in this response — those are extracted separately. Include every character/prop the text describes as its own array entry — do not merge or drop any to save space. Match character/prop names loosely (first name, nickname) against the asset library list above, but only pull field values actually listed for that asset — never invent additional attributes about it. Keep each value concise (a phrase, not a paragraph).`;

const APPROVED_TEMPLATE_PHRASES = [
  'static establishing environment', 'no subject action', 'environment-only establishing shot',
];

function textSupportsValue(rawText, value){
  if(!value || !value.trim()) return false;
  const normalizedText = rawText.toLowerCase();
  const normalizedValue = value.toLowerCase().trim();
  if(APPROVED_TEMPLATE_PHRASES.some(p=> normalizedValue.includes(p))) return true; // sanctioned template values are never subject to verbatim-text verification
  if(normalizedText.includes(normalizedValue)) return true;
  // require most of the distinctive (4+ letter) words in the value to actually
  // appear verbatim in the user's own text — catches paraphrases while still
  // rejecting invented content that happens to share a filler word or two.
  const words = normalizedValue.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>=4);
  if(words.length===0) return normalizedText.includes(normalizedValue);
  const matched = words.filter(w=>normalizedText.includes(w));
  return (matched.length / words.length) >= 0.6;
}

function enforceAiSuggestedPolicy(merged, mode){
  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const item = merged[lock] && merged[lock][f];
      if(item && item.source==='AI_SUGGESTED'){
        const key = `${lock}.${f}`;
        if(mode!=='complete' || !AI_SUGGESTABLE_FIELDS.has(key)){
          delete merged[lock][f]; // never allowed here regardless of what the model returned
        }
      }
    });
  });
  // AI_SUGGESTED is never valid for characters/props at all — strip unconditionally
  (merged.characters||[]).forEach(c=>{
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{ if(c[f] && c[f].source==='AI_SUGGESTED') delete c[f]; });
    if(c.wardrobe) AUTOFILL_WARDROBE_FIELDS.forEach(f=>{ if(c.wardrobe[f] && c.wardrobe[f].source==='AI_SUGGESTED') delete c.wardrobe[f]; });
  });
  (merged.props||[]).forEach(p=>{
    AUTOFILL_PROP_FIELDS.forEach(f=>{ if(p[f] && p[f].source==='AI_SUGGESTED') delete p[f]; });
  });
  return merged;
}

function sanitizeAutofillProvenance(proposal, rawUserText){
  const recheck = (item)=>{
    if(!item) return item;
    if(item.source==='USER_TEXT' && !textSupportsValue(rawUserText, item.value)){
      item.source = 'AI_INFERENCE';
      item.confidence = 'LOW';
      item.reason = 'Reclassified: this could not be verified against your actual input text.' + (item.reason ? ' ' + item.reason : '');
    }
    return item;
  };
  Object.keys(AUTOFILL_SIMPLE_LOCKS).forEach(lock=>{
    if(!proposal[lock]) return;
    Object.keys(proposal[lock]).forEach(f=>{ proposal[lock][f] = recheck(proposal[lock][f]); });
  });
  (proposal.characters||[]).forEach(c=>{
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{ if(c[f]) c[f] = recheck(c[f]); });
    if(c.wardrobe) AUTOFILL_WARDROBE_FIELDS.forEach(f=>{ if(c.wardrobe[f]) c.wardrobe[f] = recheck(c.wardrobe[f]); });
  });
  (proposal.props||[]).forEach(p=>{
    AUTOFILL_PROP_FIELDS.forEach(f=>{ if(p[f]) p[f] = recheck(p[f]); });
  });
  return proposal;
}

let autofillPartialNotes = [];

async function callClaudeRawWithRetry(systemPrompt, userContent, maxTokens){
  try{
    return await callClaudeRaw(systemPrompt, userContent, maxTokens);
  }catch(e){
    if(e.code==='NO_API_KEY') throw e; // no point retrying a missing key
    await new Promise(r=>setTimeout(r, 800));
    return await callClaudeRaw(systemPrompt, userContent, maxTokens); // one retry for transient errors (rate limit, momentary overload)
  }
}

let autofillStaleFields = [];

function computeStaleShotFields(proj, proposal){
  const stale = [];
  const staleCandidateLocks = ['set','camera','lighting','action'];
  staleCandidateLocks.forEach(lock=>{
    AUTOFILL_SIMPLE_LOCKS[lock].forEach(f=>{
      const currentVal = proj.shot[lock][f];
      const proposedItem = proposal[lock] && proposal[lock][f];
      if(fieldFilled(currentVal) && !proposedItem){
        stale.push({ key:`stale.${lock}.${f}`, lock, field:f, charId:null, label:`${fieldLabelize(lock)} — ${fieldLabelize(f)}`, currentValue: currentVal });
      }
    });
  });
  proj.shot.characterRefs.forEach(cr=>{
    const c = proj.characters.find(x=>x.id===cr.charId);
    const nm = c ? c.name : 'Character';
    const matchedProposalChar = (proposal.characters||[]).find(pc => pc.matchedAssetName && c && pc.matchedAssetName.toLowerCase()===c.name.toLowerCase());
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{
      const currentVal = cr[f];
      const proposedItem = matchedProposalChar ? matchedProposalChar[f] : null;
      if(fieldFilled(currentVal) && !proposedItem){
        stale.push({ key:`stale.char.${cr.charId}.${f}`, lock:'character', field:f, charId:cr.charId, label:`${nm} — ${fieldLabelize(f)}`, currentValue: currentVal });
      }
    });
  });
  return stale;
}

function clearStaleField(key){
  const proj = activeProject();
  const entry = autofillStaleFields.find(s=>s.key===key);
  if(!entry) return;
  if(entry.lock==='character'){
    const cr = proj.shot.characterRefs.find(x=>x.charId===entry.charId);
    if(cr) cr[entry.field] = '';
  } else {
    proj.shot[entry.lock][entry.field] = '';
  }
  save();
  autofillStaleFields = autofillStaleFields.filter(s=>s.key!==key);
  renderAutofillReviewModal();
}

function dismissStaleField(key){
  autofillStaleFields = autofillStaleFields.filter(s=>s.key!==key);
  renderAutofillReviewModal();
}

function autofillStaleSection(){
  if(autofillStaleFields.length===0) return '';
  return `<div class="section-block" style="border-color:var(--red);">
    <h3 style="color:var(--red-text);">⚠ Possible Stale Shot Data</h3>
    <div class="sub" style="margin-bottom:10px;">These fields already have values that your new description didn't mention — they may belong to a previous shot. Nothing has changed yet; choose for each one.</div>
    <div class="entity-list">
      ${autofillStaleFields.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg-raised);border-radius:8px;padding:8px 12px;">
        <div style="font-size:12.5px;"><strong>${escapeHtml(s.label)}:</strong> "${escapeHtml(s.currentValue)}"</div>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <button class="btn btn-sm" onclick="dismissStaleField('${s.key}')">Keep</button>
          <button class="btn btn-sm btn-danger" onclick="clearStaleField('${s.key}')">Clear</button>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

async function runSmartAutofill(){
  const proj = activeProject();
  if(!hasAIKey()){ openAISettingsModal('Add your Anthropic API key to use Smart Autofill.'); return; }
  const textEl = document.getElementById('autofillInput');
  const text = textEl ? textEl.value.trim() : '';
  if(!text){ openMessageModal('Paste in what you know about this shot first.'); return; }

  const modeSelect = document.getElementById('autofillModeSelect');
  autofillMode = modeSelect ? modeSelect.value : 'safe';

  const selectedSourceIds = Array.from(document.querySelectorAll('.autofill-source-check:checked')).map(el=>el.value);
  const extraSourceText = selectedSourceIds.length
    ? proj.sources.filter(s=>selectedSourceIds.includes(s.id)).map(s=>`--- ${s.name} ---\n${(s.content||'').slice(0,6000)}`).join('\n\n')
    : '';

  const statusEl = document.getElementById('autofillStatus');
  if(statusEl) statusEl.textContent = 'Analyzing…';

  try{
    const basePrompt = buildSmartAutofillBasePrompt(proj, extraSourceText);

    // Two independent calls: one for the seven simple locks, one for
    // characters/props. A long, richly detailed cast never eats into the
    // budget for style/camera/lighting/etc, and if one call fails or gets
    // cut off, the other's results are still kept — nothing is all-or-nothing.
    // Each also gets one automatic retry for transient failures before giving up.
    const [simpleSettled, entitySettled] = await Promise.allSettled([
      callClaudeRawWithRetry(basePrompt + '\n\n' + buildSimpleSchemaInstructions(autofillMode), text, 4000),
      callClaudeRawWithRetry(basePrompt + '\n\n' + AUTOFILL_ENTITY_SCHEMA_INSTRUCTIONS, text, 4000),
    ]);

    const notes = [];
    let simpleParsed = null, entityParsed = null;

    if(simpleSettled.status==='fulfilled'){
      simpleParsed = parseJsonSafe(simpleSettled.value.text);
      if(!simpleParsed) notes.push('Style / Set / Camera / Lighting / Action / Continuity / Forbidden: the response for this section could not be read as JSON, even after recovery — nothing from this section was applied. Try Smart Autofill again; the rest of your input is unaffected.');
      else if(simpleSettled.value.stopReason==='max_tokens') notes.push('The Style/Set/Camera/etc. response was cut off by a length limit — what was returned before the cutoff has been kept.');
    } else {
      notes.push('Style / Set / Camera / etc. extraction failed after a retry: ' + (simpleSettled.reason && simpleSettled.reason.message || 'unknown error') + '.');
    }

    if(entitySettled.status==='fulfilled'){
      entityParsed = parseJsonSafe(entitySettled.value.text);
      if(!entityParsed) notes.push('Characters / Props: the response for this section could not be read as JSON, even after recovery — nothing from this section was applied. Try Smart Autofill again; the rest of your input is unaffected.');
      else if(entitySettled.value.stopReason==='max_tokens') notes.push('The Characters/Props response was cut off by a length limit — what was returned before the cutoff has been kept.');
    } else {
      notes.push('Characters / Props extraction failed after a retry: ' + (entitySettled.reason && entitySettled.reason.message || 'unknown error') + '.');
    }

    // Never dead-end here. Even in the worst case where neither section
    // parsed, still open the review screen — empty sections plus the real
    // notes above are more useful than a vague status message the user
    // can't act on, and it never tells anyone to shorten their input.
    const merged = Object.assign(
      { style:{}, set:{}, camera:{}, lighting:{}, action:{}, continuity:{}, forbidden:{}, characters:[], props:[] },
      simpleParsed || {}, entityParsed || {}
    );
    if(!Array.isArray(merged.characters)) merged.characters = [];
    if(!Array.isArray(merged.props)) merged.props = [];

    // Code-level enforcement, not just prompt wording: strip any AI_SUGGESTED
    // value that isn't on the whitelist, or that appears at all when Safe
    // mode is selected — regardless of what the model actually returned.
    enforceAiSuggestedPolicy(merged, autofillMode);

    // Runs regardless of whether the AI calls above succeeded, failed, or
    // complied with instructions — Style Lock's Project Bible mapping never
    // depends on the model getting it right.
    mergeBibleStyleDefaults(merged, proj);

    autofillProposal = sanitizeAutofillProvenance(merged, text);
    autofillPartialNotes = notes;
    autofillStaleFields = computeStaleShotFields(proj, autofillProposal);
    initAutofillAccepted(autofillProposal);
    if(statusEl) statusEl.textContent = '';
    renderAutofillReviewModal();
  }catch(e){
    if(statusEl) statusEl.textContent = (e.code==='NO_API_KEY') ? 'Add your API key in AI Settings first.' : 'Something went wrong reaching the analysis engine — try again.';
  }
}

function initAutofillAccepted(proposal){
  autofillAccepted = {};
  const defaultFor = (item)=>{
    if(!item) return false;
    const isApprovedTemplate = APPROVED_TEMPLATE_PHRASES.some(p=> (item.value||'').toLowerCase().includes(p));
    if(isApprovedTemplate) return true; // sanctioned canonical values (e.g. environment-only action phrasings) are never suppressed by source-labeling nuance
    return item.source!=='AI_INFERENCE' && item.source!=='AI_SUGGESTED' && (item.confidence==='HIGH' || item.confidence==='MEDIUM');
  };
  if(proposal.contentType) autofillAccepted['contentType'] = defaultFor(proposal.contentType);
  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const item = proposal[lock] && proposal[lock][f];
      if(item) autofillAccepted[`${lock}.${f}`] = defaultFor(item);
    });
  });
  (proposal.characters||[]).forEach((c,ci)=>{
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{
      if(c[f]) autofillAccepted[`char.${ci}.${f}`] = defaultFor(c[f]);
    });
    AUTOFILL_WARDROBE_FIELDS.forEach(f=>{
      const item = c.wardrobe && c.wardrobe[f];
      if(item) autofillAccepted[`char.${ci}.wardrobe.${f}`] = defaultFor(item);
    });
  });
  (proposal.props||[]).forEach((p,pi)=>{
    AUTOFILL_PROP_FIELDS.forEach(f=>{
      if(p[f]) autofillAccepted[`prop.${pi}.${f}`] = defaultFor(p[f]);
    });
  });
}

function buildAutofillPreviewShot(proj){
  // clone the current shot and tentatively apply every currently-checked item,
  // so "still unspecified" reflects what would remain missing after Apply.
  const shot = JSON.parse(JSON.stringify(proj.shot));
  const proposal = autofillProposal;
  if(!proposal) return shot;

  if(proposal.contentType && autofillAccepted['contentType']){
    shot.contentType = proposal.contentType.value;
  }

  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const key = `${lock}.${f}`;
      const item = proposal[lock] && proposal[lock][f];
      if(item && autofillAccepted[key]){
        if(lock==='forbidden') shot.forbidden.customForbidden = item.value;
        else shot[lock][f] = item.value;
      }
    });
  });

  (proposal.characters||[]).forEach((c,ci)=>{
    const matched = proj.characters.find(x=> c.matchedAssetName && x.name.toLowerCase()===c.matchedAssetName.toLowerCase());
    const alreadyAttached = matched && shot.characterRefs.some(cr=>cr.charId===matched.id);
    if(matched && !alreadyAttached){
      shot.characterRefs.push({ charId: matched.id, currentEmotion:'', currentPose:'', eyeDirection:'', headDirection:'', positionInFrame:'', continuityState:'' });
    }
  });

  return shot;
}

function computeAutofillStillMissing(proj){
  const previewShot = buildAutofillPreviewShot(proj);
  const previewProj = Object.assign({}, proj, { shot: previewShot });
  const gaps = [];
  LOCK_DEFS.forEach(def=>{
    const ev = evaluateLock(previewProj, def.key);
    ev.missing.CRITICAL.forEach(m=>gaps.push({severity:'CRITICAL', text:m}));
    ev.missing.IMPORTANT.forEach(m=>gaps.push({severity:'IMPORTANT', text:m}));
  });
  return gaps;
}

function toggleAutofillItem(key, checked){
  autofillAccepted[key] = checked;
  renderAutofillReviewModal();
}

function editAutofillItemValue(pathParts, currentValue){
  openTextInputModal({
    title: 'Edit value',
    defaultValue: currentValue,
    confirmLabel: 'Save',
    allowEmpty: true,
    onConfirm: (val)=>{
      let target = autofillProposal;
      for(let i=0;i<pathParts.length-1;i++){ target = target[pathParts[i]]; }
      target[pathParts[pathParts.length-1]].value = val;
      renderAutofillReviewModal();
    }
  });
}

function applyAutofillProposal(){
  const proj = activeProject();
  const proposal = autofillProposal;
  if(!proposal) return;
  const touchedLocks = new Set();

  if(proposal.contentType && autofillAccepted['contentType']){
    proj.shot.contentType = proposal.contentType.value;
  }

  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const key = `${lock}.${f}`;
      const item = proposal[lock] && proposal[lock][f];
      if(item && autofillAccepted[key]){
        if(lock==='forbidden') proj.shot.forbidden.customForbidden = item.value;
        else proj.shot[lock][f] = item.value;
        touchedLocks.add(lock);
      }
    });
  });

  (proposal.characters||[]).forEach((c,ci)=>{
    let charId = null;
    let matched = c.matchedAssetName ? proj.characters.find(x=>x.name.toLowerCase()===c.matchedAssetName.toLowerCase()) : null;
    const anyFieldAccepted = AUTOFILL_CHARACTER_FIELDS.some(f=>autofillAccepted[`char.${ci}.${f}`]) || AUTOFILL_WARDROBE_FIELDS.some(f=>autofillAccepted[`char.${ci}.wardrobe.${f}`]);
    if(!anyFieldAccepted && !matched) return;

    if(!matched){
      // no saved asset matched this name — create a lightweight one so it's reusable later
      matched = { id: uid(), name: c.name, role:'', age:'', bodyType:'', faceShape:'', skinTone:'', eyeColor:'', hair:'', hairColor:'', distinguishing:'', defaultWardrobe:'', forbiddenDeviations:'', referenceNote:'', referenceImages:[] };
      proj.characters.push(matched);
    }
    charId = matched.id;

    let cr = proj.shot.characterRefs.find(x=>x.charId===charId);
    if(!cr){
      cr = { charId, currentEmotion:'', currentPose:'', eyeDirection:'', headDirection:'', positionInFrame:'', continuityState:'' };
      proj.shot.characterRefs.push(cr);
    }
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{
      const item = c[f];
      if(item && autofillAccepted[`char.${ci}.${f}`]){ cr[f] = item.value; touchedLocks.add('character'); }
    });

    const anyWardrobeAccepted = AUTOFILL_WARDROBE_FIELDS.some(f=>autofillAccepted[`char.${ci}.wardrobe.${f}`]);
    if(anyWardrobeAccepted){
      let wr = proj.shot.wardrobeRefs.find(x=>x.charId===charId);
      if(!wr){
        wr = { charId, top:'', bottom:'', outerwear:'', shoes:'', condition:'', fabric:'', continuityNote:'' };
        proj.shot.wardrobeRefs.push(wr);
      }
      AUTOFILL_WARDROBE_FIELDS.forEach(f=>{
        const item = c.wardrobe && c.wardrobe[f];
        if(item && autofillAccepted[`char.${ci}.wardrobe.${f}`]){ wr[f] = item.value; touchedLocks.add('wardrobe'); }
      });
    }
  });

  (proposal.props||[]).forEach((p,pi)=>{
    const anyAccepted = AUTOFILL_PROP_FIELDS.some(f=>autofillAccepted[`prop.${pi}.${f}`]);
    if(!anyAccepted) return;
    let propRef = proj.shot.props.find(x=>x.propName && x.propName.toLowerCase()===p.name.toLowerCase());
    if(!propRef){
      propRef = { propName: p.name, propType:'', location:'', state:'', whoIsHolding:'', forbiddenChanges:'' };
      proj.shot.props.push(propRef);
    }
    AUTOFILL_PROP_FIELDS.forEach(f=>{
      const item = p[f];
      if(item && autofillAccepted[`prop.${pi}.${f}`]){ propRef[f] = item.value; touchedLocks.add('prop'); }
    });
  });

  save();
  closeAutofillModal();
  autofillProposal = null;
  autofillAccepted = {};
  setView('builder');
  touchedLocks.forEach(l=>{ openLocks[l]=true; });
  renderAll();
}

function fieldLabelize(f){
  return f.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).trim();
}

function autofillItemRow(pathKey, pathParts, item, label){
  if(!item) return '';
  const checked = !!autofillAccepted[pathKey];
  const sourceLabel = item.source==='AI_SUGGESTED' ? 'AI SUGGESTED — SHOT-SPECIFIC' : item.source.replace(/_/g,' ');
  const confColor = item.confidence==='HIGH' ? 'var(--green-text)' : item.confidence==='MEDIUM' ? 'var(--orange-text)' : 'var(--red-text)';
  return `<div class="audit-item" style="align-items:flex-start;">
    <input type="checkbox" ${checked?'checked':''} onchange="toggleAutofillItem('${pathKey}', this.checked)" style="margin-top:2px;">
    <div style="flex:1;">
      <div><strong>${escapeHtml(label)}:</strong> ${escapeHtml(item.value)}
        <button class="btn btn-sm btn-ghost" style="padding:1px 6px;font-size:10px;" onclick='editAutofillItemValue(${JSON.stringify(pathParts)})'>edit</button>
      </div>
      <div style="font-size:10.5px;color:var(--text-faint);margin-top:2px;">
        <span style="color:${confColor};font-weight:600;">${item.confidence}</span> · ${escapeHtml(sourceLabel)}${item.reason ? ` — ${escapeHtml(item.reason)}` : ''}
      </div>
    </div>
  </div>`;
}

function autofillContentTypeSection(){
  const proposal = autofillProposal;

  const item = proposal.contentType;

  const sourceLabel = item.source.replace(/_/g,' ');
  const confColor = item.confidence==='HIGH' ? 'var(--green-text)' : item.confidence==='MEDIUM' ? 'var(--orange-text)' : 'var(--red-text)';
  return `<div class="section-block" style="border-color:var(--gold);">
    <h3>Shot Content Type</h3>
    <div class="sub" style="margin-bottom:8px;">This determines which lock requirements actually apply — e.g. an environment-only shot doesn't need character or wardrobe information.</div>
    <div class="audit-item" style="align-items:flex-start;">
      <input type="checkbox" ${checked?'checked':''} onchange="toggleAutofillItem('contentType', this.checked)" style="margin-top:2px;">
      <div style="flex:1;">
        <div style="display:flex;align-items:center;gap:8px;">
          <strong>Detected:</strong>
          <select onchange="autofillProposal.contentType.value=this.value; renderAutofillReviewModal();">

        </div>
      </div>
    </div>
  </div>`;
}

function autofillLockSection(lockKey, label){
  const proposal = autofillProposal;
  const fields = AUTOFILL_SIMPLE_LOCKS[lockKey];
  const rows = fields.map(f=>{
    const item = proposal[lockKey] && proposal[lockKey][f];
    if(!item || item.source==='AI_INFERENCE' || item.source==='AI_SUGGESTED') return '';
    return autofillItemRow(`${lockKey}.${f}`, [lockKey, f], item, fieldLabelize(f));
  }).filter(Boolean).join('');
  if(!rows) return '';
  return `<div class="section-block"><h3>${label}</h3>${rows}</div>`;
}

function autofillCharactersSection(){
  const proposal = autofillProposal;
  const chars = proposal.characters || [];
  if(chars.length===0) return '';
  const cards = chars.map((c,ci)=>{
    const matchNote = c.matchedAssetName ? `<span style="color:var(--green-text);font-size:11px;">matched: ${escapeHtml(c.matchedAssetName)}</span>` : `<span style="color:var(--orange-text);font-size:11px;">new — will be added to Asset Library</span>`;
    const fieldRows = AUTOFILL_CHARACTER_FIELDS.map(f=>{
      const item = c[f];

      return autofillItemRow(`char.${ci}.${f}`, ['characters',ci,f], item, fieldLabelize(f));
    }).filter(Boolean).join('');
    const wardrobeRows = AUTOFILL_WARDROBE_FIELDS.map(f=>{
      const item = c.wardrobe && c.wardrobe[f];
      if(!item || item.source==='AI_INFERENCE' || item.source==='AI_SUGGESTED') return '';
      return autofillItemRow(`char.${ci}.wardrobe.${f}`, ['characters',ci,'wardrobe',f], item, 'Wardrobe: '+fieldLabelize(f));

    return `<div class="entity"><div class="entity-head"><strong>${escapeHtml(c.name)}</strong>${matchNote}</div>${fieldRows || wardrobeRows ? fieldRows+wardrobeRows : '<div class="sub">No directly-sourced attributes — see AI Suggestions below if any were inferred.</div>'}</div>`;

function autofillPropsSection(){

    const rows = AUTOFILL_PROP_FIELDS.map(f=>{
      const item = p[f];
      if(!item || item.source==='AI_INFERENCE' || item.source==='AI_SUGGESTED') return '';
      return autofillItemRow(`prop.${pi}.${f}`, ['props',pi,f], item, fieldLabelize(f));
    }).filter(Boolean).join('');
    if(!rows) return '';
    return `<div class="entity"><div class="entity-head"><strong>${escapeHtml(p.name)}</strong>${matchNote}</div>${rows}</div>`;
  }).filter(Boolean).join('');

function collectAutofillSuggestions(){
  const proposal = autofillProposal;
  const items = [];
  const isSuggestionSource = (item)=> item && (item.source==='AI_INFERENCE' || item.source==='AI_SUGGESTED');
  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const item = proposal[lock] && proposal[lock][f];
      if(isSuggestionSource(item)) items.push({ pathKey:`${lock}.${f}`, pathParts:[lock,f], label:`${fieldLabelize(lock)} — ${fieldLabelize(f)}`, item });
    });
  });
  (proposal.characters||[]).forEach((c,ci)=>{
    AUTOFILL_CHARACTER_FIELDS.forEach(f=>{
      const item = c[f];
      if(isSuggestionSource(item)) items.push({ pathKey:`char.${ci}.${f}`, pathParts:['characters',ci,f], label:`${c.name} — ${fieldLabelize(f)}`, item });
    });
    AUTOFILL_WARDROBE_FIELDS.forEach(f=>{
      const item = c.wardrobe && c.wardrobe[f];
      if(isSuggestionSource(item)) items.push({ pathKey:`char.${ci}.wardrobe.${f}`, pathParts:['characters',ci,'wardrobe',f], label:`${c.name} wardrobe — ${fieldLabelize(f)}`, item });
    });
  });
  (proposal.props||[]).forEach((p,pi)=>{
    AUTOFILL_PROP_FIELDS.forEach(f=>{
      const item = p[f];
      if(isSuggestionSource(item)) items.push({ pathKey:`prop.${pi}.${f}`, pathParts:['props',pi,f], label:`${p.name} — ${fieldLabelize(f)}`, item });
    });
  });
  return items;
}

function autofillSuggestionsSection(){
  const suggestions = collectAutofillSuggestions();
  if(suggestions.length===0) return '';
  const proj = activeProject();
  const strictNote = proj.strictMode ? `<div style="font-size:11.5px;color:var(--red-text);font-weight:600;margin-bottom:8px;">Strict Production Mode is ON — these are discouraged from being applied at all. Only check one if you're deliberately overriding strict mode for this field.</div>` : '';
  return `<div class="section-block" style="border-color:var(--orange);">
    <h3 style="color:var(--orange-text);">⚠ AI Suggestion — Not Canon — Requires Approval</h3>
    <div class="sub" style="margin-bottom:10px;">These were not stated in your text, locked project knowledge, or a matched asset. They're inferred, kept separate on purpose, and unchecked by default — check one only if you actually want it applied.</div>
    ${strictNote}
    ${suggestions.map(s=>autofillItemRow(s.pathKey, s.pathParts, s.item, s.label)).join('')}

}

function autofillCompletionSummarySection(){
  const proj = activeProject();
  const previewShot = buildAutofillPreviewShot(proj);
  const previewProj = Object.assign({}, proj, { shot: previewShot });

  const rows = LOCK_DEFS.map(def=>{
    const ev = evaluateLock(previewProj, def.key);
    const score = ev.notApplicable ? 100 : (ev.status==='complete'?100:ev.status==='partial'?65:30);
    return { label: def.label, score, na: !!ev.notApplicable };
  });

  const proposal = autofillProposal || {};
  let evidenceCount = 0;
  Object.entries(AUTOFILL_SIMPLE_LOCKS).forEach(([lock, fields])=>{
    fields.forEach(f=>{
      const item = proposal[lock] && proposal[lock][f];
      if(item && item.source!=='AI_INFERENCE' && item.source!=='AI_SUGGESTED') evidenceCount++;
    });
  });
  const suggestionCount = collectAutofillSuggestions().length;
  const conflictCount = autofillStaleFields.length;

  return `<div class="section-block" style="border-color:var(--gold);">
    <h3>True Autofill Complete</h3>
    <div class="qc-grid">
      ${rows.map(r=>`<div class="qc-item"><div class="label">${escapeHtml(r.label)}${r.na?' (N/A)':''}</div><div class="bar"><div class="bar-fill" style="width:${r.score}%;background:${r.na?'var(--text-faint)':r.score>=90?'var(--green)':r.score>=60?'var(--orange)':'var(--red)'}"></div></div><div class="score mono">${r.score}%</div></div>`).join('')}
    </div>
    <div style="display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;font-size:12px;">
      <div><span style="color:var(--green-text);font-weight:700;">${evidenceCount}</span> canon / evidence-based</div>
      <div><span style="color:var(--orange-text);font-weight:700;">${suggestionCount}</span> AI-suggested — needs your decision</div>
      <div><span style="color:var(--red-text);font-weight:700;">${conflictCount}</span> possible conflict${conflictCount!==1?'s':''} with a previous shot</div>
    </div>
  </div>`;
}

function autofillStillMissingSection(){
  const proj = activeProject();
  const gaps = computeAutofillStillMissing(proj);
  if(gaps.length===0) return `<div class="section-block"><h3>Still Unspecified</h3><div class="empty-state" style="padding:12px;">Nothing critical or important left open after applying the checked items.</div></div>`;

function checkAllAutofill(val){
  // Only ever bulk-toggles evidence-bound items (USER_TEXT / PROJECT_KNOWLEDGE / ASSET_CANON / PRIOR_SHOT).
  // AI_INFERENCE suggestions are never touched by this button — they require individual opt-in every time.
  const suggestionKeys = new Set(collectAutofillSuggestions().map(s=>s.pathKey));
  Object.keys(autofillAccepted).forEach(k=>{
    if(!suggestionKeys.has(k)) autofillAccepted[k] = val;
  });
  renderAutofillReviewModal();
}

  const proj = activeProject();
  const src = { id: uid(), name: name || 'Pasted note', kind:'text', content, addedAt: Date.now(), status:'pending' };
  proj.sources.push(src);

function handlePasteSource(){
  const nameInput = document.getElementById('pasteSourceName');
  const contentInput = document.getElementById('pasteSourceContent');
  const name = nameInput.value.trim() || 'Pasted note';
  const content = contentInput.value.trim();
  if(!content){ openMessageModal('Paste some text first.'); return; }
  const src = addTextSource(name, content);
  nameInput.value=''; contentInput.value='';

}

async function extractPdfText(arrayBuffer){
  if(typeof pdfjsLib === 'undefined'){
    throw new Error('PDF reader library failed to load — check your internet connection and try again.');
  }
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    fullText += textContent.items.map(item=>item.str).join(' ') + '\n\n';
  }
  return fullText;
}

function handleFileUpload(input){
  const files = Array.from(input.files||[]);
  const proj = activeProject();
  files.forEach(file=>{
    const isImage = file.type.startsWith('image/');
    const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name);

    if(isPdf){
      const reader = new FileReader();
      reader.onload = async (e)=>{
        const src = { id: uid(), name:file.name, kind:'file', content:'', addedAt: Date.now(), status:'pending' };
        proj.sources.push(src);
        sourceBusyIds[src.id] = true;
        save(); renderAll();
        try{
          const text = await extractPdfText(e.target.result);
          if(!text || !text.trim()){
            src.status = 'error';
            delete sourceBusyIds[src.id];
            save(); renderAll();
            openMessageModal(`"${file.name}" doesn't appear to contain selectable text — it may be a scanned or image-based PDF. Try an OCR tool first, or paste the text manually.`);
            return;
          }
          src.content = text;
          delete sourceBusyIds[src.id];
          save(); renderAll();
          analyzeSource(src.id);
        }catch(err){
          console.error('PDF extraction failed', err);
          src.status = 'error';
          delete sourceBusyIds[src.id];
          save(); renderAll();
          openMessageModal(`Couldn't read "${file.name}" as a PDF: ${err.message}`);
        }
      };
      reader.readAsArrayBuffer(file);
      return;
    }

    const reader = new FileReader();
    reader.onload = (e)=>{
      let src;
      if(isImage){
        src = { id: uid(), name:file.name, kind:'image', imageData: e.target.result.split(',')[1], mediaType:file.type, addedAt: Date.now(), status:'pending' };
      } else {
        src = { id: uid(), name:file.name, kind:'file', content: e.target.result, addedAt: Date.now(), status:'pending' };
      }
      proj.sources.push(src);
      save(); renderAll();
      analyzeSource(src.id);
    };
    if(isImage) reader.readAsDataURL(file);
    else reader.readAsText(file);
  });
  input.value='';
}

/* ---------- extraction ---------- */

const EXTRACTION_SYSTEM = `You are the project-knowledge extraction engine inside Xpert Prompt, a production tool for AI image/video creators. Extract concrete, reusable production facts from the material provided — the project may be a film, book, product, commercial, game, or anything else, so do not assume a fixed structure.

Return ONLY a JSON array, no preamble, no markdown fences. Each item:
{"category": one of [${KNOWLEDGE_CATEGORIES.map(c=>`"${c}"`).join(', ')}], "subject": short noun phrase this fact is about (e.g. "Zeke Lamb", "the vehicle", "brand logo"), "fact": one concise factual sentence, stated as the source states it (do not invent or embellish)}

Only extract facts that are actually stated in the material. If the material has no extractable production facts, return [].`;

async function analyzeSource(sourceId){
  const proj = activeProject();
  const src = proj.sources.find(s=>s.id===sourceId);
  if(!src) return;
  if(!hasAIKey()){
    openAISettingsModal('Add your Anthropic API key to analyze project sources.');
    return;
  }
  sourceBusyIds[sourceId] = true;
  renderAll();
  try{
    let newFacts = [];
    if(src.kind==='image'){
      const userContent = [
        { type:'image', source:{ type:'base64', media_type: src.mediaType||'image/jpeg', data: src.imageData } },
        { type:'text', text: 'Extract production facts visible in this reference image (appearance, wardrobe, materials, colors, environment, style — whatever applies). Follow the JSON format from your instructions.' }
      ];
      const raw = await callClaude(EXTRACTION_SYSTEM, userContent);
      const parsed = parseJsonSafe(raw);
      if(Array.isArray(parsed)) newFacts = parsed;
    } else {
      const chunks = chunkText(src.content || '', 3000);
      for(const chunk of chunks){
        const raw = await callClaude(EXTRACTION_SYSTEM, `SOURCE: ${src.name}\n\nMATERIAL:\n${chunk}`);
        const parsed = parseJsonSafe(raw);
        if(Array.isArray(parsed)) newFacts = newFacts.concat(parsed);
      }
    }
    newFacts.forEach(f=>{
      if(!f || !f.fact) return;
      proj.facts.push({
        id: uid(), sourceId: src.id, sourceName: src.name,
        category: KNOWLEDGE_CATEGORIES.includes(f.category) ? f.category : 'creative rules',
        subject: f.subject || 'general', factText: f.fact,
        status: 'proposed', createdAt: Date.now(),
      });
    });
    src.status = 'analyzed';
    recomputeConflicts(proj);
  }catch(e){
    console.error('Analysis failed', e);
    src.status = 'error';
    if(e.code==='NO_API_KEY'){ openAISettingsModal('Add your Anthropic API key to analyze project sources.'); }
  }
  delete sourceBusyIds[sourceId];
  save(); renderAll();
}

function removeSource(sourceId){
  openConfirmModal({
    title: 'Remove source?',
    message: 'Remove this source? Facts already extracted from it will remain but lose their source link.',
    confirmLabel: 'Remove',
    danger: true,
    onConfirm: ()=>{
      const proj = activeProject();
      proj.sources = proj.sources.filter(s=>s.id!==sourceId);
      save(); renderAll();

}

/* ---------- conflict detection ---------- */

function recomputeConflicts(proj){
  const groups = {};
  proj.facts.filter(f=>f.status!=='rejected').forEach(f=>{
    const key = f.category + '::' + normalizeSubject(f.subject);
    (groups[key] = groups[key]||[]).push(f);
  });
  // clear old conflict flags, recompute fresh
  proj.facts.forEach(f=>{ f.conflictGroup = null; });
  Object.entries(groups).forEach(([key,list])=>{
    if(list.length<2) return;
    const distinctTexts = new Set(list.map(f=>normalizeSubject(f.factText)));
    if(distinctTexts.size>1){
      list.forEach(f=>{ f.conflictGroup = key; });
    }
  });
}

function setFactStatus(factId, status){
  const proj = activeProject();
  const f = proj.facts.find(x=>x.id===factId);
  if(!f) return;
  f.status = status;
  recomputeConflicts(proj);
  save(); renderAll();
}

function editFactText(factId){
  const proj = activeProject();
  const f = proj.facts.find(x=>x.id===factId);
  if(!f) return;
  openTextInputModal({
    title: 'Edit fact',
    defaultValue: f.factText,
    confirmLabel: 'Save',
    allowEmpty: true,
    onConfirm: (newText)=>{
      f.factText = newText;
      f.status = 'edited';
      recomputeConflicts(proj);
      save(); renderAll();
    }
  });
}

function resolveConflictKeep(conflictGroup, keepFactId){
  const proj = activeProject();
  proj.facts.filter(f=>f.conflictGroup===conflictGroup).forEach(f=>{
    if(f.id===keepFactId){ f.status='approved'; }
    else { f.status='rejected'; }
  });
  recomputeConflicts(proj);
  save(); renderAll();
}

function resolveConflictRejectAll(conflictGroup){
  openConfirmModal({
    title: 'Reject all conflicting facts?',
    message: 'None of the conflicting statements will be treated as canon. You can add a corrected source or fact later.',
    confirmLabel: 'Reject all',
    danger: true,
    onConfirm: ()=>{
      const proj = activeProject();
      proj.facts.filter(f=>f.conflictGroup===conflictGroup).forEach(f=>{ f.status='rejected'; });
      recomputeConflicts(proj);
      save(); renderAll();
    }
  });
}

function resolveConflictReplace(conflictGroup){
  const proj = activeProject();
  const facts = proj.facts.filter(f=>f.conflictGroup===conflictGroup);
  if(facts.length===0) return;
  openTextInputModal({
    title: 'Replace with current canon',
    message: `Write the correct, current fact about "${facts[0].subject}". This replaces every conflicting statement below — none of them have to be right as written.`,
    placeholder: 'e.g. The vehicle is matte black with silver trim, repainted after the Season 2 finale.',
    confirmLabel: 'Save as canon',
    onConfirm: (text)=>{
      facts.forEach(f=>{ f.status='rejected'; });
      proj.facts.push({
        id: uid(), sourceId: null, sourceName: 'Manual correction (you)',
        category: facts[0].category, subject: facts[0].subject, factText: text,
        status: 'locked', createdAt: Date.now(),
      });
      recomputeConflicts(proj);
      save(); renderAll();
    }
  });
}

async function askProject(){

  const authoritative = proj.facts.filter(f=>f.status==='approved'||f.status==='locked'||f.status==='edited');
  const factList = authoritative.map(f=>`[${f.category}] ${f.subject}: ${f.factText} (source: ${f.sourceName})`).join('\n');
  const system = `You answer questions about a creative production project using ONLY the facts provided below. Never invent information. If the facts don't cover the question, reply exactly: "NOT SPECIFIED IN PROJECT SOURCES." If facts conflict, describe the conflict instead of picking one. Cite the source name for any fact you use.\n\nPROJECT FACTS:\n${factList || '(no approved facts yet)'}`;
  try{

    askProjectAnswer = (e.code==='NO_API_KEY') ? 'Add your Anthropic API key in AI Settings first.' : 'Something went wrong reaching the project knowledge engine. Try again.';
  }
  askProjectBusy = false;
  save();
  renderAll();

/* ---------- retrieval into locks ---------- */

function getRelevantFacts(proj, lockKey, limit){
  const shot = proj.shot;
  const authoritative = proj.facts.filter(f=> (f.status==='approved'||f.status==='locked'||f.status==='edited') && CATEGORY_TO_LOCK[f.category]===lockKey);
  if(authoritative.length===0) return [];
  // build keyword set from what's attached to this shot
  const keywords = new Set();
  shot.characterRefs.forEach(cr=>{ const c=proj.characters.find(x=>x.id===cr.charId); if(c&&c.name) keywords.add(normalizeSubject(c.name)); });
  if(shot.set.setName) keywords.add(normalizeSubject(shot.set.setName));
  shot.props.forEach(p=>{ if(p.propName) keywords.add(normalizeSubject(p.propName)); });
  let relevant = authoritative.filter(f=>{
    const subj = normalizeSubject(f.subject);
    if(keywords.size===0) return true; // nothing attached yet — show general facts for this lock
    for(const k of keywords){ if(k && (subj.includes(k) || k.includes(subj))) return true; }
    // style/forbidden/camera/lighting facts are usually project-wide, always relevant
    return ['style','forbidden','camera','lighting'].includes(lockKey);
  });
  return limit ? relevant.slice(0, limit) : relevant;
}

function knowledgePanel(proj, lockKey){
  const facts = getRelevantFacts(proj, lockKey, 6);
  if(facts.length===0) return '';
  return `<div style="background:var(--bg-raised);border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-top:2px;">
    <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--cyan);margin-bottom:6px;">From Project Knowledge</div>

      </div>`).join('')}
    </div>
  </div>`;
}

function statusChip(status, notApplicable){
  if(notApplicable) return `<span class="status-chip" style="background:rgba(155,161,168,0.18);color:var(--text-dim);">N/A</span>`;
  if(status==='complete') return `<span class="status-chip status-complete">Complete</span>`;
  if(status==='partial') return `<span class="status-chip status-partial">Partial</span>`;
  return `<span class="status-chip status-missing">Missing</span>`;
}

function lockHeader(num, key, label, status, notApplicable){
  const open = !!openLocks[key];
  return `<div class="lock-card-head" onclick="toggleLock('${key}')">
    <div class="lock-title"><span class="lock-num">${num}</span>${label}</div>
    <div style="display:flex;align-items:center;gap:10px;">
      ${statusChip(status, notApplicable)}
      <button class="btn btn-sm btn-ghost" style="padding:2px 8px;font-size:11px;" onclick="event.stopPropagation(); confirmResetLock('${key}');" title="Clear this shot's ${label} fields only — never touches your Asset Library or Project Knowledge">Reset</button>
      <span class="chev ${open?'open':''}">▶</span>
    </div>
  </div>`;
}

function toggleLock(key){ openLocks[key] = !openLocks[key]; renderAll(); setTimeout(()=>document.getElementById('lock-'+key)?.scrollIntoView({behavior:'smooth',block:'nearest'}),30); }

function fieldWarn(missingList, label){
  // returns inline warn note html if this label text appears in the missing arrays
  return '';
}

function auditNote(ev){
  if(ev.missing.CRITICAL.length===0 && ev.missing.IMPORTANT.length===0 && ev.missing.OPTIONAL.length===0) return '';
  const items = [...ev.missing.CRITICAL.map(m=>['CRITICAL',m]), ...ev.missing.IMPORTANT.map(m=>['IMPORTANT',m]), ...ev.missing.OPTIONAL.map(m=>['OPTIONAL',m])];
  return `<div class="audit-list">${items.map(([tag,txt])=>`<div class="audit-item"><span class="audit-tag ${tag}">${tag}</span><span>${escapeHtml(txt)}</span></div>`).join('')}</div>`;
}

function visualRefStatusLine(entity){
  const refs = (entity.referenceImages||[]);
  if(refs.length===0) return `<div style="font-size:11.5px;color:var(--orange-text);margin-bottom:8px;">✗ No visual reference attached — text canon only</div>`;
  const master = refs.some(r=>r.authorityLevel==='MASTER CANON');
  const supporting = refs.filter(r=>r.authorityLevel!=='MASTER CANON').length;
  return `<div style="font-size:11.5px;color:var(--green-text);margin-bottom:8px;">
    ✓ Character Canon Attached${master?'<br>✓ Master Visual Reference Attached':''}${supporting>0?`<br>✓ ${supporting} Supporting Reference${supporting>1?'s':''} Available`:''}
  </div>`;
}

function saveWardrobeAsDefault(charId){
  const proj = activeProject();
  const c = proj.characters.find(x=>x.id===charId);
  const wr = proj.shot.wardrobeRefs.find(x=>x.charId===charId);
  if(!c || !wr) return;
  const summary = [wr.top, wr.bottom, wr.outerwear, wr.shoes].filter(Boolean).join(', ');
  openConfirmModal({
    title: 'Save as permanent default wardrobe?',
    message: `This updates ${c.name}'s saved Asset Library entry to: "${summary}". It becomes the default for every future shot unless overridden.`,
    confirmLabel: 'Save to Asset Library',
    onConfirm: ()=>{
      c.defaultWardrobe = summary;
      save();
      openMessageModal(`Saved. ${c.name}'s default wardrobe is now updated in the Asset Library.`);
    }
  });
}

/* ---------- Per-lock Reset — clears only THIS shot's fields for one lock.
   Never touches proj.characters/sets/props (Asset Library) or Project
   Knowledge — those are project-level data and are structurally untouched
   by anything in this function. Detaching a character/wardrobe/prop from
   the shot removes the shot-level reference only; the saved asset itself
   is never modified or deleted. */

const LOCK_RESET_LABELS = {
  style: 'Style', character: 'Character', set: 'Set / Environment', wardrobe: 'Wardrobe',
  prop: 'Prop / Technology', camera: 'Camera', lighting: 'Lighting / Atmosphere',
  action: 'Action / Movement', continuity: 'Continuity', forbidden: 'Forbidden Deviations',
};

function confirmResetLock(lockKey){
  openConfirmModal({
    title: `Reset ${LOCK_RESET_LABELS[lockKey]} Lock?`,
    message: `This clears this shot's ${LOCK_RESET_LABELS[lockKey]} information only. Nothing in your Asset Library, Project Knowledge, or Project Bible is affected.`,
    confirmLabel: 'Reset lock',
    danger: true,
    onConfirm: ()=> resetLock(lockKey),
  });
}

function resetLock(lockKey){
  const proj = activeProject();
  const shot = proj.shot;
  const blank = blankShot(); // used only as a source of blank field defaults, never assigned wholesale

  if(lockKey==='style') shot.style = blank.style;
  else if(lockKey==='character') shot.characterRefs = []; // detaches only — proj.characters (Asset Library) untouched
  else if(lockKey==='set') shot.set = blank.set;
  else if(lockKey==='wardrobe') shot.wardrobeRefs = []; // detaches only — proj.characters' defaultWardrobe untouched
  else if(lockKey==='prop') shot.props = []; // clears shot-level prop refs only — proj.props (Asset Library) untouched
  else if(lockKey==='camera') shot.camera = blank.camera;
  else if(lockKey==='lighting') shot.lighting = blank.lighting;
  else if(lockKey==='action') shot.action = blank.action;
  else if(lockKey==='continuity') shot.continuity = blank.continuity;
  else if(lockKey==='forbidden') shot.forbidden = blank.forbidden;

  save();
  renderAll();
}

/* ---------- + New Shot — Fresh vs Continue From Previous ----------
